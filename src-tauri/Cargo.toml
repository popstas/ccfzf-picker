[package]
name = "ccfzf-picker"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# image-png — ради `Image::from_bytes` для иконки трея: без него Tauri умеет
# собрать картинку только из сырой RGBA, а не из PNG.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"

[profile.release]
lto = true
codegen-units = 1
