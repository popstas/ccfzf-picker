[package]
name = "ccfzf-picker"
version = "0.9.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# image-png — ради `Image::from_bytes` для иконки трея: без него Tauri умеет
# собрать картинку только из сырой RGBA, а не из PNG.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
# Просьба о подъёме окна: публикация в тот же топик, который уже слушает демон
# на Windows-машине. Единственный транспорт этой просьбы — http-сервер, стоявший
# здесь раньше, вешал демона на той стороне.
rumqttc = "0.24"
# Иконка приложения из exe уезжает на страницу картинкой: PNG — единственный
# формат, который <img src="data:…"> понимает без кода на странице. Крейт уже
# в дереве (Tauri тянет его ради image-png), прямая запись нужна ради `use`.
png = "0.17"
# Тот же data-URI: base64 руками — двадцать строк и свой тест, крейт дешевле.
base64 = "0.22"
# Время сборки в пункте меню трея. Штамп приезжает из build.rs числом секунд, а
# перевести его в местные дату и время — это календарь и часовой пояс, то есть
# ровно то, что руками писать не стоит. `default-features = false` + `clock`:
# нужен только местный пояс, ни сериализации, ни wasm тут не бывает.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# AllowSetForegroundWindow: Windows отдаёт передний план только тому, кто им
# уже владеет. Право надо выдать демону трекера явно, иначе он поднимет окно
# «успешно», а на экране только мигнёт кнопка на таскбаре. Версия та же, что
# уже тянет Tauri, — иначе в сборке оказались бы два разных `windows`.
#
# Остальные features — ради иконок из exe: Shell (SHGetFileInfoW), Gdi
# (битмапы иконки), FileSystem и IO (reparse point за app-execution alias),
# Environment (раскрытие `%SystemRoot%` в пути из конфига). `Win32_Security`
# сам по себе не нужен, но без него `CreateFileW` из `Win32_Storage_FileSystem`
# не существует: в её сигнатуре стоит `SECURITY_ATTRIBUTES`, и крейт прячет
# всю функцию за этой feature. `Win32_System_Com` — ради пары
# `CoInitializeEx`/`CoUninitialize` вокруг `SHGetFileInfoW`: шелл идёт за
# иконкой в свои расширения, а те без апартамента у потока не отвечают.
# `Win32_System_LibraryLoader` — ради `GetModuleHandleW` в `scrim.rs`: окну
# подложки нужен `hInstance` текущего процесса, и передавать туда пустой
# честнее не пытаться — он не всегда работает так же, как настоящий.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }

# Подложка позади пикера (`scrim.rs`) на маке — тем же приёмом, каким Windows
# выше уже пользуется `windows`: своя реализация ниже уровня Tauri, крейты
# биндинга к AppKit. Версии те же, что уже стоят в Cargo.lock транзитивно
# через tao/wry (macOS-сборка их и так тянет ради собственных окон), а
# `default-features = false` — потому что дефолт у `objc2-app-kit` тянет весь
# фреймворк разом (Core Video, QuartzCore, CloudKit — десяток крейтов, ни один
# из них подложке не нужен). Четырёх features хватает: NSWindow — само окно,
# уровень и стиль; NSScreen — куда его положить; NSColor и NSGraphics —
# заливка и тип бэкинга.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSWindow",
    "NSScreen",
    "NSColor",
    "NSGraphics",
    # Клик по подложке гасит пикер, и разбирает его своя вьюха
    # (`ScrimView` в `scrim.rs`): NSView — её предок, NSResponder — под этой
    # feature лежат его методы у самого NSView, NSEvent — аргумент
    # `mouseDown:`.
    "NSView",
    "NSResponder",
    "NSEvent",
] }

# Профиль собран под выкатку, а не под витрину: `deploy-*.sh` зовёт
# `cargo build --release` на целевой машине, и время сборки здесь — это время,
# которое человек стоит и ждёт.
#
# Замерено на целевой Windows-машине (i5-12600K, 16 потоков, каталог сборки в
# исключениях Defender — иначе первым подозреваемым был бы он), пересборка
# после правки одной строки в `main.rs`; правка файла фронтенда даёт те же
# числа — обе дороги ведут в полную перекомпиляцию крейта:
#
#   lto = true,  codegen-units = 1                    208 с   13,1 МБ
#   lto = "thin", codegen-units = 16                  112 с   14,4 МБ
#   lto = false, codegen-units = 16                    70 с   14,0 МБ
#   lto = false, codegen-units = 16, incremental       37 с   14,1 МБ
#
# На сборочном маке (MacBook Air, 10 ядер) та же правка стоит 52,8 с на прежнем
# профиле и 5,9 с на нынешнем — по два прогона, разброс в сотых. Абсолютные
# числа там вчетверо меньше, а рычаг тот же: вся разница — фронт компиляции
# одного крейта, и снимает её `incremental` одинаково на обеих машинах.
#
# Оптимизации всей программы пикер не окупает: он спит, раз в секунду читает
# ответ агрегатора и правит различающиеся строки в DOM. Мегабайт бинаря платят
# один раз, три минуты — каждую выкатку.
#
# Первые две строки — умолчания release, и стоят они здесь ради этой таблицы:
# без них следующий, кому сборка покажется медленной, вернул бы `lto = true`,
# не зная цены. Работу делает только `incremental`.
[profile.release]
lto = false
codegen-units = 16
incremental = true
