[package]
name = "ccfzf-picker"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# image-png — ради `Image::from_bytes` для иконки трея: без него Tauri умеет
# собрать картинку только из сырой RGBA, а не из PNG.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
# Клиент оконного трекера. Блокирующий и без TLS намеренно: трекер отвечает по
# http в локальной сети, а запрос всё равно уходит в spawn_blocking рядом с
# ssh. rustls тянуть было бы не за что.
ureq = { version = "2", default-features = false, features = ["json"] }

# AllowSetForegroundWindow: Windows отдаёт передний план только тому, кто им
# уже владеет. Право надо выдать демону трекера явно, иначе он поднимет окно
# «успешно», а на экране только мигнёт кнопка на таскбаре. Версия та же, что
# уже тянет Tauri, — иначе в сборке оказались бы два разных `windows`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
