<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>claude sessions</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; overflow: hidden; position: relative;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1e1f22; color: #e6e6e6;
            border: 1px solid #3a3d42; border-radius: 10px;
            display: flex; flex-direction: column;
        }
        #search {
            width: 100%; padding: 16px 18px; font-size: 18px;
            background: transparent; color: inherit;
            border: none; border-bottom: 1px solid #3a3d42; outline: none;
            flex: 0 0 auto;
        }
        #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 0; }
        #statusline {
            height: 28px; padding: 0 18px; display: flex; align-items: center; gap: 14px;
            font-size: 11px; color: #7d838c; border-top: 1px solid #3a3d42;
            user-select: none; flex: 0 0 28px;
        }
        #sort-control {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer;
        }
        #sort-control:hover { color: #a8adb5; }
        #statusline .icon { font-size: 12px; line-height: 1; }
        /* Подсказка про Ctrl+K, между переключателем сортировки и чекбоксами.
           min-width: 0 + ellipsis — тем же приёмом, что .text у строки списка:
           при узком окне подсказка обрезается первой, а не толкает
           status-checks (у него margin-left: auto) или не ломает раскладку. */
        #menu-hint {
            flex: 1 1 auto; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .status-checks {
            display: flex; align-items: center; gap: 12px; margin-left: auto;
        }
        .status-check {
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; color: #7d838c;
        }
        .status-check:hover { color: #a8adb5; }
        /* Левая половина чекбоксов (то, что рисуется под именем сессии) отбита
           от правой (колонки справа) — к обычным 12px ещё столько же. */
        .status-check.gap { margin-left: 12px; }
        .status-check input {
            margin: 0; accent-color: #7d838c; cursor: pointer;
        }
        .group-label {
            padding: 8px 18px 4px; font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; color: #7d838c;
        }
        .row {
            display: flex; align-items: center; gap: 12px;
            padding: 7px 18px; cursor: pointer;
        }
        .row.active { background: #31343a; }
        .row.active .cwd { color: #9aa0a8; }
        .dot {
            flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
            background: #6e7681;
        }
        /* Агент работает. */
        .dot.active { background: #3fb950; }
        /* Агент спрашивает — ждёт ответа человека. */
        .dot.question { background: #d29922; }
        /* Агент закончил, результат ещё не смотрели. */
        .dot.review { background: #db6d28; }
        /* Простаивает: закончил и постоял, считается проверенным. */
        .dot.idle { background: #6e7681; }
        /* Закрытая сессия — кружка нет, но место под него остаётся,
           иначе текст закрытых строк съезжает относительно живых. */
        .dot.closed { background: transparent; }
        /* Пока держат Shift, строка под курсором показывает, что с ней сделает
           клик: кружок становится пустой оранжевой рамкой — тем же оранжевым,
           каким горит непросмотренная сессия. Только у строк, которые есть чем
           пометить: обещать пометку там, где Shift+клик ничего не делает,
           хуже, чем не обещать ничего. */
        body.shift .row.markable:hover .dot {
            background: transparent;
            box-shadow: inset 0 0 0 2px #db6d28;
        }
        /* Тусклое имя — там, где строка есть, а дела до неё сейчас нет:
           закрытая сессия и сессия снимка, чьё окно уже на экране (её
           восстановление пропустит). Случая два, цвет один — правило одно. */
        .row.closed .name,
        .row.snapshot-session.on-screen .name { color: #a8adb5; }
        /* Заголовок раскладки. Не group-label: у него есть своё действие —
           Enter поднимает снимок целиком, — поэтому это строка, а не подпись.
           Отличается от строки сессии разрядкой и цветом подписи, как группа. */
        .row.snapshot .name {
            font-size: 11px; letter-spacing: .06em; color: #9aa0a8;
        }
        .row.snapshot .dot { background: #4d525a; }
        .text { min-width: 0; }
        .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cwd { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Чем сессия закончила / что спросили. Тусклее пути: это подсказка, а
           не опознание — строку ищут глазами по названию и каталогу. */
        .summary { font-size: 11px; color: #6f757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prompt { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Метка PR — той же тусклостью, что и колонка хоткея: опознают строку
           по имени и пути, это подсказка рядом. */
        .name .pr { margin-left: 6px; font-size: 11px; color: #7d838c; font-weight: normal; }
        /* Правые колонки одной группой: статус, id, контекст с деньгами,
           возраст. Прижимает их сюда именно она — раньше это делала `.state`
           своим margin-left: auto, и выключенный чекбокс события уносил
           остальные колонки к названию сессии. Теперь любая колонка может
           пропасть, а группа останется справа. */
        .meta {
            flex: 0 0 auto; margin-left: auto;
            display: flex; align-items: center; gap: 12px;
        }
        /* Текстовый статус агента. */
        .state {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Короткий id сессии — тем же, чем `claude --resume` и имя транскрипта.
           Моноширинные цифры, как у контекста и возраста: колонка из четырёх
           знаков не должна дышать от строки к строке. */
        .sid {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* Хоткей проекта (`^F12`). Раньше стоял подписью внутри имени сессии,
           теперь колонка — см. hotkeyHtml в session-glyph.js. */
        .hk {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Пометка «окно терминала уже открыто». Ширина задана жёстко: у сессий
           без окна элемент пустой, и без ширины колонка дышала бы от строки к
           строке. Цвет как у живого статуса — это признак того же рода: сессия,
           до которой можно дотянуться прямо сейчас. */
        .win {
            flex: 0 0 auto; width: 10px; padding-left: 10px;
            font-size: 11px; color: #3fb950; text-align: center;
        }
        /* Контекст и деньги, между статусом и возрастом. */
        .usage {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* Заполненность контекста. Жёлтый — тот же, что у спрашивающего агента:
           «обрати внимание». Красный — «скоро начнёт забывать начало». */
        .usage .ctx.warn { color: #d29922; }
        .usage .ctx.hot { color: #f85149; }
        .usage .cost { color: #6f757e; }
        /* Возраст последней активности, крайняя правая колонка. */
        .age {
            flex: 0 0 auto; padding-left: 10px; min-width: 34px; text-align: right;
            font-size: 11px; color: #7d838c; font-variant-numeric: tabular-nums;
        }
        /* Сколько у проекта сессий и сколько из них живых. Рядом с возрастом,
           поэтому цифры моноширинные — колонки не должны разъезжаться. */
        .count {
            flex: 0 0 auto; padding-left: 10px; min-width: 48px; text-align: right;
            font-size: 11px; color: #7d838c; font-variant-numeric: tabular-nums;
            /* nowrap, как у соседних колонок: `123 · 45●` шире min-width, а `●`
               под tabular-nums не попадает — на WebView2 метрики этого знака
               наименее предсказуемы, и без запрета строка переносилась бы. */
            white-space: nowrap;
        }
        /* Отметка проекта в ccfzf (★ в его собственном списке). */
        .mark { color: #d29922; }
        #message { padding: 24px 18px; color: #868c95; font-size: 13px; flex: 0 0 auto; }
        /* Ctrl+K actions overlay — sits above the session list, same palette. */
        #actions-backdrop {
            display: none; position: absolute; inset: 0; z-index: 10;
            background: rgba(0, 0, 0, .45);
            align-items: center; justify-content: center; padding: 24px;
        }
        #actions-backdrop.open { display: flex; }
        #actions-menu {
            width: min(360px, 100%); background: #25262a;
            border: 1px solid #3a3d42; border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45); overflow: hidden;
        }
        #actions-title {
            padding: 12px 16px 8px; font-size: 11px; color: #7d838c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #3a3d42;
        }
        #actions-list { padding: 6px 0; }
        /* flex, а не блок: подпись клавиши прижимается вправо тем же приёмом,
           что и колонка статуса в строке списка (margin-left: auto), а не
           текстом внутри одной строки — иначе делить их пришлось бы вручную. */
        .action-row {
            display: flex; align-items: center;
            padding: 10px 16px; font-size: 13px; cursor: pointer;
        }
        .action-row.active { background: #31343a; }
        .action-label {
            flex: 1 1 auto; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        /* Прямая клавиша действия, тусклым — тем же цветом, что и колонка .hk. */
        .action-hotkey {
            flex: 0 0 auto; margin-left: auto; padding-left: 12px;
            font-size: 11px; color: #7d838c;
        }
        #actions-empty {
            display: none; padding: 16px; font-size: 13px; color: #868c95;
        }
        /* Session info — тот же модал, что и меню действий: разные только
           содержимое и ширина. */
        #info-backdrop {
            display: none; position: absolute; inset: 0; z-index: 10;
            background: rgba(0, 0, 0, .45);
            align-items: center; justify-content: center; padding: 24px;
        }
        #info-backdrop.open { display: flex; }
        #info-card {
            width: min(560px, 100%); max-height: 100%; overflow-y: auto;
            background: #25262a; border: 1px solid #3a3d42; border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
        }
        #info-title {
            padding: 12px 16px 8px; font-size: 11px; color: #7d838c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #3a3d42;
        }
        #info-rows { padding: 8px 0; }
        .info-row { display: flex; gap: 12px; padding: 3px 16px; font-size: 12px; }
        .info-row .k { flex: 0 0 96px; color: #7d838c; }
        .info-row .v { min-width: 0; word-break: break-word; }
    </style>
</head>
<body>
<input id="search" type="text" placeholder="Search claude sessions…" autocomplete="off" spellcheck="false">
<div id="list"></div>
<div id="message">Loading…</div>
<div id="statusline">
  <span id="sort-control" title="Click to change sort"><span class="icon">⇅</span><span id="sort-label">cost</span></span>
  <!-- Пусто: текст ставит paintToggles — хвост про `^S` зависит от ответа. -->
  <span id="menu-hint"></span>
  <!-- Наполняется из TOGGLE_CHECKS: разметка и обработчики не должны
       расходиться в именах ключей. -->
  <span class="status-checks" id="status-checks"></span>
</div>
<div id="actions-backdrop" aria-hidden="true">
  <div id="actions-menu" role="menu">
    <div id="actions-title"></div>
    <div id="actions-list"></div>
    <div id="actions-empty">No open actions for this session.</div>
  </div>
</div>
<div id="info-backdrop" aria-hidden="true">
  <div id="info-card" role="dialog">
    <div id="info-title"></div>
    <div id="info-rows"></div>
  </div>
</div>
<script src="state-shape.js"></script>
<script src="session-agent.js"></script>
<script src="session-list.js"></script>
<script src="session-windows.js"></script>
<script src="open-transport.js"></script>
<script src="session-groups.js"></script>
<!-- ui-state после session-groups: он берёт оттуда normalizeSort в момент
     загрузки, и в обратном порядке ему достался бы undefined. -->
<script src="ui-state.js"></script>
<script src="session-glyph.js"></script>
<script src="session-info.js"></script>
<!-- session-name до open-strategy: тот берёт из него uniqueSessionName в
     момент загрузки, и в обратном порядке ему достался бы undefined. -->
<script src="session-name.js"></script>
<!-- open-strategy до session-actions: тот берёт из него buildAttachCommand в
     момент загрузки, и в обратном порядке ему достался бы undefined. Тесты
     этого не поймают — там require, а он от порядка тегов не зависит. -->
<script src="open-strategy.js"></script>
<!-- path-map до session-actions, action-hotkey до config-shape: оба берут
     соседа из globalThis в момент загрузки, и в обратном порядке им достался бы
     undefined. Тесты этого не поймают — там require, а он от порядка тегов не
     зависит; ловит порядок test/frontend-load.test.js. -->
<script src="path-map.js"></script>
<script src="action-hotkey.js"></script>
<script src="session-actions.js"></script>
<script src="config-shape.js"></script>
<script src="picker-filter.js"></script>
<script src="picker-snapshots.js"></script>
<script src="picker-mode.js"></script>
<script src="project-list.js"></script>
<script src="picker-list-sync.js"></script>
<script>
  let groups = [];
  let rows = [];
  let active = 0;
  // Умолчание — из session-groups, а не литералом: иначе список открывался бы
  // в одном порядке, а ui.json без сохранённой сортировки нормализовался бы в
  // другой.
  let sortMode = window.SessionGroups.DEFAULT_SORT;
  // Прочитанное живёт на этой машине: трекера окон здесь нет, отметку ставит
  // само открытие сессии. Читается из ~/.config/ccfzf-picker/seen.json один
  // раз за загрузку окна — см. start().
  let seen = {};
  // Умолчания до того, как прочитан ~/.config/ccfzf-picker/config.yaml: без
  // файла пикер должен работать целиком, поэтому здесь не пусто, а
  // нормализованный конфиг по умолчанию. См. start().
  let CONFIG = window.ConfigShape.normalizeConfig(null);
  // Последний ответ агрегатора. Смена сортировки и чекбоксов перекладывает эти
  // же сессии, а не ждёт следующего опроса: ждать пришлось бы до секунды, и
  // клик выглядел бы не сработавшим.
  let lastSessions = [];
  // Проекты последнего ответа, уже разложенные в строки. Отдельно от сессий:
  // они не группируются, не сортируются здесь и не фильтруются по onlyLive.
  let projectRows = [];
  // Снимки раскладки окон из последнего ответа, как приехали. В строки их
  // раскладывает buildSnapshotRows на каждой отрисовке: отбор запросом и
  // пометка «окно открыто» считаются по свежему ответу, а не по прошлому.
  let snapshotRows = [];
  // Текст отказа: не смогли спросить удалённый хост или ответ пришёл не той формы.
  // Держится до первого удачного опроса, а не до следующей отрисовки, — иначе
  // он мигал бы раз в секунду.
  let error = '';
  // Сообщение об удавшемся действии. Живёт по таймеру, а не до следующей
  // отрисовки: список перерисовывается раз в секунду, и без таймера подпись
  // мелькнула бы и исчезла раньше, чем её успели прочитать.
  let notice = '';
  let noticeTimer = null;

  function showNotice(text) {
    notice = text;
    if (noticeTimer !== null) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { notice = ''; noticeTimer = null; render(); }, 4000);
    render();
  }

  // check_ssh_host в src-tauri/src/main.rs закрывает только fetch_state.
  // Запуск терминала идёт мимо неё, через spawn_detached, и без этой
  // проверки ненастроенный конфиг показал бы сырую ошибку ssh в отдельном
  // окне — там, где её никто не связывает с конфигом пикера.
  function sshHostMissing() {
    if (CONFIG.sshHost && CONFIG.sshHost.trim()) return false;
    error = 'sshHost не задан: скопируйте config.example.yml в ~/.config/ccfzf-picker/config.yaml';
    render();
    return true;
  }
  // Чекбоксы statusline. Набор ключей задаётся здесь и только здесь: его же
  // читает normalizeUiState, отбрасывая из ui.json всё, чего в этом списке нет.
  // Порядок и группы — как в самой строке списка: сначала то, что рисуется
  // слева под именем сессии, потом, через отбивку, правые колонки. Иначе
  // чекбоксы перечисляют то же самое в третьем порядке, и глазами их каждый
  // раз приходится искать заново.
  //
  // Третья группа, `filter`, — не про колонки вовсе: она решает, какие строки
  // вообще попадут в список. Стоит последней и за своей отбивкой именно
  // поэтому: перепутать «спрятать колонку» с «спрятать сессии» стоит дороже
  // всего остального в этом ряду.
  const TOGGLE_CHECKS = [
    { key: 'showPrompt', label: 'prompt', side: 'left' },
    { key: 'showAnswer', label: 'answer', side: 'left' },
    { key: 'showPaths', label: 'paths', side: 'left' },
    { key: 'showHotkey', label: 'hotkeys', side: 'right' },
    { key: 'showEvent', label: 'events', side: 'right' },
    { key: 'showId', label: 'id', side: 'right' },
    { key: 'showCost', label: 'cost', side: 'right' },
    { key: 'showContext', label: 'context', side: 'right' },
    { key: 'showWindow', label: 'window', side: 'right' },
    { key: 'onlyWindow', label: 'only windowed', side: 'filter' },
  ];
  // Умолчания. Выключены те колонки, что отвечают на вопрос «как эта сессия
  // дошла до жизни такой», а не «стоит ли в неё заходить»: событие и цена
  // интересны разбирательству постфактум, а в списке они каждую строку
  // удлиняют. Включаются чекбоксом, и выбор переживает перезапуск (ui.json).
  let toggles = {
    showPrompt: true,
    showAnswer: true,
    showPaths: true,
    showHotkey: true,
    showEvent: false,
    showId: false,
    showCost: false,
    showContext: true,
    showWindow: true,
    // Выключен: список без трекера и так весь без окон, и включённый фильтр
    // показал бы пустоту вместо сессий — с виду неотличимо от сломанного ssh.
    onlyWindow: false,
  };
  let menuOpen = false;
  let menuActions = [];
  let menuActive = 0;
  let menuSessionId = null;
  let infoOpen = false;

  // Одна таблица «id действия ⇄ клавиша» на всё: подписи в меню Ctrl+K и
  // обработчики прямых клавиш ниже читают именно её. Раньше клавиша была
  // зашита в DIRECT_OPEN_KEYS, а Ctrl+U/Ctrl+I проверялись отдельными
  // литералами рядом — эти две записи могли разъехаться, и меню обещало бы
  // клавишу, которая на деле не работает (или наоборот).
  //
  // Сама таблица переехала в action-hotkey.js: с ней сверяется разбор конфига,
  // чтобы настроенному действию не досталась уже занятая окном комбинация.
  const { BUILTIN_ACTION_KEYS: ACTION_KEYS, matchesHotkey, formatHotkey } = window.ActionHotkey;
  // Обработчики сверяют e.code, а не e.key: key — это напечатанный знак, и в
  // русской раскладке ^R приходит как «к», ^K как «л». Физическая клавиша от
  // раскладки не зависит, и подпись в меню остаётся честной в любой из них.
  const CODE_TO_ACTION = Object.fromEntries(
    Object.entries(ACTION_KEYS).map(([id, key]) => [`Key${key.toUpperCase()}`, id]),
  );

  const search = document.getElementById('search');
  const list = document.getElementById('list');
  const message = document.getElementById('message');
  const statusline = document.getElementById('statusline');
  const sortControl = document.getElementById('sort-control');
  const sortLabel = document.getElementById('sort-label');
  const statusChecks = document.getElementById('status-checks');
  const menuHint = document.getElementById('menu-hint');
  const actionsBackdrop = document.getElementById('actions-backdrop');
  const actionsTitle = document.getElementById('actions-title');
  const actionsList = document.getElementById('actions-list');
  const actionsEmpty = document.getElementById('actions-empty');
  const infoBackdrop = document.getElementById('info-backdrop');
  const infoTitle = document.getElementById('info-title');
  const infoRows = document.getElementById('info-rows');

  function paintSort() {
    sortLabel.textContent = sortMode;
  }

  function invoke(cmd, args) {
    if (!window.__TAURI__) return Promise.resolve();
    return window.__TAURI__.core.invoke(cmd, args);
  }

  const {
    statusDotHtml, ageHtml, stateHtml, sessionIdHtml, sessionName, hotkeyHtml, usageHtml,
    windowHtml, shortPath, titleAttr, escapeHtml, prBadgeHtml,
  } = window.SessionGlyph;

  // Чекбоксы статуслайна и их обработчики — из одной таблицы. Клик по самому
  // чекбоксу не должен всплывать до statusline: там висит смена сортировки.
  const toggleInputs = new Map();
  // Отбивка между группами — на первом чекбоксе каждой следующей: отдельный
  // пустой элемент-разделитель пришлось бы ещё и прятать, когда группа пуста.
  statusChecks.innerHTML = TOGGLE_CHECKS.map(({ key, label, side }, i) => {
    const gap = i > 0 && TOGGLE_CHECKS[i - 1].side !== side ? ' gap' : '';
    return `<label class="status-check${gap}"><input type="checkbox" data-toggle="${key}"> ${escapeHtml(label)}</label>`;
  }).join('');
  for (const input of statusChecks.querySelectorAll('input[data-toggle]')) {
    const key = input.dataset.toggle;
    toggleInputs.set(key, input);
    input.addEventListener('click', (e) => {
      e.stopPropagation();
    });
    input.addEventListener('change', () => {
      toggles[key] = input.checked;
      render();
      saveUi();
    });
  }

  function paintToggles() {
    for (const [key, input] of toggleInputs) input.checked = !!toggles[key];
    // Про `/s` рассказываем только там, где он работает: подсказка о режиме,
    // которого нет, обманывает ровно так же, как молчащий Enter.
    menuHint.textContent = '^K - Session menu, ^N - new session, ^A - all projects'
      + (canFocusWindows() ? ', ^S - snapshots' : '');
  }

  /**
   * Запомнить вид списка.
   *
   * Молча и без ожидания: сортировку крутят подряд по нескольку раз, и ни
   * задержка на запись, ни подпись об удаче тут не нужны. Отказ уходит в ту же
   * строку ошибки, что и остальное, — не показать её было бы хуже: человек
   * решил бы, что вид запомнен, и удивился бы после перезапуска.
   */
  function saveUi() {
    invoke('save_ui', { ui: window.UiState.uiStateToSave(sortMode, toggles) })
      .catch((e) => { error = String(e); render(); });
  }

  // Что сейчас нарисовано: ключи в порядке DOM и разметка каждого элемента.
  // Решение, что из этого менять, считает planListSync (picker-list-sync.js);
  // здесь остаётся только запись в DOM.
  let rendered = { keys: [], html: [] };

  function syncList(items) {
    const plan = window.PickerListSync.planListSync(rendered, items, list.children.length);
    if (plan.mode === 'rebuild') {
      list.innerHTML = plan.html.join('');
    } else {
      // Снимок детей до правок: outerHTML заменяет элемент, а живая коллекция
      // list.children отдала бы уже новый узел на следующей итерации.
      const nodes = Array.from(list.children);
      for (const update of plan.updates) nodes[update.index].outerHTML = update.html;
    }
    rendered = { keys: plan.keys, html: plan.html };
  }

  /**
   * Строки проектов.
   *
   * Ни групп, ни сортировки: порядок задаёт агрегатор (свежие сверху), а
   * переключатель sort — про сессии. Правые колонки (usage, window, id, hk)
   * пусты не по недосмотру: у каталога нет ни записи агента, ни окна.
   */
  function renderProjects(query, items, nowSec) {
    for (const project of window.PickerFilter.filterProjects(projectRows, query)) {
      const index = rows.length;
      rows.push(project);
      // Зелёная точка у проекта, где кто-то работает прямо сейчас: тот же
      // словарь цветов, что и у сессии, и та же ширина левой колонки. Без
      // живых — обычная серая точка, а не `closed`: прозрачная задумана для
      // закрытой сессии, чтобы место осталось пустым, а у проекта «сейчас
      // никто не работает» — обычное состояние, а не отсутствие строки.
      const dotClass = project.liveCount ? 'dot active' : 'dot';
      // Подсказка — через тот же titleAttr, что у сессий: иначе в ней висел бы
      // полный путь, а строкой ниже, в теле строки, — тот же путь через
      // shortPath, и одна строка показывала бы каталог двумя разными видами.
      const html = `<div class="row project" data-index="${index}"${titleAttr(project)}>` +
        `<div class="${dotClass}"></div>` +
        `<div class="text"><div class="name">` +
        (project.mark ? '<span class="mark">★</span> ' : '') +
        `${escapeHtml(project.label)}</div>` +
        (toggles.showPaths
          ? `<div class="cwd">${escapeHtml(shortPath(project.cwd))}</div>` : '') +
        `</div>` +
        `<div class="meta">` +
        `<div class="count">${project.sessionCount}` +
        (project.liveCount ? ` · ${project.liveCount}●` : '') +
        `</div>` +
        ageHtml(project, nowSec) +
        `</div></div>`;
      items.push({ key: `p:${project.id}`, html });
    }
  }

  /**
   * Строки снимков: заголовок раскладки и её сессии одним потоком.
   *
   * Заголовок в `rows` не кладётся вместе с сессиями по одному правилу с
   * группами сессий — но здесь кладётся: у него есть своё действие, Enter
   * поднимает раскладку целиком. Поэтому и класс `row`, а не `group-label`.
   */
  // `nowSec` в сигнатуре — ради единообразия с соседями: строки снимков
  // возраста не показывают, и считать его здесь не из чего.
  function renderSnapshots(query, items, nowSec) {
    const open = window.PickerSnapshots.openIdsFromState(lastState);
    for (const row of window.PickerSnapshots.buildSnapshotRows(snapshotRows, open, query)) {
      const index = rows.length;
      rows.push(row);
      if (row.kind === 'snapshot') {
        const missing = row.missing
          ? `${row.missing} не открыты`
          : 'все на экране';
        items.push({
          key: row.key,
          html: `<div class="row snapshot" data-index="${index}">` +
            `<div class="dot"></div>` +
            `<div class="text"><div class="name">${escapeHtml(row.label)}</div></div>` +
            `<div class="meta"><div class="count">${row.total} · ${escapeHtml(missing)}</div>` +
            `</div></div>`,
        });
        continue;
      }
      // Открытая сессия — тусклая: восстановление её всё равно пропустит, а
      // Enter на ней поднимет уже существующее окно. Класс `on-screen`, а не
      // `closed`: в этом файле `closed` значит «сессии больше нет», а здесь
      // всё наоборот — окно есть, и именно поэтому строка тусклая.
      items.push({
        key: row.key,
        html: `<div class="row snapshot-session${row.open ? ' on-screen' : ''}" data-index="${index}"` +
          ` title="${escapeHtml(row.cwd)}">` +
          `<div class="dot${row.open ? ' active' : ''}"></div>` +
          `<div class="text"><div class="name">${escapeHtml(row.label)}</div>` +
          (toggles.showPaths
            ? `<div class="cwd">${escapeHtml(shortPath(row.cwd))}</div>` : '') +
          `</div>` +
          `<div class="meta"><div class="count">${row.open ? '▣ открыта' : ''}</div>` +
          `</div></div>`,
      });
    }
  }

  function renderSessions(query, items, nowSec) {
    const visible = window.PickerFilter.filterSessions(groups, query);
    // Одна отметка времени на всю отрисовку: иначе строки одного и того же
    // списка считали бы возраст от чуть разных «сейчас».
    for (const group of visible) {
      items.push({
        key: `g:${group.label}`,
        html: `<div class="group-label">${escapeHtml(group.label)}</div>`,
      });
      for (const session of group.sessions) {
        const index = rows.length;
        rows.push(session);
        // Подсказка про Shift+клик — ровно у тех строк, которые Shift+клик и
        // пометит: спрашиваем то же availableActions, что и меню Ctrl+K.
        // Раньше здесь стоял agentState, и обещание расходилось с делом на
        // сессиях, которых человек ещё не открывал.
        //
        // Конфиг сюда не передаётся намеренно: спрашивают про один встроенный
        // пункт, а настроенное действие с тем же id зажгло бы подсказку про
        // Shift+клик там, где Shift+клик ничего не сделает.
        const markable = window.SessionActions.availableActions(session).some(a => a.id === 'unread');
        const html = `<div class="row ${session.live ? '' : 'closed'}${markable ? ' markable' : ''}" data-index="${index}"${titleAttr(session)}>` +
          statusDotHtml(session) +
          `<div class="text"><div class="name">${escapeHtml(session.label)}` +
          `${prBadgeHtml(session)}` +
          `</div>` +
          (toggles.showPaths
            ? `<div class="cwd">${escapeHtml(shortPath(session.cwd))}</div>` : '') +
          // Две строки под карточкой: что спросили и чем ответили. Пустой div
          // всё равно занял бы высоту, поэтому рисуем только то, что есть.
          // Склейку «сводка, а у работающей — предыдущая» считает
          // sessionDescription (session-agent.js) на сборке строки.
          (toggles.showPrompt && session.agentPrompt
            ? `<div class="prompt">${escapeHtml(session.agentPrompt)}</div>` : '') +
          (toggles.showAnswer && session.agentDescription
            ? `<div class="summary">${escapeHtml(session.agentDescription)}</div>` : '') +
          `</div>` +
          // Правые колонки — одной группой: она и прижимает их вправо. Порознь
          // это делала `.state` своим margin-left: auto, и стоило снять с неё
          // чекбокс, как всё съезжало к названию сессии.
          `<div class="meta">` +
          windowHtml(session, toggles.showWindow) +
          stateHtml(session, toggles.showEvent) +
          sessionIdHtml(session, toggles.showId) +
          hotkeyHtml(session, toggles.showHotkey) +
          usageHtml(session, toggles) +
          ageHtml(session, nowSec) +
          `</div></div>`;
        items.push({ key: `s:${session.id}`, html });
      }
    }
  }

  function render() {
    const nowSec = Math.floor(Date.now() / 1000);
    rows = [];
    const items = [];
    // Режим живёт в строке поиска, а не отдельным флагом: см. picker-mode.js.
    const { mode, query } = window.PickerMode.parseQuery(search.value);
    // Режим снимков предлагается только там, где восстановление выполнимо:
    // те же условия, что у ветки focus. Не выполнены — `/s` остаётся обычным
    // поиском по сессиям, и Enter делает привычное, а не молчит.
    const snapshotsMode = mode === 'snapshots' && canFocusWindows();
    if (mode === 'projects') renderProjects(query, items, nowSec);
    else if (snapshotsMode) renderSnapshots(query, items, nowSec);
    else renderSessions(mode === 'snapshots' ? search.value.trim() : query, items, nowSec);
    syncList(items);
    // Отказ показывается и поверх непустого списка: строки в нём с прошлого
    // удачного опроса, и молчать о том, что свежих больше не приходит, нельзя.
    if (notice) {
      // Ответ на только что нажатую клавишу важнее отказа опроса: отказ никуда
      // не денется и вернётся, когда таймер погасит подпись.
      message.style.display = 'block';
      message.textContent = notice;
    } else if (error) {
      message.style.display = 'block';
      message.textContent = error;
    } else {
      message.style.display = rows.length ? 'none' : 'block';
      if (!rows.length) {
        message.textContent = mode === 'projects'
          // Пустой список проектов почти всегда значит «агрегатор на той
          // стороне ещё не отдаёт projects», и молчать об этом нельзя: на вид
          // это не отличить от «ничего не нашлось». Но на холодном окне и
          // после неудачного опроса projectRows пуст просто потому, что ответа
          // ещё не было, — винить хост, который не успел ответить, нечестно.
          // Признак ответа тот же, что и у окон: непустой lastState.
          ? (projectRows.length ? 'Nothing matches.'
            : lastState.sessions ? 'No projects — is ccfzf on the host up to date?'
              : 'Loading…')
          : snapshotsMode
            ? (snapshotRows.length ? 'Nothing matches.'
              // Пустой список снимков почти всегда значит «трекер на той
              // стороне ещё не научился их публиковать» — на вид это не
              // отличить от «раскладок ещё не запоминали».
              : lastState.sessions ? 'No snapshots — is the window tracker up to date?'
                : 'Loading…')
            : (groups.length ? 'Nothing matches.' : 'No claude sessions yet.');
      }
    }
    if (active >= rows.length) active = Math.max(0, rows.length - 1);
    paint();
  }

  /**
   * Разложить последний ответ агрегатора по группам и перерисовать.
   *
   * Через buildSessionsPayload, а не groupSessions напрямую: имя строки
   * приписывает labelSessions внутри него, и мимо него строка приезжает в
   * разметку без label — имя рисуется как undefined, а поиск перестаёт
   * находить что-либо.
   */
  function regroup() {
    const payload = window.SessionGroups.buildSessionsPayload(
      { ok: true, sessions: lastSessions, seen }, sortMode,
      { onlyLive: CONFIG.onlyLive, onlyWindow: toggles.onlyWindow },
    );
    groups = payload.groups;
    sortMode = payload.sort;
    paintSort();
    // Подсказка зависит от ответа (canFocusWindows), а красится не на каждый
    // опрос: без этого вызова хвост про `^S` появлялся бы только после клика
    // по чекбоксу.
    paintToggles();
    render();
  }

  // Хвост последнего ответа агрегатора, кроме самих сессий: на какой машине
  // открыты окна и какому процессу они принадлежат. Пустой объект — рабочее
  // состояние, а не поломка: оконного трекера может не быть вовсе.
  let lastState = {};

  /**
   * Можно ли поднимать окно вместо открытия терминала.
   *
   * Решает совпадение имён машин. На маке агрегатор рассказывает про окна
   * Windows-машины: пометка о них полезна — сессия где-то открыта, — а подъём
   * ничего не дал бы человеку перед экраном и отнял бы у Enter привычное
   * открытие терминала.
   *
   * Настроенный брокер — не второе решение, а условие выполнимости: просьба о
   * подъёме уходит только публикацией, и без брокера её некуда отправить.
   * Предложить ветку, у которой нет транспорта, значит подарить человеку
   * молчащий Enter — ровно то, чего избегает и проверка pid.
   */
  function canFocusWindows() {
    return CONFIG.mqtt.configured
      && window.SessionWindows.canFocus(lastState, CONFIG.windowHost);
  }

  /**
   * Ответ агрегатора приехал.
   *
   * Опрос идёт в Rust: у скрытого окна webview тормозит таймеры, а WebView2 у
   * свёрнутого умеет усыплять страницу целиком — фон на setInterval замолчал
   * бы молча. Здесь остаётся только разбор ответа, тот же, что был.
   */
  function applyState(payload) {
    const state = payload && payload.state;
    if (!state) {
      // Отказ без единого удачного ответа — показывать нечего, кроме отказа.
      if (payload && payload.error) error = String(payload.error);
      render();
      return;
    }
    const problems = window.StateShape.validateState(state);
    if (problems.length) {
      error = problems[0];
      render();
      return;
    }
    // Претензии к записям projects опрос не отбрасывают: агрегатор обновляется
    // сам по себе, и переименованное там поле проекта заморозило бы список
    // сессий, к проектам отношения не имеющий. Кривые записи выбросит
    // buildProjectList, а человек узнаёт о потере из той же строки отказа, что
    // и обо всём остальном, — она показывается и поверх непустого списка.
    //
    // Претензии к записям снимков — по той же причине и в ту же строку. Первая
    // непустая строка отказа побеждает: показывается всё равно одна.
    //
    // Отказ ssh стоит первым: он про то, что список устарел целиком, а
    // остальные — про отдельные записи в нём.
    error = (payload && payload.error ? String(payload.error) : '')
      || window.StateShape.projectProblems(state)[0]
      || window.StateShape.snapshotProblems(state)[0] || '';
    lastSessions = state.sessions;
    // Поля может не быть — старый агрегатор на той стороне. Тогда режим /a
    // покажет пустой список, и это честный ответ, а не поломка.
    projectRows = window.ProjectList.buildProjectList(state);
    // То же самое про снимки и режим /s.
    snapshotRows = Array.isArray(state.snapshots) ? state.snapshots : [];
    lastState = state;
    regroup();
  }

  // Опрос идёт в Rust и не останавливается вместе с показом: он же держит
  // свежим дамп агрегатора, с которого живёт панель openHASP. Границы показа
  // приходят туда же событиями picker-shown/picker-hidden — они меняют такт,
  // а не включают и выключают опрос.

  function paint() {
    const nodes = list.querySelectorAll('.row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === active));
  }

  function move(delta) {
    if (!rows.length) return;
    active = (active + delta + rows.length) % rows.length;
    paint();
    // Только здесь, не в paint: render() тикает раз в секунду с обновлением
    // списка, и scrollIntoView каждый раз дёргал бы скролл к активной строке,
    // даже когда пользователь сам ушёл вниз читать другие сессии.
    const current = list.querySelectorAll('.row')[active];
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  function markSeen(id, at) {
    seen[id] = at;
    // Карта уходит целиком: она маленькая (одна запись на сессию), а частичная
    // запись потребовала бы слияния на стороне Rust.
    return invoke('save_seen', { seen });
  }

  /**
   * Вернуть сессию в непрочитанное.
   *
   * Отметок о просмотре две, и отмотать нужно обе. Своя отматывается на секунду
   * раньше записи агента — ровно настолько, чтобы seenSinceUpdate снова сказал
   * «не видел». Вторую ставит оконный трекер, когда на окно сессии переводят
   * взгляд; она приезжает полем `focusedAt` внутри `window` и в строке
   * побеждает по максимуму, так что без отмотки у трекера местная не значила бы
   * ничего: следующий же опрос вернул бы кружок в «просмотрено».
   *
   * Просьба уходит независимо от `canFocusWindows()`: там речь о подъёме окна,
   * который на чужом экране бессмысленен, а отметка о просмотре приезжает в
   * список на любой машине. Не настроен брокер — остаётся местная отметка, как
   * было до появления трекерной.
   *
   * Отказ публикации местную отметку не отменяет: она уже стоит, кружок уже
   * оранжевый, и откатывать его обратно значило бы отвечать на неудачу тем же,
   * чем на успех. Пикер при этом не гаснет — список перерисовывается раз в
   * секунду, и перекраску видно на глазах.
   */
  function markUnread(row) {
    // Перерисовка — из последнего ответа, без похода на удалённый хост:
    // изменились отметки, а не сессии.
    markSeen(row.id, row.lastActivity - 1).then(regroup);
    if (!CONFIG.mqtt.configured) return;
    invoke('unread_session_mqtt', { id: row.id })
      .catch((e) => { error = String(e); render(); });
  }

  /**
   * Поднять окно, которое у сессии уже есть.
   *
   * Ветка `focus`: терминал не запускается вовсе, окно поднимает оконный
   * трекер на своей стороне.
   *
   * Пикер гасится **до** просьбы, а не после. Windows отдаёт передний план
   * только владельцу либо тому, кто получил последнее событие ввода; трекеру
   * это право выдаёт `focus_window_mqtt` на стороне Rust, и выдать его надо,
   * пока последнее нажатие ещё наше. Гасить после значило бы отбирать у окна
   * фокус сразу после того, как оно его получило.
   *
   * Просьба уходит публикацией в MQTT: брокер в этой установке слышат обе
   * машины. Ответа у неё нет — приёмник отчитывается в свой лог, а не нам, — и
   * это сознательный размен. Http-сервер, у которого ответ был, вешал демона на
   * той стороне; отчёт о подъёме окна того не стоит.
   */
  async function focusSession(row) {
    await invoke('hide_picker');
    try {
      await invoke('focus_window_mqtt', {
        id: row.id, pid: window.SessionWindows.focusPid(lastState),
      });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    error = '';
    // Та же отметка «посмотрел», что и у открытия: сессию человек увидел.
    await markSeen(row.id, Math.floor(Date.now() / 1000));
  }

  /**
   * Попросить поднять раскладку снимка.
   *
   * Пикер гасится до просьбы, как и на фокусе: окна поднимутся на том же
   * экране, и держать поверх них список незачем. Итог не показывается —
   * ответа у просьбы нет по замыслу, а не сработавшее видно на экране.
   *
   * Пустой `sessionIds` значит «весь снимок»: так просит заголовок раскладки.
   */
  async function restoreSnapshot(snapshotId, sessionIds) {
    await invoke('hide_picker');
    try {
      await invoke('restore_snapshot_mqtt', { id: snapshotId, sessionIds });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    error = '';
  }

  /**
   * Открыть сессию в новом окне kitty.
   *
   * Стратегию выбирает эта же сторона по строке списка. Строка старше
   * секунды, и на Windows выбор делал бэкенд в момент клика по живому
   * состоянию — здесь такого бэкенда нет: ccfzf --state отдаёт снимок и
   * уходит. Расхождение стоит недорого: tmux-панель, которой уже нет, даст
   * ошибку в самом kitty, а не тихо откроет не то.
   */
  async function openSession(row) {
    if (!row) return;
    const strategy = window.OpenStrategy.chooseOpenStrategy(
      row, CONFIG.caps, { canFocus: canFocusWindows() },
    );
    // Развилку целиком решает chooseEnterAction (open-transport.js), а не
    // условия по месту: у неё есть тесты на каждый вид строки и на все
    // состояния трекера, а у пары if-ов в этом файле их не было — отсюда и
    // взялись подъём окна мимо права на передний план и Enter, не сделавший
    // ничего у незнакомой трекеру сессии.
    const action = window.OpenTransport.chooseEnterAction(
      row, strategy, lastState, CONFIG.windowHost, CONFIG.mqtt.configured,
    );
    // Окно уже открыто, и поднять его умеет только эта дорога: она гасит пикер
    // до публикации и выдаёт трекеру право на передний план.
    if (action === 'focus') return focusSession(row);
    // Менеджер знает профиль Windows Terminal для этого проекта; собранная
    // здесь команда его теряет.
    if (action === 'manager') return openViaManager(row);
    if (sshHostMissing()) return;
    const cmd = window.OpenStrategy.buildOpenCommand(row, strategy, {
      sshHost: CONFIG.sshHost, terminal: CONFIG.terminal,
    });
    if (!cmd) return;
    if (cmd.destructive) {
      const ok = confirm(
        `Перехватить сессию «${sessionName(row)}»?\n\n`
        + `Процесс ${row.pid} на ${CONFIG.sshHost} получит SIGHUP и завершится, окно на Windows закроется.\n`
        + `Фоновые задачи, запущенные в её шелле, умрут вместе с ней.`,
      );
      if (!ok) return;
    }
    try {
      await invoke('spawn_detached', { argv: cmd.argv });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    // Отметка «посмотрел» ставится здесь: другого повода на маке нет.
    await markSeen(row.id, Math.floor(Date.now() / 1000));
    invoke('hide_picker');
  }

  /**
   * Попросить трекер открыть сессию у себя.
   *
   * Один вход на два повода: Enter на машине самого трекера (ветка `manager`
   * в openSession выше) и пункт меню «Open on <host>» с чужой машины. Publish
   * в MQTT дойдёт до демона одинаково независимо от того, откуда он
   * отправлен, и тело просьбы у обоих одно — разводить их значило бы завести
   * два места, где отметка «посмотрел» и гашение пикера ставятся по-разному.
   *
   * Права на передний план здесь не выдаётся, и это не упущение. Сессию,
   * чьё окно пикер может поднять сам, Enter сюда не приводит — её забирает
   * focusSession, который право и выдаёт (chooseEnterAction в
   * open-transport.js). Остаётся ровно один случай с открытым окном: ответ
   * агрегатора без `windowPid`, то есть выдавать право некому и нечему.
   *
   * Каталог проекта едет рядом с id, и без него просьба часто не сработала бы
   * вовсе: менеджер ищет сессию среди своих слотов, а список пикера приезжает
   * от ccfzf с ssh-хоста и знает сессии, которых на Windows не открывали ни
   * разу. По каталогу менеджер открывает терминал с профилем из
   * `claudeWt.projects` — ровно то, чего собранная здесь команда `wt.exe` не
   * умеет.
   */
  async function openViaManager(row) {
    try {
      await invoke('open_session_mqtt', {
        id: row.id, cwd: window.OpenTransport.rowProjectDir(row),
      });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    error = '';
    // Та же пара, что и у местного открытия: отметка «посмотрел» и гашение
    // пикера, после ответа — иначе ошибка недоступного трекера осталась бы
    // за уже закрытым окном.
    await markSeen(row.id, Math.floor(Date.now() / 1000));
    invoke('hide_picker');
  }

  function choose() {
    const row = rows[active];
    if (!row) return;
    // Заголовок снимка: поднять раскладку целиком.
    if (row.kind === 'snapshot') return restoreSnapshot(row.id, []);
    // Сессия из снимка: у открытой окно уже есть, и Enter должен поднять его,
    // а не заводить второе — восстановление её всё равно пропустило бы.
    if (row.kind === 'snapshot-session') {
      return row.open ? focusSession(row) : restoreSnapshot(row.snapshotId, [row.id]);
    }
    // У строки проекта продолжать нечего — есть только каталог. Enter значит
    // здесь то же, что и на строке сессии: «открой мне терминал с агентом».
    if (row.kind === 'project') return newSession(row.cwd);
    return openSession(row);
  }

  function onSearchInput() {
    active = 0;
    render();
  }

  function closeMenu() {
    menuOpen = false;
    menuActions = [];
    menuActive = 0;
    menuSessionId = null;
    actionsBackdrop.classList.remove('open');
    actionsBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  function closeInfo() {
    infoOpen = false;
    infoBackdrop.classList.remove('open');
    infoBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  function openInfo(session) {
    if (!session) return;
    const nowSec = Math.floor(Date.now() / 1000);
    // Через sessionName, а не по label напрямую: у безымянной сессии он пуст,
    // и заголовок диалога тогда остаётся с одним путём. См. sessionName.
    infoTitle.textContent = `${sessionName(session)} — ${shortPath(session.cwd || '')}`;
    infoRows.innerHTML = window.SessionInfo.buildSessionInfoRows(session, nowSec)
      .map(row => `<div class="info-row"><span class="k">${escapeHtml(row.label)}</span>`
        + `<span class="v">${escapeHtml(row.value)}</span></div>`)
      .join('');
    infoOpen = true;
    infoBackdrop.classList.add('open');
    infoBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  function paintMenu() {
    const nodes = actionsList.querySelectorAll('.action-row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === menuActive));
  }

  function renderMenu(data) {
    menuSessionId = data.id;
    menuActions = data.actions || [];
    menuActive = 0;
    const name = data.label ? sessionName(data) : '';
    const title = name
      ? `${name} — ${shortPath(data.cwd || '')}`
      : shortPath(data.cwd || '') || 'Session';
    actionsTitle.textContent = title;
    if (!menuActions.length) {
      actionsList.innerHTML = '';
      actionsEmpty.style.display = 'block';
    } else {
      actionsEmpty.style.display = 'none';
      // Клавиша справа — из ACTION_KEYS (единая таблица, см. её объявление
      // выше): нет записи для id — ничего не рисуем, пустой элемент не нужен.
      //
      // Комбинация приводится к одному виду — formatHotkey (action-hotkey.js).
      // Раньше настроенное действие показывало строку из конфига как есть, и в
      // одном списке стояли `^K` и `Ctrl+Shift+E`. Встроенная клавиша идёт
      // через тот же форматтер: `Ctrl+K` он и даёт `^K`.
      actionsList.innerHTML = menuActions.map((action, index) => {
        const key = ACTION_KEYS[action.id];
        const shown = formatHotkey(key ? `Ctrl+${key}` : (action.hotkey || ''));
        const hotkey = shown ? `<span class="action-hotkey">${escapeHtml(shown)}</span>` : '';
        return `<div class="action-row${index === 0 ? ' active' : ''}" data-index="${index}" role="menuitem">` +
          `<span class="action-label">${escapeHtml(action.label)}</span>${hotkey}</div>`;
      }).join('');
    }
    menuOpen = true;
    actionsBackdrop.classList.add('open');
    actionsBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  /**
   * Действия для строки: availableActions плюс пункт, который availableActions
   * дать не может — «открыть на трекере» зависит от lastState.windowHost, а
   * не от самой строки, и availableActions его не видит. Общая функция для
   * openMenu и runAction: список меню и то, что runAction готов выполнить,
   * должны быть одним и тем же списком, а не двумя похожими.
   *
   * Применимость пункта решает canOpenRemote (open-transport.js) — не здесь:
   * она проверена тестами на каждый вид строки и все четыре состояния
   * трекера, а инлайновая проверка в этом файле такой проверки не имеет
   * вовсе.
   */
  function actionsFor(row) {
    const actions = window.SessionActions.availableActions(row, CONFIG);
    if (window.OpenTransport.canOpenRemote(row, lastState, CONFIG.windowHost, CONFIG.mqtt.configured)) {
      actions.push({
        id: 'open-remote',
        label: `Open on ${lastState.windowHost}`,
      });
    }
    return actions;
  }

  function openMenu() {
    const session = rows[active];
    if (!session) return;
    // Меню считается здесь же, а не спрашивается у бэкенда: всё, из чего оно
    // складывается, уже лежит в строке.
    renderMenu({
      id: session.id,
      label: session.label,
      cwd: session.cwd,
      actions: actionsFor(session),
    });
  }

  /**
   * Имена, которые сейчас нельзя занимать.
   *
   * Две части. Первая — заголовки живых сессий из последнего ответа: имя
   * сессии и есть заголовок её окна, по нему оконный трекер привязывает
   * сессию к слоту, и мешают друг другу именно живые тёзки.
   *
   * Вторая — имена, которые пикер выдал сам за последнюю минуту. Без неё два
   * `^N` подряд, быстрее опроса, дали бы одно имя дважды: ответ агрегатора
   * ещё не знает о первой сессии. Минута взята по верхнему такту фонового
   * опроса — за это время сессия попадает в ответ при любом раскладе.
   */
  const issuedNames = new Map();
  const ISSUED_TTL_MS = 60_000;

  function takenSessionNames() {
    const now = Date.now();
    for (const [name, at] of issuedNames) {
      if (now - at > ISSUED_TTL_MS) issuedNames.delete(name);
    }
    const live = lastSessions
      .filter(s => s && s.live)
      .map(s => s && s.title)
      .filter(t => typeof t === 'string' && t);
    return live.concat(Array.from(issuedNames.keys()));
  }

  /**
   * Поднять новую сессию в каталоге строки.
   *
   * Один вход на три повода: Enter на строке проекта, `^N` на любой строке и
   * пункт меню. Разводить их значило бы завести три места, где собирается одна
   * и та же удалённая команда, — а собирать её мимо OpenStrategy нельзя вовсе.
   *
   * Отметки «просмотрено» здесь нет: смотреть ещё нечего, сессия только что
   * началась.
   */
  async function newSession(cwd) {
    if (!cwd || sshHostMissing()) return;
    const taken = takenSessionNames();
    // Пустая команда — отказ OpenStrategy, а не поломка: путь с `;` Windows
    // Terminal порежет на панели ещё до шелла. Сказать об этом обязательно —
    // иначе кнопка молча ничего не делает.
    const remote = window.OpenStrategy.newSessionCommand(cwd, taken);
    if (!remote) {
      error = `В пути есть «;», такой каталог открыть нечем: ${cwd}`;
      render();
      return;
    }
    const argv = [
      CONFIG.terminal.file, ...CONFIG.terminal.args,
      'ssh', '-t', CONFIG.sshHost,
      remote,
    ];
    try {
      await invoke('spawn_detached', { argv });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    // Имя запоминается только после удачного запуска: занять его на отказе
    // значило бы отдать следующей сессии `-2` без всякой первой.
    const name = window.OpenStrategy.newSessionName(cwd, taken);
    if (name) issuedNames.set(name, Date.now());
    invoke('hide_picker');
  }

  /**
   * Выполнить действие над строкой.
   *
   * Применимость проверяется здесь, а не у вызывающего: пунктов меню и прямых
   * клавиш два разных входа, и правило «что этой строке можно» должно быть
   * одно. На Windows его знал сервер и сам сообщал об отказе — здесь спрашивать
   * некого.
   */
  function runAction(row, id) {
    if (!row) return;
    if (!actionsFor(row).some(a => a.id === id)) return;
    // Настроенные действия проверяются первыми: встроенных id немного, но
    // конфиг им не подчинён, и одинаковое имя не должно молча уводить в
    // встроенную ветку. Путь уже переведён — иначе действия не было бы в списке.
    const configured = CONFIG.actions.find(a => a.id === id);
    if (configured) {
      const argv = window.PathMap.buildActionArgv(configured, {
        localPath: window.PathMap.mapPath(row.cwd, CONFIG.pathMap),
        remotePath: row.cwd,
      });
      invoke('spawn_detached', { argv })
        .then(() => invoke('hide_picker'))
        .catch((e) => { error = String(e); render(); });
      return;
    }
    if (id === 'new') {
      newSession(row.cwd);
      return;
    }
    if (id === 'pr') {
      // Форму ссылки уже проверил availableActions — до сюда доходит только
      // https://github.com/<owner>/<repo>/pull/<число>.
      invoke('spawn_detached', { argv: ['open', row.pr_url] });
      invoke('hide_picker');
      return;
    }
    if (id === 'unread') {
      markUnread(row);
      return;
    }
    if (id === 'open-remote') {
      openViaManager(row);
      return;
    }
    if (id === 'attach') {
      // Команду отдаём человеку, а не запускаем: reptyr тянет процесс к тому
      // tty, из которого его позвали. Терминал выбирает человек — пикер за
      // него угадать не может.
      const cmd = window.OpenStrategy.buildAttachCommand(row);
      // В подсказке — только первая половина: вторая длинная и нужна лишь при
      // повторном переносе. В буфер уходит команда целиком.
      const shown = cmd.split(' || ')[0];
      invoke('copy_to_clipboard', { text: cmd })
        .then(() => showNotice(`Скопировано: ${shown} — вставь в терминал на ${CONFIG.sshHost}, куда нужна сессия`))
        .catch((e) => { error = String(e); render(); });
      return;
    }
    if (id === 'info') openInfo(row);
  }

  function runMenuAction() {
    const action = menuActions[menuActive];
    if (!action || !menuSessionId) return;
    const id = menuSessionId;
    const actionId = action.id;
    closeMenu();
    // По id, а не по индексу active: список перерисовывается раз в секунду,
    // пока меню открыто, render() пересобирает rows в порядке текущей
    // сортировки, и active остаётся числом — строка под этим индексом может
    // смениться на другую сессию. Прямые клавиши из списка (обработчик ниже)
    // этой ловушке не подвержены: там меню не открыто, и active — это и есть
    // выбранная строка.
    runAction(rows.find(r => r.id === id), actionId);
  }

  function moveMenu(delta) {
    if (!menuActions.length) return;
    menuActive = (menuActive + delta + menuActions.length) % menuActions.length;
    paintMenu();
  }

  search.addEventListener('input', onSearchInput);

  // Подсказка «что сделает Shift+клик» держится отдельно от основного
  // обработчика keydown ниже: у того есть ранние выходы для открытых
  // оверлеев (menuOpen/infoOpen), а подсветка от режима оверлея не зависит —
  // Shift остаётся Shift'ом независимо от того, что сейчас открыто.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Shift') document.body.classList.add('shift');
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'Shift') document.body.classList.remove('shift');
  });
  // Alt+Tab с зажатым Shift уводит фокус из окна без keyup: без этого класс
  // остался бы висеть до следующего нажатия Shift после возврата.
  window.addEventListener('blur', () => {
    document.body.classList.remove('shift');
  });

  // Прямые клавиши дублируют пункты меню Ctrl+K без открытия самого меню —
  // буква ведёт прямо к id действия. Применимость проверяет runAction: у
  // строки без PR ^P просто ничего не делает.

  document.addEventListener('keydown', (e) => {
    if (infoOpen) {
      if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); closeInfo(); }
      else if (!(e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); }
      return;
    }
    if (menuOpen) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveMenu(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveMenu(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runMenuAction(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
      else if (!(e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); }
      return;
    }
    // Shift и Alt исключены во всех трёх встроенных ветках ниже: isReserved в
    // action-hotkey.js занимает за окном только форму «один Ctrl или Cmd плюс
    // буква», то есть `Ctrl+Shift+A` человек вправе назначить своему действию.
    // Без этой оговорки встроенная ветка съедала бы событие первой, и
    // настроенный хоткей молча не работал бы.
    const plainCtrl = (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey;
    if (plainCtrl && e.code === 'KeyK') {
      e.preventDefault();
      openMenu();
      return;
    }
    if (plainCtrl && e.code === 'KeyA') {
      // Ставит `/a ` в начало строки поиска. Не режим и не переключатель:
      // состояние живёт в самом тексте, и стирание префикса возвращает к
      // сессиям. Цена — `^A` больше не «выделить всё» в поле поиска.
      e.preventDefault();
      search.value = window.PickerMode.withProjectPrefix(search.value);
      search.focus();
      search.setSelectionRange(search.value.length, search.value.length);
      onSearchInput();
      return;
    }
    if (plainCtrl && e.code === 'KeyS') {
      // Ставит `/s ` в начало строки поиска — как `^A` ставит `/a `. Режим
      // живёт в самом тексте, стирание префикса возвращает к сессиям.
      //
      // Молча ничего не делает там, где восстановление невыполнимо: тот же
      // отказ, что и у подсказки, и лучше молчащего режима с молчащим Enter.
      e.preventDefault();
      if (!canFocusWindows()) return;
      search.value = window.PickerMode.withSnapshotPrefix(search.value);
      search.focus();
      search.setSelectionRange(search.value.length, search.value.length);
      onSearchInput();
      return;
    }
    // ^P/^U/^I — те же три действия, что и в меню. preventDefault здесь
    // обязателен: иначе Ctrl+P в webview уйдёт в печать.
    if (plainCtrl) {
      const directActionId = CODE_TO_ACTION[e.code];
      if (directActionId) {
        e.preventDefault();
        runAction(rows[active], directActionId);
        return;
      }
    }
    // Настроенные действия — после встроенных: разбор конфига уже снял клавишу
    // у того, кто целился в занятую комбинацию, но порядок проверки оставляет
    // это правило верным и без него.
    const configured = CONFIG.actions.find(a => matchesHotkey(e, a.parsedHotkey));
    if (configured) {
      e.preventDefault();
      runAction(rows[active], configured.id);
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(); }
    else if (e.key === 'Escape') { e.preventDefault(); invoke('hide_picker'); }
  });

  list.addEventListener('click', (e) => {
    if (menuOpen) return;
    const row = e.target.closest('.row');
    if (!row) return;
    active = Number(row.dataset.index);
    // Shift+клик помечает непрочитанным вместо открытия. Промах по Shift не
    // должен превращаться в открытие сессии, поэтому строка без записи агента
    // (сессия без хука) просто ничего не делает.
    if (e.shiftKey) {
      runAction(rows[active], 'unread');
      return;
    }
    choose();
  });

  actionsList.addEventListener('click', (e) => {
    const row = e.target.closest('.action-row');
    if (!row) return;
    menuActive = Number(row.dataset.index);
    runMenuAction();
  });

  actionsBackdrop.addEventListener('click', (e) => {
    if (e.target === actionsBackdrop) closeMenu();
  });

  infoBackdrop.addEventListener('click', (e) => {
    if (e.target === infoBackdrop) closeInfo();
  });

  sortControl.addEventListener('click', (e) => {
    e.preventDefault();
    if (menuOpen) return;
    // Сортировку крутит сам пикер: спрашивать было некого — на маке за списком
    // стоит ccfzf --state, который отдаёт сессии, а не готовые группы.
    sortMode = window.SessionGroups.cycleSort(sortMode);
    regroup();
    saveUi();
  });

  // Reset the palette for a show. Feed itself doesn't (re)start here — it
  // runs continuously in Rust, see the comment above applyState. Called both
  // from the 'picker-shown' listener (every show after the window has
  // finished loading) and, once, directly from start() to cover the show
  // that raced ahead of this webview finishing DOMContentLoaded (see
  // start()).
  function beginShow() {
    closeMenu();
    closeInfo();
    search.value = '';
    active = 0;
    // Показ начинается с чистого состояния: Shift, зажатый перед вызовом
    // пикера (или отпущенный, пока окно было скрыто и события до него не
    // доходили), не должен продолжать рисовать подсказку в новом сеансе.
    document.body.classList.remove('shift');
    search.focus();
    search.select();
    // Список предыдущего показа остаётся на экране до первого свежего ответа.
    // Здесь стояло `groups = []` — окно открывалось пустым, с «Loading…», и
    // настоящий список дорисовывался только через полсекунды (столько стоит
    // ssh на удалённый хост). Этот пустой кадр и мелькал при каждом открытии. Строки в
    // нём те же самые, а открытие сверяет живое состояние отдельно, — то есть
    // устаревший кадр никуда не уводит по ошибке.
    //
    // Свою отрисовку показ всё же делает: search.value только что очищен, и
    // фильтр предыдущего показа надо снять. Строки при этом на месте, syncList
    // трогает только те, что изменились.
    render();
    // Первый показ за загрузку страницы: рисовать нечего, и «Loading…» стоит
    // вместо пустоты. Дальше сюда не попадаем — список уже есть.
    if (!rows.length && !error) message.textContent = 'Loading…';
  }

  async function start() {
    if (!window.__TAURI__) { message.textContent = 'No backend detected.'; return; }
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    // До первого опроса: без отметок список показал бы всё непрочитанным, и
    // кружки перекрасились бы через секунду — заметным миганием.
    try {
      seen = await invoke('load_seen') || {};
    } catch (e) {
      error = String(e);
    }

    // Тоже до первого опроса: из конфига берётся хост, которому этот опрос и
    // адресован. Испорченный yaml — это ошибка в статуслайне и умолчания, а не
    // пикер, который не открылся.
    try {
      CONFIG = window.ConfigShape.normalizeConfig(await invoke('load_config'));
    } catch (e) {
      error = String(e);
    }

    // Вид списка — до первой отрисовки: иначе первый показ рисуется чужой
    // сортировкой и перекладывается на глазах.
    try {
      const ui = window.UiState.normalizeUiState(await invoke('load_ui'), {
        sort: sortMode, toggles,
      });
      sortMode = ui.sort;
      // normalizeUiState теперь отдаёт две оси на галку (C1); эта строка ещё
      // рисует список по-старому, одной галкой на колонку, и знает только про
      // ось list. Рисование по обеим осям — задача C2, здесь же держим
      // потребителя рабочим: без listColumns каждая колонка получила бы
      // truthy-объект вместо булева значения и показывалась бы всегда.
      toggles = window.UiState.listColumns(ui.toggles);
    } catch (e) {
      error = String(e);
    }

    // Проектный хоткей открывает новую сессию, а не продолжает старую:
    // продолжать нечего — сессии у него нет, есть только каталог.
    //
    // Через ту же newSession, что Enter и ^N. Раньше здесь поднимался голый
    // `claude`, без имени: сессия проектного хоткея оставалась безымянной, и
    // оконный трекер не мог найти её по заголовку окна.
    await listen('project-hotkey', (event) => {
      newSession(event.payload);
    });

    // Ответ агрегатора приезжает событием: опросом распоряжается Rust.
    await listen('state', (event) => applyState(event.payload));

    // Fired by Rust every time the window is shown.
    await listen('picker-shown', beginShow);

    await listen('picker-hidden', () => {
      closeMenu();
      closeInfo();
    });

    // Подписка готова — забрать то, что поток успел узнать до неё, и
    // подтолкнуть свежий опрос.
    applyState(await invoke('poll_now'));

    paintSort();
    paintToggles();
    search.focus();

    // The hotkey is live from Rust's setup(), before this webview has
    // necessarily finished loading — a press in that window shows the
    // picker without a 'picker-shown' event ever reaching a listener that
    // didn't exist yet. Cover that first-show race by checking whether the
    // window is already visible right now; if so, this is that race and the
    // palette needs to be reset here instead of waiting for an event that
    // already fired.
    const alreadyVisible = await getCurrentWindow().isVisible().catch(() => false);
    if (alreadyVisible) {
      beginShow();
    }
  }

  window.addEventListener('DOMContentLoaded', () => { start(); });
</script>
</body>
</html>
