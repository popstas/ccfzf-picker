    // То же самое про снимки и режим /s.
    // Снимки соседних машин в списке не нужны: восстановить их раскладку на
    // своём экране человеку нечего.
    snapshotRows = window.PickerSnapshots.snapshotsHere(state, CONFIG.windowHost);
    lastState = state;
    regroup();
  }

  // Опрос идёт в Rust и не останавливается вместе с показом: он же держит
  // свежим дамп агрегатора, с которого живёт панель openHASP. Границы показа
  // приходят туда же событиями picker-shown/picker-hidden — они меняют такт,
  // а не включают и выключают опрос.

  function paint() {
    const nodes = list.querySelectorAll('.row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === active));
    // Одно место на все смены выбора: сюда приходят и стрелки, и ←/→, и оба
    // клика, и сам render. Пять обработчиков, помнящих панель каждый за
    // себя, разошлись бы, а забытый шестой дал бы прыжок через экран — ровно
    // тот, ради которого всё затевалось.
    activePanel = (rows[active] || {}).panel || '';
    // Здесь же и гашение: оно зависит от того, где стоит выбор, а стрелки
    // render не зовут вовсе — с вызовом в render гашение по фокусу отставало
    // бы до секунды, до следующего ответа агрегатора. Подсветка держится
    // отдельно от разметки строки и переживает planListSync только так —
    // восстановлением после каждой смены выбора, включая ту, что делает сам
    // render.
    paintProjectDim();
  }

  /**
   * Какие строки гасить при наведении на проект: чистая часть, поэтому
   * отдельно от записи в DOM.
   *
   * Заголовки секций и дней не гаснут: погашенный заголовок читался бы как
   * свёрнутая панель. Подзаголовки машин в `rows` не попадают вовсе.
   */
  function dimsForHover(rows, cwd) {
    // Ни одна строка не несёт этот каталог — значит наведение устарело
    // (список успел пересобраться под ним) или само стало осадком прошлого
    // показа. Гасить всё подряд в этом случае значило бы притушить весь
    // список без единой яркой строки под курсором.
    if (!cwd || !rows.some(row => row.cwd === cwd)) return rows.map(() => false);
    return rows.map(row => !HEADER_KINDS.has(row.kind) && row.cwd !== cwd);
  }

  /**
   * По какому каталогу гасим: наведение главнее фокуса — мышь жест более
   * свежий и намеренный, а выбор стоит на строке всегда, в том числе сам
   * собой после открытия окна.
   *
   * Фокус гасит только со строки проекта и только в смешанном списке. Второе
   * условие записано свойством самого списка («есть строка не-проект и не
   * заголовок»), а не именем режима: в `/p` строк других видов нет, значит
   * гашение само не включится, — и точно так же не включится под запросом,
   * отобравшим одни проекты. Читай мы `mode`, это был бы второй источник
   * правды рядом с содержимым списка, и разошлись бы они на первой правке
   * префиксов. Отделять там всё равно нечего: выбор подсвечен и без гашения.
   */
  function dimCwd(rows, active, hoverCwd) {
    if (hoverCwd) return hoverCwd;
    const row = rows[active];
    if (!row || row.kind !== 'project' || !row.cwd) return '';
    const mixed = rows.some(r => !HEADER_KINDS.has(r.kind) && r.kind !== 'project');
    return mixed ? row.cwd : '';
  }

  /** Разложить решение dimsForHover по узлам списка. */
  function paintProjectDim() {
    const dims = dimsForHover(rows, dimCwd(rows, active, hoverProjectCwd));
    const nodes = list.querySelectorAll('.row');
    nodes.forEach((node, i) => node.classList.toggle('dim-other', Boolean(dims[i])));
  }

  /** Каретка на краю запроса и ничего не выделено. */
  function atQueryEdge(key) {
    if (search.selectionStart !== search.selectionEnd) return false;
    return key === 'ArrowLeft'
      ? search.selectionStart === 0
      : search.selectionStart === search.value.length;
  }

  function move(delta) {
    if (!rows.length) return;
    // В широком режиме — внутри своего блока, с упором в края; в узком — по
    // кругу, как было: там список один, и круг возвращает к его началу.
    active = fullscreen
      ? window.PickerSections.moveInBlocks(rows, active, delta)
      : (active + delta + rows.length) % rows.length;
    paint();
    scrollActiveIntoView();
  }

  function moveBlock(delta) {
    if (!rows.length) return;
    active = window.PickerSections.moveBetweenBlocks(rows, active, delta);
    paint();
    scrollActiveIntoView();
  }

  // Только на нажатие клавиши, не в paint: render() тикает раз в секунду, и
  // scrollIntoView каждый раз дёргал бы скролл к активной строке, даже когда
  // человек сам ушёл вниз читать другие сессии.
  function scrollActiveIntoView() {
    const current = list.querySelectorAll('.row')[active];
    // block: 'nearest' сам находит ближайший скроллящийся предок — в широком
    // режиме это тело блока, в узком сам список.
    if (current) current.scrollIntoView({ block: 'nearest' });
  }

  function markSeen(id, at) {
    seen[id] = at;
    // Карта уходит целиком: она маленькая (одна запись на сессию), а частичная
    // запись потребовала бы слияния на стороне Rust.
    return invoke('save_seen', { seen });
  }

  /**
   * Вернуть сессию в непрочитанное.
   *
   * Отметок о просмотре две, и отмотать нужно обе. Своя отматывается на секунду
   * раньше записи агента — ровно настолько, чтобы seenSinceUpdate снова сказал
   * «не видел». Вторую ставит оконный трекер, когда на окно сессии переводят
   * взгляд; она приезжает полем `focusedAt` внутри `window` и в строке
   * побеждает по максимуму, так что без отмотки у трекера местная не значила бы
   * ничего: следующий же опрос вернул бы кружок в «просмотрено».
   *
   * Просьба уходит независимо от `rowCanFocus()`: там речь о подъёме окна,
   * который на чужом экране бессмысленен, а отметка о просмотре приезжает в
   * список на любой машине. Не настроен брокер — остаётся местная отметка, как
   * было до появления трекерной.
   *
   * Отказ публикации местную отметку не отменяет: она уже стоит, кружок уже
   * оранжевый, и откатывать его обратно значило бы отвечать на неудачу тем же,
   * чем на успех. Пикер при этом не гаснет — список перерисовывается раз в
   * секунду, и перекраску видно на глазах.
   *
   * Адрес берётся у машины окна, а не у своего конфига: отметку ставит тот
   * трекер, который видел взгляд, а он может стоять на соседней машине.
   * Строка без окна адреса не назовёт — тогда просьба уходит по своей базе,
   * как раньше: слот в windows11-manager переживает закрытие окна, и такую
   * сессию он всё ещё может знать по id.
   */
  function markUnread(row) {
    // Перерисовка — из последнего ответа, без похода на удалённый хост:
    // изменились отметки, а не сессии.
    markSeen(row.id, row.lastActivity - 1).then(regroup);
    if (!CONFIG.mqtt.configured) return;
    invoke('unread_session_mqtt', { id: row.id, base: focusBase(row) })
      .catch((e) => { error = String(e); render(); });
  }

  /**
   * Пометить сессию просмотренной, не открывая её окна.
   *
   * Зеркало markUnread, но короче ровно на публикацию: отметки складываются по
   * максимуму, и местная, поставленная «сейчас», перекрывает трекерный
   * `focusedAt` сама. Отмотке же максимум мешает — оттого markUnread и обязан
   * просить трекер, а этот ход обходится без брокера вовсе и работает
   * одинаково на любой машине.
   */
  function markSeenNow(row) {
    markSeen(row.id, Math.floor(Date.now() / 1000)).then(regroup);
  }

  /**
   * Какую отметку Shift переставит у этой строки — или `null`, если никакую.
   *
   * Спрашивается availableActions, а не поля строки: условия у пары пунктов
   * уже описаны там, и второй их разбор здесь разошёлся бы с меню ^K молча —
   * подсказка обещала бы одно, клик делал бы другое.
   *
   * Конфиг сюда не передаётся намеренно: спрашивают про встроенные пункты, а
   * настроенное действие с тем же id зажгло бы подсказку про Shift+клик там,
   * где Shift+клик ничего не сделает.
   */
  /**
   * Открыть список названного режима: поставить его префикс в начало строки
   * поиска.
   *
   * Режим живёт префиксом в тексте, а не отдельным флагом, поэтому «открыть в
   * режиме X» — это правка строки поиска, и сделать её может только страница.
   *
   * Входов сюда три, и код у них общий: клавиши внутри окна (`^P`, `^L`, `^H`,
   * `^S`), второй глобальный хоткей и пункты-режимы меню трея — последние два
   * приезжают событием `picker-mode` от Rust, с именем режима в теле.
   */
  function showMode(mode) {
    search.value = window.PickerMode.withPrefix(search.value, mode);
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
    onSearchInput();
  }

  function showProjects() {
    showMode('projects');
  }

  function markToggleId(row) {
    const ids = window.SessionActions.availableActions(row).map(a => a.id);
    if (ids.includes('unread')) return 'unread';
    if (ids.includes('seen')) return 'seen';
    return null;
  }

  /**
   * Поднять окно, которое у сессии уже есть.
   *
   * Ветка `focus`: терминал не запускается вовсе, окно поднимает оконный
   * трекер на своей стороне.
   *
   * Пикер гасится **до** просьбы, а не после. Windows отдаёт передний план
   * только владельцу либо тому, кто получил последнее событие ввода; это право
   * выдаёт `focus_window_mqtt` на стороне Rust, и выдать его надо, пока
   * последнее нажатие ещё наше. Гасить после значило бы отбирать у окна фокус
   * сразу после того, как оно его получило. То же правило — у трёх остальных
   * просьб, кончающихся окном: `openProjectRow`, `newSessionHere`,
   * `openViaManager`.
   *
   * Просьба уходит публикацией в MQTT: брокер в этой установке слышат обе
   * машины. Ответа у неё нет — приёмник отчитывается в свой лог, а не нам, — и
   * это сознательный размен. Http-сервер, у которого ответ был, вешал демона на
   * той стороне; отчёт о подъёме окна того не стоит.
   */
  async function focusSession(row) {
    await invoke('hide_picker');
    try {
      await invoke('focus_window_mqtt', { id: row.id, base: focusBase(row) });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    error = '';
    // Та же отметка «посмотрел», что и у открытия: сессию человек увидел.
    await markSeen(row.id, Math.floor(Date.now() / 1000));
  }

  /**
   * Поднять раскладку снимка.
   *
   * Две дороги, и выбирает между ними та же проверка, что у Enter на строке
   * сессии. На машине с менеджером просьба уходит ему — как было всегда.
   * На маке менеджера нет: там восстановление значит «открыть сессии снимка»,
   * и открывает их сам пикер, а места им расставит оконный трекер, когда окна
   * появятся. Знать о восстановлении трекеру для этого не нужно.
   *
   * Адрес просьбы берётся у снимка: у каждой машины свой префикс топиков, и
   * уйти она обязана той, что снимок сняла.
   *
   * Пикер гасится до просьбы, как и на фокусе: окна поднимутся на том же
   * экране, и держать поверх них список незачем.
   *
   * Пустой `sessionIds` значит «весь снимок»: так просит заголовок раскладки.
   */
  async function restoreSnapshot(snapshotId, sessionIds) {
    const owner = snapshotOwner(snapshotId);
    const transport = window.OpenTransport.chooseOpenTransport(
      owner, CONFIG.windowHost, CONFIG.mqtt.configured,
    );
    await invoke('hide_picker');
    if (transport !== 'manager') return restoreLocally(snapshotId, sessionIds);
    try {
      await invoke('restore_snapshot_mqtt', {
        id: snapshotId, sessionIds,
        base: (owner || {}).mqttBase || '',
      });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    error = '';
  }

  /**
   * Восстановление своими силами: поднять сессии снимка по одной.
   *
   * Именно **поднять**, а не завести новые. Место запомнено за идентификатором
   * сессии, и новая сессия получила бы новый id — трекеру было бы нечего
   * искать, и окно осталось бы там, куда его положила система. Отсюда и форма
   * строки: без `window`, `tmux` и `pid` `chooseOpenStrategy` отвечает
   * `resume`, а это ровно то, что нужно.
   *
   * По одной и с паузой — не украшение. Два терминала, поднявшиеся разом,
   * трекер не различит: у обоих заголовок ещё не устоялся, а привязка идёт
   * именно по нему. Windows-сторона делает то же самое и по той же причине.
   *
   * Уже открытые пропускаются: второе окно той же сессии дралось бы с первым
   * за один слот, и место досталось бы неизвестно какому.
   *
   * Цикл останавливается на первом отказе `openSession`, а не безусловно
   * чистит `error` в конце. Раньше он это делал всегда — жалоба, которую
   * `openSession` только что выставила, стиралась тут же, и на скрытом окне
   * (такт опроса — минуты) человек не видел отказ ни сразу, ни при следующем
   * открытии пикера. Прерывание к тому же честнее молчаливого перебора
   * остатка: одна и та же сломанная ssh-сессия откажет и следующему
   * терминалу, а дотягивать раскладку в этих условиях незачем.
   */
  async function restoreLocally(snapshotId, sessionIds) {
    const snap = snapshotById(snapshotId);
    if (!snap) return;
    const wanted = new Set(sessionIds || []);
    const open = window.PickerSnapshots.openIdsFromState(lastState);
    const list = (Array.isArray(snap.sessions) ? snap.sessions : [])
      .filter(s => s && s.id && !open.has(s.id))
      .filter(s => !wanted.size || wanted.has(s.id));
    for (const s of list) {
      error = '';
      await openSession({ id: s.id, cwd: s.cwd || '', title: s.title || '', kind: 'snapshot-session' });
      if (error) return;
      await new Promise(resolve => setTimeout(resolve, 1200));
    }
    error = '';
  }

  /**
   * Открыть сессию в новом окне kitty.
   *
   * Стратегию выбирает эта же сторона по строке списка. Строка старше
   * секунды, и на Windows выбор делал бэкенд в момент клика по живому
   * состоянию — здесь такого бэкенда нет: ccfzf --state отдаёт снимок и
   * уходит. Расхождение стоит недорого: tmux-панель, которой уже нет, даст
   * ошибку в самом kitty, а не тихо откроет не то.
   */
  async function openSession(row) {
    if (!row) return;
    const strategy = window.OpenStrategy.chooseOpenStrategy(
      row, CONFIG.caps, { canFocus: rowCanFocus(row) },
    );
    // Развилку целиком решает chooseEnterAction (open-transport.js), а не
    // условия по месту: у неё есть тесты на каждый вид строки и на все
    // состояния трекера, а у пары if-ов в этом файле их не было — отсюда и
    // взялись подъём окна мимо права на передний план и Enter, не сделавший
    // ничего у незнакомой трекеру сессии.
    const action = window.OpenTransport.chooseEnterAction(
      row, strategy, openManagerHere(), CONFIG.windowHost, CONFIG.mqtt.configured,
    );
    // Окно уже открыто, и поднять его умеет только эта дорога: она гасит пикер
    // до публикации и выдаёт трекеру право на передний план.
    if (action === 'focus') return focusSession(row);
    // Менеджер знает профиль Windows Terminal для этого проекта; собранная
    // здесь команда его теряет.
    if (action === 'manager') return openViaManager(row);
    if (sshHostMissing()) return;
    const cmd = window.OpenStrategy.buildOpenCommand(row, strategy, {
      sshHost: CONFIG.sshHost, terminal: CONFIG.terminal, helperPath: await helperPath(),
    });
    if (!cmd) {
      // Пустая команда у терминала с помощником значит, что путь не приехал:
      // молчать нельзя, иначе Enter не сработал бы без единого слова.
      if (helperNeeded()) { error = helperError || 'terminal helper is not available'; render(); }
      return;
    }
    if (cmd.destructive) {
      const ok = confirm(
        `Take over session "${sessionName(row)}"?\n\n`
        + `Process ${row.pid} on ${CONFIG.sshHost} will get SIGHUP and exit, and its window on Windows will close.\n`
        + `Background jobs started in its shell will die with it.`,
      );
      if (!ok) return;
    }
    try {
      await invoke('spawn_detached', { argv: cmd.argv });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    // Отметка «посмотрел» ставится здесь: другого повода на маке нет.
    await markSeen(row.id, Math.floor(Date.now() / 1000));
    invoke('hide_picker');
  }

  /**
   * Попросить трекер открыть сессию у себя.
   *
   * Один вход на два повода: Enter на машине самого трекера (ветка `manager`
   * в openSession выше) и пункт меню «Open on <host>» с чужой машины. Publish
   * в MQTT дойдёт до демона одинаково независимо от того, откуда он
   * отправлен, и тело просьбы у обоих одно — разводить их значило бы завести
   * два места, где отметка «посмотрел» и гашение пикера ставятся по-разному.
   *
   * Пикер гасится до просьбы: она кончается окном — поднятым, восстановленным
   * или новым, — и гашение после отбирало бы у него передний план. Право на
   * передний план выдаёт сама команда `open_session_mqtt`; кому именно, ей
   * знать не нужно (`allow_any_foreground` в main.rs).
   *
   * Каталог проекта едет рядом с id, и без него просьба часто не сработала бы
   * вовсе: менеджер ищет сессию среди своих слотов, а список пикера приезжает
   * от ccfzf с ssh-хоста и знает сессии, которых на Windows не открывали ни
   * разу. По каталогу менеджер открывает терминал с профилем из
   * `claudeWt.projects` — ровно то, чего собранная здесь команда `wt.exe` не
   * умеет.
   */
  async function openViaManager(row) {
    await invoke('hide_picker');
    try {
      await invoke('open_session_mqtt', {
        id: row.id, cwd: window.OpenTransport.rowProjectDir(row), base: managerBase(),
      });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    error = '';
    // Отметка «посмотрел» — та же, что и у местного открытия: сессию человек
    // сейчас увидит.
    await markSeen(row.id, Math.floor(Date.now() / 1000));
  }

  function choose() {
    const row = rows[active];
    if (!row) return;
    // Заголовок секции: Enter на нём не открывает ничего, а сворачивает или
    // разворачивает секцию. Стоит до разбора обычных видов строк: сессии за
    // ним нет вовсе, и любая ветка ниже приняла бы его за строку без id.
    if (row.kind === 'section') {
      const layout = layoutName();
      collapsed = {
        ...collapsed,
        [layout]: { ...collapsed[layout], [row.sectionKey]: !row.collapsed },
      };
      saveUi();
      render();
      return;
    }
    // Заголовок дня: свернуть или развернуть день. Восстанавливать здесь
    // нечего — снимков за день несколько, и «подними их все» никто не просил.
    // Запоминается только в памяти страницы (см. `collapsedDays`), поэтому и
    // `saveUi` тут не зовётся, в отличие от заголовка секции.
    if (row.kind === 'snapshot-day') {
      collapsedDays = { ...collapsedDays, [row.day]: !row.collapsed };
      render();
      return;
    }
    // Заголовок снимка: поднять раскладку целиком.
    if (row.kind === 'snapshot') return restoreSnapshot(row.id, []);
    // Сессия из снимка: у открытой окно уже есть, и Enter должен поднять его,
    // а не заводить второе — восстановление её всё равно пропустило бы.
    if (row.kind === 'snapshot-session') {
      return row.open ? focusSession(row) : restoreSnapshot(row.snapshotId, [row.id]);
    }
    // У строки проекта нет id сессии — есть только каталог, и что с ним
    // делать, решает менеджер: поднять окно этого проекта или завести сессию с
    // его профилем. Enter здесь значит «покажи мне проект», а не «дай ещё один
    // терминал» — вторая просьба живёт под `^N`.
    if (row.kind === 'project') return openProjectRow(row);
    return openSession(row);
  }

  /**
   * Строка поиска изменилась: пересобрать список и перерисовать.
   *
   * Через regroup, а не render: от запроса зависит не только то, что рисуется,
   * но и то, что вообще попадает в список — непустой запрос отменяет отсевы
   * `onlyLive` и `onlyWindow` (`activeFilters` в session-groups.js). С одним
   * только render отмена срабатывала бы к следующему ответу агрегатора — а тот
   * может не прийти вовсе: на скрытом окне такт уходит в минуты, а
   * неизменившееся состояние отсекается по отпечатку. Та же мина, что уже
   * сработала на галках-фильтрах в статуслайне.
   */
  function onSearchInput() {
    active = 0;
    selectionReset = true;
    regroup();
  }

  /**
   * Вернуть фокус в строку поиска, ничего в ней не меняя.
   *
   * Каретка ставится в конец, а не выделяется всё: `beginShow` при показе окна
   * как раз выделяет — там строку и правда начинают заново, — а здесь человек
   * возвращается к уже набранному, и следующая буква не должна стереть его
   * запрос.
   */
  function focusSearch() {
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
  }

  /**
   * Переключить раскладку окна: узкая ↔ широкая.
   *
   * Входов сюда два — `^F` и кнопка в статуслайне, — и код у них общий
   * намеренно: вторая копия `set_picker_size` + `saveUi` разъехалась бы с
   * первой, а увидеть это можно было бы только глазами, на живом окне.
   *
   * Размер ставит Rust: у окна нет декораций, и `window.resizeTo` на нём не
   * работает. Отказ уходит в общую строку ошибки — промолчи мы, человек решил
   * бы, что режим переключился, а рама осталась прежней.
   */
  function toggleFullscreen() {
    fullscreen = !fullscreen;
    invoke('set_picker_size', { fullscreen })
      .catch((err) => { error = String(err); });
    saveUi();
    // Кнопку красит paintToggles, а `render` её не зовёт: на дороге от
    // настроек (`ui-changed`) до неё доходит `regroup`, а отсюда — никто.
    // Без этой строки кнопка отставала бы на одно нажатие, показывая прошлую
    // раскладку до следующего ответа агрегатора.
    paintToggles();
    render();
  }

  /**
   * Esc: сначала очистить строку поиска, и только на пустой — погасить окно.
   *
   * Режим живёт префиксом в самой строке (`/p`, `/h`, `/s`), то есть выйти из
   * режима — это стереть текст. Гасил бы Esc окно сразу, единственным способом
   * вернуться к обычному списку было бы стирание руками, а самая привычная
   * клавиша отмены уводила бы из пикера вовсе.
   *
   * Очистка одношаговая — вместе с префиксом, а не «сначала текст, потом
   * префикс»: выход из `/p foo` тремя нажатиями читался бы как заедание
   * клавиши. Отсюда и обещание в справочнике: два нажатия, не больше.
   *
   * Зовётся та же onSearchInput, что и при правке строки руками. Без неё
   * `active` и `selectionReset` остались бы от прежнего запроса, и выбор
   * повис бы на строке, которой в новом списке нет.
   *
   * На свежепоказанном окне строка пуста всегда (`beginShow`), так что первый
   * же Esc после открытия гасит пикер, как и раньше.
   */
  function onEscape() {
    if (search.value) {
      search.value = '';
      onSearchInput();
      return;
    }
    invoke('hide_picker');
  }

  function closeMenu() {
    menuOpen = false;
    menuActions = [];
    menuActive = 0;
    menuSessionId = null;
    actionsBackdrop.classList.remove('open');
    actionsBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  function closeInfo() {
    infoOpen = false;
    infoBackdrop.classList.remove('open');
    infoBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  // ── Перетаскивание заголовков секций ───────────────────────────────────
  //
  // Тащат за заголовок, а не за строку: строки заняты кликом, который
  // открывает сессию. Перетаскивание своё, на pointer-событиях, а не HTML5
  // drag-and-drop: у вебвью Tauri `dragDropEnabled` по умолчанию `true`, и
  // системный обработчик файлового перетаскивания съедает события страницы —
  // в doc-комментарии поля у `tauri-utils` это записано прямо («Disabling it
  // is required to use HTML5 drag and drop on the frontend on Windows»).
  // Своё перетаскивание вдобавок проще согласовать с придержанным тактом.
  //
  // Порог в несколько пикселей обязателен: без него любой клик по заголовку
  // становился бы перетаскиванием на ноль позиций, и свернуть секцию мышью
  // стало бы нечем.
  const DRAG_THRESHOLD = 4;
  let drag = null;
  // Ответ агрегатора, придержанный на время перетаскивания. Такт тикает раз в
  // секунду, planListSync правит изменившиеся элементы — перетаскиваемый узел
  // подменился бы под указателем прямо в движении. В широкой раскладке
  // вдобавок менялся бы blocksShape, а это пересборка контейнеров целиком.
  let heldState = null;
  // Клик приходит после pointerup, и после настоящего перетаскивания он
  // свернул бы секцию, которую только что перенесли.
  let suppressClick = false;
  const dropLine = document.getElementById('drop-line');

  /** Ключ секции у DOM-узла её заголовка. */
  function sectionKeyOf(node) {
    const row = rows[Number(node.dataset.index)];
    return row && row.kind === 'section' ? row.sectionKey : '';
  }

  /**
   * Переставить ключ в списке.
   *
   * `to` считается по видимому списку, где перетаскиваемая секция ещё стоит на
   * своём месте: убрав её раньше, чем поправлен номер, мы съехали бы на
   * единицу при движении вниз.
   */
  function moveKey(keys, key, to) {
    const from = keys.indexOf(key);
    const rest = keys.filter(k => k !== key);
    const at = from !== -1 && from < to ? to - 1 : to;
    rest.splice(Math.max(0, Math.min(rest.length, at)), 0, key);
    return rest;
  }

  /** Сколько заголовков выше указателя — столько и позиция вставки. */
  function dropIndexOf(nodes, y) {
    let at = 0;
    for (const node of nodes) {
      const r = node.getBoundingClientRect();
      if (y > r.top + r.height / 2) at++;
    }
    return at;
  }

  /** Заголовки секций узкого списка, в видимом порядке. */
  function narrowHeaders() {
    return [...list.querySelectorAll('.row.section')];
  }

  /**
   * Куда встанет секция в широкой раскладке: колонка и место в ней.
   *
   * Колонка ищется по указателю, а не по смыслу секции: человек волен
   * перенести её куда угодно, и это отступление от умолчания и есть смысл
   * задачи. Промах мимо всех колонок уводит в крайнюю — иначе у края экрана
   * перетаскивание молча не срабатывало бы.
   */
  function wideDropTarget(x, y) {
    const cols = [...list.querySelectorAll('.block-col')];
    if (!cols.length) return null;
    let col = cols.find((c) => {
      const r = c.getBoundingClientRect();
      return x >= r.left && x <= r.right;
    });
    if (!col) {
      col = x < cols[0].getBoundingClientRect().left ? cols[0] : cols[cols.length - 1];
    }
    const found = col.className.match(/col-(\d)/);
    const column = found ? Number(found[1]) : 1;
    const blocks = [...col.querySelectorAll('.block')];
    return { col, column, at: dropIndexOf(blocks, y), keys: blocks.map(b => b.dataset.block) };
  }

  /**
   * Пустые колонки на время перетаскивания.
   *
   * Дописываются узлами, а не перерисовкой списка: перерисовка заменила бы
   * узел, на котором висит захват указателя, и перетаскивание оборвалось бы в
   * момент начала. Без них секцию, ушедшую из колонки последней, вернуть было
   * бы некуда — пустой колонки нет в DOM, и указателю не во что попасть.
   */
  function addDropZones() {
    if (!fullscreen) return;
    const have = new Set([...list.querySelectorAll('.block-col')]
      .map(c => (c.className.match(/col-(\d)/) || [])[1]));
    for (let n = 1; n <= WIDE_COLUMNS; n++) {
      const column = String(n);
      if (have.has(column)) continue;
      const zone = document.createElement('div');
      zone.className = `block-col col-${column} drop-zone`;
      // Колонки идут по возрастанию номера, и вставлять надо между соседями,
      // а не в конец: иначе пустая вторая оказалась бы правее третьей.
      const after = [...list.querySelectorAll('.block-col')]
        .find(c => Number((c.className.match(/col-(\d)/) || [])[1]) > Number(column));
      list.insertBefore(zone, after || null);
    }
  }

  function clearDropZones() {
    for (const zone of list.querySelectorAll('.block-col.drop-zone')) zone.remove();
  }

  /** Показать, куда встанет секция. */
  function paintDropLine(x, y) {
    if (fullscreen) {
      const target = wideDropTarget(x, y);
      if (!target) return;
      const colRect = target.col.getBoundingClientRect();
      const blocks = [...target.col.querySelectorAll('.block')];
      const above = blocks[target.at - 1];
      const below = blocks[target.at];
      const top = below ? below.getBoundingClientRect().top
        : above ? above.getBoundingClientRect().bottom
          : colRect.top + 4;
      dropLine.style.left = `${colRect.left}px`;
      dropLine.style.width = `${colRect.width}px`;
      dropLine.style.top = `${top}px`;
    } else {
      const headers = narrowHeaders();
      const at = dropIndexOf(headers, y);
      const listRect = list.getBoundingClientRect();
      const below = headers[at];
      const top = below ? below.getBoundingClientRect().top
        : headers.length ? headers[headers.length - 1].getBoundingClientRect().bottom
          : listRect.top;
      dropLine.style.left = `${listRect.left}px`;
      dropLine.style.width = `${listRect.width}px`;
      dropLine.style.top = `${top}px`;
    }
    dropLine.classList.add('on');
  }

  /** Записать новый порядок и вернуть список к обычной жизни. */
  function commitDrag(x, y) {
    if (fullscreen) {
      const target = wideDropTarget(x, y);
      if (!target) return;
      // Ключ вынимается из всех колонок и кладётся в названную: секция одна,
      // и остаться в прежней колонке она не может.
      const columns = order.wide.map(keys => keys.filter(k => k !== drag.key));
      // Видимый порядок колонки, а не сохранённый: сохранённого может не быть
      // вовсе, а поставить секцию надо туда, куда смотрит человек.
      const visible = target.keys.filter(k => k !== drag.key);
      const at = Math.max(0, Math.min(visible.length, target.at
        - (target.keys.indexOf(drag.key) !== -1 && target.keys.indexOf(drag.key) < target.at ? 1 : 0)));
      visible.splice(at, 0, drag.key);
      columns[target.column - 1] = visible;
      order = { ...order, wide: columns };
    } else {
      // Видимый порядок, а не сохранённый: в файле может не быть ничего, а
      // человек переносит то, что видит.
      const headers = narrowHeaders();
      const visible = headers.map(sectionKeyOf).filter(Boolean);
      order = { ...order, narrow: moveKey(visible, drag.key, dropIndexOf(headers, y)) };
    }
    // Порядок секций, которых сейчас нет на экране (лёг трекер — нет и его
    // секции), в файле не сохраняется: он записывается по видимому списку.
    // Вернувшаяся машина встанет в конец, по тому же правилу, по которому
    // туда встаёт всё неназванное. Помнить место того, чего нет, значило бы
    // держать в файле ключи, про которые уже не сказать, живые они или мусор.
    saveUi();
  }

  function endDrag() {
    if (!drag) return;
    const moved = drag.moved;
    if (drag.node) drag.node.classList.remove('dragging');
    drag = null;
    dropLine.classList.remove('on');
    clearDropZones();
    // Придержанный ответ применяется сразу после отпускания — вместе с
    // пересборкой каркаса, которой ждали.
    if (heldState) {
      const payload = heldState;
      heldState = null;
      applyState(payload);
    } else if (moved) {
      render();
    }
  }

  list.addEventListener('pointerdown', (e) => {
    if (menuOpen || infoOpen || keysOpen) return;
    // Только левой кнопкой: правая открывает меню строки.
    if (e.button !== 0) return;
    const node = e.target.closest('.row.section');
    if (!node) return;
    // Заголовок бывает строкой только там, где секции — постоянный список:
    // при пустом запросе и без префикса (признак `foldable`). Под запросом он
    // подпись, и `.row.section` там не найдётся вовсе, так что отдельной
    // проверки на foldable здесь не нужно.
    const key = sectionKeyOf(node);
    if (!key) return;
    drag = { key, node, x: e.clientX, y: e.clientY, moved: false };
    // Захват на узел: увести указатель за пределы строки — обычное дело, а
    // без захвата события ушли бы соседу, и перетаскивание оборвалось бы.
    node.setPointerCapture(e.pointerId);
  });

  list.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x) < DRAG_THRESHOLD
        && Math.abs(e.clientY - drag.y) < DRAG_THRESHOLD) return;
      drag.moved = true;
      suppressClick = true;
      drag.node.classList.add('dragging');
      addDropZones();
    }
    paintDropLine(e.clientX, e.clientY);
  });

  list.addEventListener('pointerup', (e) => {
    if (!drag) return;
    if (drag.moved) commitDrag(e.clientX, e.clientY);
    endDrag();
  });

  // Отмена приходит вместо pointerup, когда указатель отобрала система.
  list.addEventListener('pointercancel', () => {
    if (drag) drag.moved = false;
    endDrag();
  });

  /**
   * Клавиша справочника: F1 или `Ctrl`/`Cmd` с `?`.
   *
   * Голого `?` здесь нет и быть не может: поле поиска сфокусировано всегда,
   * `?` — печатный знак, и прямая ветка отобрала бы его у поиска насовсем. Та
   * же цена, за которую `seen` уехал с `^V` на `^D`. С модификатором знак
   * поиску не нужен, и его можно занять.
   *
   * Сверяется `e.code`, а не `e.key`: в русской раскладке на этой клавише
   * точка, и `e.key` пришёл бы ею. Shift не спрашивается — на US-раскладке `?`
   * это `Shift+/`, а на других тот же знак берут иначе; заодно справочник
   * открывает и `Ctrl+/`, а больше эта клавиша ни за кем не числится.
   *
   * С `RESERVED_CODES` (action-hotkey.js) ни та, ни другая форма не спорит:
   * за окном заняты только «один Ctrl или Cmd плюс буква».
   */
  function isKeysHotkey(e) {
    if (e.key === 'F1') return true;
    return (e.ctrlKey || e.metaKey) && !e.altKey && e.code === 'Slash';
  }

  function closeKeys() {
    keysOpen = false;
    keysBackdrop.classList.remove('open');
    keysBackdrop.setAttribute('aria-hidden', 'true');
    search.focus();
  }

  /**
   * Справочник клавиш.
   *
   * Список собирает buildKeyReference из единственной таблицы клавиш
   * (action-hotkey.js) плюс того, что знает только страница: настроенных
   * человеком действий, глобальных хоткеев и проектных, приехавших ответом
   * агрегатора. Написать его здесь руками нельзя — вторая копия разошлась бы
   * с обработчиком молча, и окно обещало бы клавишу, которую никто не слушает.
   */
  function openKeys() {
    const sections = window.KeyReference.buildKeyReference({
      trackerHere: trackerIsHere(),
      actions: CONFIG.actions,
      hotkey: CONFIG.hotkey,
      projectsHotkey: CONFIG.projectsHotkey,
      projects: projectRows,
      hotkeysTaken,
    });
    keysRows.innerHTML = sections.map(section =>
      `<div class="keys-section">${escapeHtml(section.title)}</div>`
      + section.rows.map(r =>
        `<div class="info-row${r.taken ? ' taken' : ''}">`
        + `<span class="k">${escapeHtml(r.key)}</span>`
        + `<span class="v">${escapeHtml(r.label)}</span></div>`).join('')).join('');
    keysOpen = true;
    keysBackdrop.classList.add('open');
    keysBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  function openInfo(session) {
    if (!session) return;
    const nowSec = Math.floor(Date.now() / 1000);
    // Через sessionName, а не по label напрямую: у безымянной сессии он пуст,
    // и заголовок диалога тогда остаётся с одним путём. См. sessionName.
    infoTitle.textContent = `${sessionName(session)} — ${shortPath(session.cwd || '')}`;
    infoRows.innerHTML = window.SessionInfo.buildSessionInfoRows(session, nowSec)
      .map(row => `<div class="info-row"><span class="k">${escapeHtml(row.label)}</span>`
        + `<span class="v">${escapeHtml(row.value)}</span></div>`)
      .join('');
    infoOpen = true;
    infoBackdrop.classList.add('open');
    infoBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  function paintMenu() {
    const nodes = actionsList.querySelectorAll('.action-row');
    nodes.forEach((node, i) => node.classList.toggle('active', i === menuActive));
  }

  function renderMenu(data) {
    menuSessionId = data.id;
    menuActions = data.actions || [];
    menuActive = 0;
    const name = data.label ? sessionName(data) : '';
    const title = name
      ? `${name} — ${shortPath(data.cwd || '')}`
      : shortPath(data.cwd || '') || 'Session';
    actionsTitle.textContent = title;
    if (!menuActions.length) {
      actionsList.innerHTML = '';
      actionsEmpty.style.display = 'block';
    } else {
      actionsEmpty.style.display = 'none';
      menuKeysShown = window.ActionHotkey.menuKeys(menuActions);
      actionsList.innerHTML = menuActions.map((action, index) => {
        // Клавиша справа. В открытом меню пункт запускается голой буквой, и
        // подписана она так же — без `^`: Ctrl здесь не нажимают. Комбинация
        // из конфига остаётся запасной подписью для пунктов без буквы, а
        // `^N` для списка по-прежнему честен — он в справочнике F1.
        const letter = menuKeysShown[index];
        const shown = letter || formatHotkey(action.hotkey || '');
        const hotkey = shown ? `<span class="action-hotkey">${escapeHtml(shown)}</span>` : '';
        // Значок: картинка приложения, если Rust её отдал, иначе глиф.
        // Экранируется здесь, вместе с остальной строкой: data-URI приходит
        // из Rust, но правило одно на всю сборку разметки.
        const icon = window.ActionIcons.actionIcon(action, actionIcons);
        const iconHtml = icon.kind === 'img'
          ? `<span class="action-icon"><img src="${escapeHtml(icon.src)}" alt=""></span>`
          : `<span class="action-icon${icon.cls ? ` ${icon.cls}` : ''}">${escapeHtml(icon.text)}</span>`;
        return `<div class="action-row${index === 0 ? ' active' : ''}" data-index="${index}" role="menuitem">` +
          `${iconHtml}<span class="action-label">${escapeHtml(action.label)}</span>${hotkey}</div>`;
      }).join('');
    }
    menuOpen = true;
    actionsBackdrop.classList.add('open');
    actionsBackdrop.setAttribute('aria-hidden', 'false');
    search.blur();
  }

  /**
   * Действия для строки: availableActions плюс пункт, который availableActions
   * дать не может — «открыть на трекере» зависит от машины-менеджера
   * (openManagerHere()), а не от самой строки, и availableActions её не видит.
   * Общая функция для openMenu и runAction: список меню и то, что runAction
   * готов выполнить, должны быть одним и тем же списком, а не двумя похожими.
   *
   * Применимость пункта решает canOpenRemote (open-transport.js) — не здесь:
   * она проверена тестами на каждый вид строки и все четыре состояния
   * трекера, а инлайновая проверка в этом файле такой проверки не имеет
   * вовсе.
   */
  function actionsFor(row) {
    const actions = window.SessionActions.availableActions(row, CONFIG);
    if (window.OpenTransport.canOpenRemote(row, openManagerHere(), CONFIG.windowHost, CONFIG.mqtt.configured)) {
      actions.push({
        id: 'open-remote',
        label: `Open on ${(openManagerHere() || {}).host}`,
      });
    }
    return actions;
  }

  function openMenu() {
    const session = rows[active];
    if (!session) return;
    // У заголовка секции нет ни id, ни имени: меню на нём вышло бы озаглавленным
    // словом «undefined» и без единого работающего пункта. Его действие одно —
    // Enter, он же клик.
    if (session.kind === 'section') return;
    // Меню считается здесь же, а не спрашивается у бэкенда: всё, из чего оно
    // складывается, уже лежит в строке.
    const actions = actionsFor(session);
    // Пустая рамка хуже отсутствующей: она обещает выбор, которого нет, и
    // закрывается второй клавишей вместо одной. Пусто бывает у строки внутри
    // снимка без каталога — тянуть там не за что, а восстановление у неё
    // висит на Enter.
    if (!actions.length) return;
    renderMenu({
      id: session.id,
      label: session.label,
      cwd: session.cwd,
      actions,
    });
  }

  /**
   * Имена, которые сейчас нельзя занимать.
   *
   * Две части. Первая — заголовки живых сессий из последнего ответа: имя
   * сессии и есть заголовок её окна, по нему оконный трекер привязывает
   * сессию к слоту, и мешают друг другу именно живые тёзки.
   *
   * Вторая — имена, которые пикер выдал сам за последнюю минуту. Без неё два
   * `^N` подряд, быстрее опроса, дали бы одно имя дважды: ответ агрегатора
   * ещё не знает о первой сессии. Минута — с запасом: `^N` жмут при открытом
   * окне, а открытому окну опрос идёт раз в секунду (`VISIBLE_TICK` в
   * src-tauri/src/poller.rs), да и сам показ окна даёт опрос немедленно.
   * Фоновый такт (от минуты до восьми) сюда не входит вовсе — в фоне `^N` и
   * не нажать.
   */
  const issuedNames = new Map();
  const ISSUED_TTL_MS = 60_000;

  function takenSessionNames() {
    const now = Date.now();
    for (const [name, at] of issuedNames) {
      if (now - at > ISSUED_TTL_MS) issuedNames.delete(name);
    }
    const live = lastSessions
      .filter(s => s && s.live)
      .map(s => s && s.title)
      .filter(t => typeof t === 'string' && t);
    return live.concat(Array.from(issuedNames.keys()));
  }

  /**
   * Поднять новую сессию в каталоге строки самому.
   *
   * Запасная дорога: и Enter на строке проекта, и «New session» сначала
   * спрашивают `chooseProjectOpenAction`, и сюда попадают там, где менеджера
   * нет — на чужой машине и без настроенного брокера. Профиль Windows Terminal
   * по каталогу здесь теряется, и иначе быть не может: соответствие живёт в
   * `claudeWt.projects` у windows11-manager, а на такой машине его нет вовсе.
   *
   * Отметки «просмотрено» здесь нет: смотреть ещё нечего, сессия только что
   * началась.
   */
  async function newSession(cwd) {
    if (!cwd || sshHostMissing()) return;
    const taken = takenSessionNames();
    // Пустая команда — отказ OpenStrategy, а не поломка: путь с `;` Windows
    // Terminal порежет на панели ещё до шелла. Сказать об этом обязательно —
    // иначе кнопка молча ничего не делает.
    const remote = window.OpenStrategy.newSessionCommand(cwd, taken);
    if (!remote) {
      error = `The path contains ";", there is nothing to open such a directory with: ${cwd}`;
      render();
      return;
    }
    // Через ту же terminalArgv, что и открытие сессии. Собранный здесь руками
    // `[file, ...args, 'ssh', …]` про подстановку не знал вовсе: у iTerm2 это
    // давало окно, в которое печатается литеральный `{command}`, а ssh с
    // аргументами уезжал osascript в никуда. Поймано живьём 2026-08-15.
    const argv = window.OpenStrategy.terminalArgv(
      CONFIG.terminal, ['ssh', '-t', CONFIG.sshHost, remote], { helperPath: await helperPath() },
    );
    if (!argv) {
      error = helperError || 'terminal helper is not available';
      render();
      return;
    }
    try {
      await invoke('spawn_detached', { argv });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    // Имя запоминается только после удачного запуска: занять его на отказе
    // значило бы отдать следующей сессии `-2` без всякой первой.
    const name = window.OpenStrategy.newSessionName(cwd, taken);
    if (name) issuedNames.set(name, Date.now());
    invoke('hide_picker');
  }

  /**
   * Enter на строке проекта: попросить менеджера открыть проект.
   *
   * Развилку «поднять окно этого каталога или завести сессию» принимает он:
   * правило «последняя открытая сессия проекта» написано и покрыто тестами у
   * него (`pickOpenProjectSession`), и профиль Windows Terminal по каталогу
   * знает тоже только он. Та же просьба, что уходит от проектного хоткея.
   *
   * Отметки «просмотрено» здесь нет и быть не может: у строки проекта нет id
   * сессии, отмечать нечего.
   *
   * Гасимся до просьбы, как `focusSession`, и по той же причине: у менеджера
   * оба исхода кончаются окном, которому нужен передний план, — поднятым или
   * только что открытым. Гашение после отбирало бы у него фокус сразу после
   * того, как окно его получило, и выглядело это свернувшимся терминалом раз
   * от раза: кто успел последним, тот передним планом и владеет. Цена — отказ
   * публикации человек увидит не сразу, а когда откроет пикер снова; у ветки
   * подъёма окна эта цена уплачена давно.
   */
  async function openProjectRow(row) {
    const dir = window.OpenTransport.rowProjectDir(row);
    const action = window.OpenTransport.chooseProjectOpenAction(
      row, openManagerHere(), CONFIG.windowHost, CONFIG.mqtt.configured,
    );
    if (action !== 'manager') return newSession(row.cwd);
    await invoke('hide_picker');
    try {
      await invoke('open_project_mqtt', { cwd: dir, base: managerBase() });
    } catch (e) {
      error = String(e);
      render();
      return;
    }
    error = '';
    // Enter здесь может и завести сессию: менеджер сам решает — поднять
    // открытую или заново вызвать `claude -n <basename>`. Занимаем базовое
    // имя каталога заранее, а не следующее свободное (`taken: []`, а не
    // `takenSessionNames()`) — именно его получит новая сессия, если решение
    // окажется таким. Занимать безопасно и во втором исходе: если менеджер
    // поднял уже открытую сессию, это имя и так занято её заголовком, и
    // отметка лишь задержится в issuedNames до TTL без всякого вреда. Без
    // этой отметки следующий `^N`, нажатый раньше, чем дамп ccfzf увидит
    // новую сессию, взял бы то же имя ещё раз.
    const name = window.OpenStrategy.newSessionName(dir, []);
    if (name) issuedNames.set(name, Date.now());
  }

  /**
   * «New session» — всегда новая, но профиль знает менеджер.
   *
   * Отличается от `openProjectRow` ровно тем, что просит не искать открытую:
   * `^N` человек нажимает, когда сессия уже есть и нужна ещё одна.
   *
   * Имя считается здесь, а не на той стороне: менеджер списка занятых имён не
   * ведёт и взял бы basename каталога — то самое имя, которое уже занято, — а
   * два окна с одним заголовком трекер привязал бы к одной сессии. Пустое имя
   * значит отказ `OpenStrategy` (путь с `;`), и тогда местная дорога скажет об
   * этом человеку — своей копии того же сообщения здесь не надо.
   *
   * Гасится до просьбы — то же правило и та же цена, что у `openProjectRow`.
   */
  async function newSessionHere(row) {
    const dir = window.OpenTransport.rowProjectDir(row);
    const action = window.OpenTransport.chooseProjectOpenAction(
      row, openManagerHere(), CONFIG.windowHost, CONFIG.mqtt.configured,
    );
    if (action !== 'manager') return newSession(row.cwd);
    const taken = takenSessionNames();
    const name = window.OpenStrategy.newSessionName(dir, taken);
    if (!name) return newSession(row.cwd);
    // Имя занимается до отправки, а не после — в отличие от местной
    // newSession, где имя ждёт лишь миллисекунды локального spawn, здесь
    // invoke ждёт публикацию в брокер (таймаут до 5 с). Пикер эти секунды
    // уже погашен, но хоткей поднимает его обратно в любую из них: второй
    // `^N` увидел бы то же самое issuedNames, что и первый. Заняв имя
    // заранее, закрываем гонку, а не документируем её как отсутствующую.
    issuedNames.set(name, Date.now());
    await invoke('hide_picker');
    try {
      await invoke('new_session_mqtt', { cwd: dir, name, base: managerBase() });
    } catch (e) {
      // Отказ — имя не занято: сессия не поднялась, и следующая попытка
      // вправе получить то же самое.
      issuedNames.delete(name);
      error = String(e);
      render();
      return;
    }
    error = '';
  }

  /**
   * Выполнить действие над строкой.
   *
   * Применимость проверяется здесь, а не у вызывающего: пунктов меню и прямых
   * клавиш два разных входа, и правило «что этой строке можно» должно быть
   * одно. На Windows его знал сервер и сам сообщал об отказе — здесь спрашивать
   * некого.
   */
  function runAction(row, id) {
    if (!row) return;
    if (!actionsFor(row).some(a => a.id === id)) return;
    // Настроенные действия проверяются первыми: встроенных id немного, но
    // конфиг им не подчинён, и одинаковое имя не должно молча уводить в
    // встроенную ветку. Путь уже переведён — иначе действия не было бы в списке.
    const configured = CONFIG.actions.find(a => a.id === id);
    if (configured) {
      const argv = window.PathMap.buildActionArgv(configured, {
        localPath: window.PathMap.mapPath(row.cwd, CONFIG.pathMap),
        remotePath: row.cwd,
      });
      invoke('spawn_detached', { argv })
        .then(() => invoke('hide_picker'))
        .catch((e) => { error = String(e); render(); });
      return;
    }
    if (id === 'new') {
      newSessionHere(row);
      return;
    }
    if (id === 'pr') {
      // Форму ссылки уже проверил availableActions — до сюда доходит только
      // https://github.com/<owner>/<repo>/pull/<число>.
      invoke('spawn_detached', { argv: ['open', row.pr_url] });
      invoke('hide_picker');
      return;
    }
    if (id === 'unread') {
      markUnread(row);
      return;
    }
    if (id === 'seen') {
      markSeenNow(row);
      return;
    }
    if (id === 'open-remote') {
      openViaManager(row);
      return;
    }
    if (id === 'restore') {
      // Ровно то же, что делает Enter на заголовке снимка, и той же функцией:
      // вторая сборка просьбы разошлась бы с первой молча — ответа у
      // публикации в MQTT нет, и промах виден только тем, что ничего не
      // произошло.
      restoreSnapshot(row.id, []);
      return;
    }
    if (id === 'attach') {
      // Команду отдаём человеку, а не запускаем: reptyr тянет процесс к тому
      // tty, из которого его позвали. Терминал выбирает человек — пикер за
      // него угадать не может.
      const cmd = window.OpenStrategy.buildAttachCommand(row);
      // В подсказке — только первая половина: вторая длинная и нужна лишь при
      // повторном переносе. В буфер уходит команда целиком.
      const shown = cmd.split(' || ')[0];
      invoke('copy_to_clipboard', { text: cmd })
        .then(() => showNotice(`Copied: ${shown} — paste it into a terminal on ${CONFIG.sshHost}, wherever you want the session`))
        .catch((e) => { error = String(e); render(); });
      return;
    }
    if (id === 'info') openInfo(row);
  }

  function runMenuAction() {
    const action = menuActions[menuActive];
    if (!action || !menuSessionId) return;
    const id = menuSessionId;
    const actionId = action.id;
    closeMenu();
    // По id, а не по индексу active: список перерисовывается раз в секунду,
    // пока меню открыто, render() пересобирает rows в порядке текущей
    // сортировки, и active остаётся числом — строка под этим индексом может
    // смениться на другую сессию. Прямые клавиши из списка (обработчик ниже)
    // этой ловушке не подвержены: там меню не открыто, и active — это и есть
    // выбранная строка.
    runAction(rows.find(r => r.id === id), actionId);
  }

  function moveMenu(delta) {
    if (!menuActions.length) return;
    menuActive = (menuActive + delta + menuActions.length) % menuActions.length;
    paintMenu();
  }

  search.addEventListener('input', onSearchInput);

  // Подсказка «что сделает Shift+клик» держится отдельно от основного
  // обработчика keydown ниже: у того есть ранние выходы для открытых
  // оверлеев (menuOpen/infoOpen), а подсветка от режима оверлея не зависит —
  // Shift остаётся Shift'ом независимо от того, что сейчас открыто.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Shift') document.body.classList.add('shift');
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'Shift') document.body.classList.remove('shift');
  });
  // Alt+Tab с зажатым Shift уводит фокус из окна без keyup: без этого класс
  // остался бы висеть до следующего нажатия Shift после возврата.
  window.addEventListener('blur', () => {
    document.body.classList.remove('shift');
  });

  // Прямые клавиши дублируют пункты меню Ctrl+K без открытия самого меню —
  // буква ведёт прямо к id действия. Применимость проверяет runAction: у
  // строки без PR ^P просто ничего не делает.

  document.addEventListener('keydown', (e) => {
    // Третий оверлей — третья ветка, а не обобщение двух: у меню действий
    // есть выбор стрелками и запуск, а у двух статичных модалок — только
    // «закрыть». Общий код на три ветки пришлось бы разветвлять обратно.
    if (keysOpen) {
      // Чем открыли, тем и закрывается: обе клавиши справочника —
      // переключатели.
      if (e.key === 'Escape' || e.key === 'Enter' || isKeysHotkey(e)) {
        e.preventDefault();
        closeKeys();
      } else if (!(e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); }
      return;
    }
    if (infoOpen) {
      if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); closeInfo(); }
      else if (!(e.ctrlKey || e.metaKey || e.altKey)) { e.preventDefault(); }
      return;
    }
    if (menuOpen) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveMenu(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveMenu(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); runMenuAction(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
      else if (!(e.ctrlKey || e.metaKey || e.altKey)) {
        // Простые клавиши меню и раньше глотало целиком — место было
        // свободно. Теперь буква запускает свой пункт; всё остальное
        // по-прежнему гасится, чтобы набор не проваливался в поле поиска
        // под меню.
        e.preventDefault();
        const code = e.code.match(/^Key([A-Z])$/);
        const letter = code ? code[1].toLowerCase() : '';
        const index = letter ? menuKeysShown.indexOf(letter) : -1;
        if (index !== -1) {
          menuActive = index;
          runMenuAction();
        }
      }
      return;
    }
    // `/` возвращает фокус в поиск — и только тогда, когда его там нет.
    //
    // Обработчик клавиш висит на document, поэтому клавиши работают всегда, а
    // набранный текст уходит туда, где фокус. Клик по строке списка, по
    // заголовку секции или по галке статуслайна уводит его с поля — и набор
    // после этого проваливается в никуда, без единого признака, что что-то не
    // так. `/` — выход из этого состояния.
    //
    // Проверка фокуса обязательна, и это не осторожность: `/` начинает все
    // пять префиксов режимов (`/l`, `/r`, `/h`, `/p`, `/s`), и перехватывай
    // ветка его безусловно — набрать `/p` стало бы нечем вовсе. Та же цена,
    // за которую `seen` уехал с `^V` на `^D`, и та же, по которой справочник
    // открывает F1, а не `?`.
    //
    // Символ при этом в строку не попадает (`preventDefault`): `/` здесь —
    // команда «вернись в поиск», а не ввод. Иначе нажатие поверх набранного
    // «foo» дало бы «foo/» — мусор, которого человек не просил.
    if (e.key === '/' && !(e.ctrlKey || e.metaKey || e.altKey)
      && document.activeElement !== search) {
      e.preventDefault();
      focusSearch();
      return;
    }
    if (isKeysHotkey(e)) {
      e.preventDefault();
      openKeys();
      return;
    }
    // `,` вместе с Ctrl или Cmd — общесистемная привычка открывать настройки.
    // Сверяется e.code: в русской раскладке на этой клавише «б», и e.key
    // пришёл бы им.
    if ((e.ctrlKey || e.metaKey) && e.code === 'Comma') {
      e.preventDefault();
      invoke('open_settings').catch((err) => { error = String(err); render(); });
      return;
    }
    // Shift и Alt исключены во всех трёх встроенных ветках ниже: isReserved в
    // action-hotkey.js занимает за окном только форму «один Ctrl или Cmd плюс
    // буква», то есть `Ctrl+Shift+A` человек вправе назначить своему действию.
    // Без этой оговорки встроенная ветка съедала бы событие первой, и
    // настроенный хоткей молча не работал бы.
    const plainCtrl = (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey;
    if (plainCtrl && e.code === 'KeyK') {
      e.preventDefault();
      openMenu();
      return;
    }
    if (plainCtrl && e.code === 'KeyP') {
      // Ставит `/p ` в начало строки поиска. Не режим и не переключатель:
      // состояние живёт в самом тексте, и стирание префикса возвращает к
      // сессиям. preventDefault обязателен и здесь: без него Ctrl+P в webview
      // уйдёт в печать.
      e.preventDefault();
      showProjects();
      return;
    }
    if (plainCtrl && e.code === 'KeyL') {
      // `/l ` — только свои живые сессии.
      e.preventDefault();
      showMode('local');
      return;
    }
    if (plainCtrl && e.code === 'KeyH') {
      // `/h ` — история. Цена клавиши записана в action-hotkey.js.
      e.preventDefault();
      showMode('history');
      return;
    }
    if (plainCtrl && e.code === 'KeyS') {
      // Ставит `/s ` в начало строки поиска — как `^P` ставит `/p `. Режим
      // живёт в самом тексте, стирание префикса возвращает к сессиям.
      //
      // Молча ничего не делает там, где восстановление невыполнимо: тот же
      // отказ, что и у подсказки, и лучше молчащего режима с молчащим Enter.
      e.preventDefault();
      if (!trackerIsHere()) return;
      showMode('snapshots');
      return;
    }
    if (plainCtrl && e.code === 'KeyF') {
      // Режим окна — не префикс в строке поиска, в отличие от `^P` и `^S`: он
      // меняет раскладку, а не то, что показано, и потому живёт флагом и
      // помнится в ui.json.
      e.preventDefault();
      toggleFullscreen();
      return;
    }
    // ^G/^U/^I и прочие действия — те же, что и в меню. preventDefault здесь
    // обязателен: иначе Ctrl+P в webview уйдёт в печать, а Ctrl+G — в поиск.
    if (plainCtrl) {
      const directActionId = CODE_TO_ACTION[e.code];
      if (directActionId) {
        e.preventDefault();
        runAction(rows[active], directActionId);
        return;
      }
    }
    // Настроенные действия — после встроенных: разбор конфига уже снял клавишу
    // у того, кто целился в занятую комбинацию, но порядок проверки оставляет
    // это правило верным и без него.
    const configured = CONFIG.actions.find(a => matchesHotkey(e, a.parsedHotkey));
    if (configured) {
      e.preventDefault();
      runAction(rows[active], configured.id);
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    // ←/→ уходят в навигацию только в широком режиме и только когда каретка
    // на краю запроса: внутри набранного текста они правят его, как раньше.
    // Поле поиска сфокусировано всегда, и отнять у него стрелки насовсем
    // значило бы лишить человека правки запроса — ту же цену уже заплатили за
    // буквы ярлыков, второй раз она ни к чему.
    else if (fullscreen && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && atQueryEdge(e.key)) {
      e.preventDefault();
      moveBlock(e.key === 'ArrowRight' ? 1 : -1);
    }
    else if (e.key === 'Enter') { e.preventDefault(); choose(); }
    else if (e.key === 'Escape') { e.preventDefault(); onEscape(); }
  });

  // Наведение на строку проекта гасит строки с другим каталогом во всех
  // панелях. mouseover, а не mouseenter: первый всплывает, и один обработчик
  // на списке видит переход между строками. Уход мыши со строки проекта на
  // соседнюю строку списка гасит подсветку тем же событием — closest не
  // находит `.row.project`, и каталог становится пустым.
  list.addEventListener('mouseover', (e) => {
    const node = e.target.closest('.row.project');
    const cwd = node ? (rows[Number(node.dataset.index)] || {}).cwd || '' : '';
    if (cwd === hoverProjectCwd) return;
    hoverProjectCwd = cwd;
    paintProjectDim();
  });

  // Уход мыши из списка целиком: mouseover там уже не придёт.
  list.addEventListener('mouseleave', () => {
    if (!hoverProjectCwd) return;
    hoverProjectCwd = '';
    paintProjectDim();
  });

  list.addEventListener('click', (e) => {
    if (menuOpen) return;
    // Клик приходит следом за pointerup: без этого настоящее перетаскивание
    // заодно сворачивало бы секцию, которую только что перенесли.
    if (suppressClick) { suppressClick = false; return; }
    const row = e.target.closest('.row');
    if (!row) return;
    active = Number(row.dataset.index);
    // Shift+клик переключает отметку вместо открытия: прочитанную строку
    // возвращает в непрочитанное, непрочитанную помечает просмотренной. Какое
    // из двух действий подходит строке, решает не клик, а availableActions —
    // те же условия, по которым пункты попадают в меню ^K. Промах по Shift не
    // должен превращаться в открытие сессии, поэтому строка без записи агента
    // (сессия без хука) просто ничего не делает.
    if (e.shiftKey) {
      runAction(rows[active], markToggleId(rows[active]));
      return;
    }
    choose();
  });

  // Правая кнопка по строке — тот же `^K`: меню действий у мыши другого входа
  // не имело вовсе, а клавиатурный `^K` работает по активной строке, до
  // которой мышью ещё надо доехать стрелками.
  //
  // preventDefault стоит до всех проверок и на весь список: родное меню
  // WebView2 («Назад», «Обновить», «Сохранить как») в пикере не делает ничего
  // осмысленного, а поверх нашего оно и вовсе перекрыло бы его. В поле поиска
  // родное меню остаётся — там из него берут «Вставить».
  list.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (menuOpen) return;
    const row = e.target.closest('.row');
    if (!row) return;
    active = Number(row.dataset.index);
    // paint, а не render: подсветке надо переехать на строку, по которой
    // щёлкнули, а список ради этого перерисовывать незачем — openMenu читает
    // rows[active], а не DOM.
    paint();
    openMenu();
  });

  actionsList.addEventListener('click', (e) => {
    const row = e.target.closest('.action-row');
    if (!row) return;
    menuActive = Number(row.dataset.index);
    runMenuAction();
  });

  actionsBackdrop.addEventListener('click', (e) => {
    if (e.target === actionsBackdrop) closeMenu();
  });

  infoBackdrop.addEventListener('click', (e) => {
    if (e.target === infoBackdrop) closeInfo();
  });

  keysBackdrop.addEventListener('click', (e) => {
    if (e.target === keysBackdrop) closeKeys();
  });

  // Клик по `?` не должен всплывать до statusline: там висит смена сортировки,
  // и открытие справочника заодно крутило бы её.
  keysButton.addEventListener('click', (e) => {
    e.stopPropagation();
    if (keysOpen) closeKeys();
    else openKeys();
  });

  sortControl.addEventListener('click', (e) => {
    e.preventDefault();
    if (menuOpen) return;
    // Сортировку крутит сам пикер: спрашивать было некого — на маке за списком
    // стоит ccfzf --state, который отдаёт сессии, а не готовые группы.
    sortMode = window.SessionGroups.cycleSort(sortMode);
    regroup();
    saveUi();
  });

  // Reset the palette for a show. Feed itself doesn't (re)start here — it
  // runs continuously in Rust, see the comment above applyState. Called both
  // from the 'picker-shown' listener (every show after the window has
  // finished loading) and, once, directly from start() to cover the show
  // that raced ahead of this webview finishing DOMContentLoaded (see
  // start()).
  function beginShow() {
    closeMenu();
    closeInfo();
    closeKeys();
    search.value = '';
    active = 0;
    selectionReset = true;
    // Панель прошлого показа забывается: её может уже не быть на экране, а
    // умолчание «первая не-заголовок» для свежего окна и есть верное.
    activePanel = '';
    // Наведение прошлого показа — туда же: указатель остался стоять на
    // строке проекта, пикер скрылся, а следующий показ рисует старый список
    // первым кадром. Без сброса paintProjectDim гасит его по каталогу,
    // наведённому в прошлый раз, — и на экране 0.3 прозрачности без единой
    // строки под курсором, которая бы это объясняла.
    hoverProjectCwd = '';
    // Показ начинается с чистого состояния: Shift, зажатый перед вызовом
    // пикера (или отпущенный, пока окно было скрыто и события до него не
    // доходили), не должен продолжать рисовать подсказку в новом сеансе.
    document.body.classList.remove('shift');
    search.focus();
    search.select();
    // Список предыдущего показа остаётся на экране до первого свежего ответа.
    // Здесь стояло `groups = []` — окно открывалось пустым, с «Loading…», и
    // настоящий список дорисовывался только через полсекунды (столько стоит
    // ssh на удалённый хост). Этот пустой кадр и мелькал при каждом открытии. Строки в
    // нём те же самые, а открытие сверяет живое состояние отдельно, — то есть
    // устаревший кадр никуда не уводит по ошибке.
    //
    // Свою отрисовку показ всё же делает: search.value только что очищен, и
    // фильтр предыдущего показа надо снять. Строки при этом на месте, syncList
    // трогает только те, что изменились.
    render();
    // Первый показ за загрузку страницы: рисовать нечего, и «Loading…» стоит
    // вместо пустоты. Дальше сюда не попадаем — список уже есть.
    if (!rows.length && !error) message.textContent = 'Loading…';
  }

  /**
   * Иконки приложений для меню.
   *
   * Отказ не событие: пустая карта значит «у всех пунктов глифы», и это
   * рабочее состояние — на маке оно единственное.
   */
  async function loadActionIcons() {
    try {
      actionIcons = await invoke('action_icons', {
        specs: window.ActionIcons.iconSpecs(CONFIG),
      }) || {};
    } catch (e) {
      actionIcons = {};
    }
  }

  /**
   * Версия в шапке справочника клавиш (F1).
   *
   * Зовём через invoke() — тот сам возвращает Promise.resolve() без моста,
   * и без него заголовок остаётся тем, что уже в разметке («ccfzf-picker»
   * без номера): в тестах, где __TAURI__ нет вовсе, это рабочее состояние, а
   * не ошибка. Строка в исходник не зашивается намеренно — она разошлась бы
   * с Cargo.toml на первом же релизе, и заметить это было бы нечем.
   */
  async function loadAppVersion() {
    try {
      const version = await invoke('app_version');
      if (version) keysTitle.textContent = `ccfzf-picker v${version}`;
    } catch (e) {
      // Тихо: карточка клавиш не критична для работы пикера, а без версии
      // заголовок и так читаем — просто без номера.
    }
  }

  async function start() {
    // До проверки моста: без __TAURI__ start() тут же выходит, а
    // loadAppVersion() безопасна и без него — invoke() внутри неё сама
    // возвращает Promise.resolve(), просто ничего не меняя в заголовке.
    loadAppVersion();
    if (!window.__TAURI__) { message.textContent = 'No backend detected.'; return; }
    const { listen } = window.__TAURI__.event;
    const { getCurrentWindow } = window.__TAURI__.window;

    // До первого опроса: без отметок список показал бы всё непрочитанным, и
    // кружки перекрасились бы через секунду — заметным миганием.
    try {
      seen = await invoke('load_seen') || {};
    } catch (e) {
      error = String(e);
    }

    // Тоже до первого опроса: из конфига берётся хост, которому этот опрос и
    // адресован. Испорченный yaml — это ошибка в статуслайне и умолчания, а не
    // пикер, который не открылся.
    try {
      CONFIG = window.ConfigShape.normalizeConfig(await invoke('load_config'));
    } catch (e) {
      error = String(e);
    }
    applyStaleOpacity();

    // Вид списка — до первой отрисовки: иначе первый показ рисуется чужой
    // сортировкой и перекладывается на глазах.
    try {
      // Умолчания — из uiToggles, не из плоской toggles: иначе normalizeUiState
      // увидела бы булевы умолчания вместо {list, statusline}, и уже сама
      // считала бы, что statusline у всех ключей по умолчанию false (что
      // сегодня и так верно, но с сохранением объекта, а не булевой карты).
      const ui = window.UiState.normalizeUiState(await invoke('load_ui'), {
        sort: sortMode, toggles: toggleDefaults(),
      });
      sortMode = ui.sort;
      uiToggles = ui.toggles;
      // toggles тут производная, а не источник: источник — uiToggles, и
      // именно его, а не эту плоскую карту, пишет saveUi().
      toggles = window.UiState.listColumns(uiToggles);
      fullscreen = ui.fullscreen;
      collapsed = ui.collapsed;
      order = ui.order;
      hidden = ui.hidden;
      // Размер просим у Rust сразу: окно открывается с размером из
      // tauri.conf.json, и без этого широкий режим помнился бы, а окно
      // осталось бы узким. Просим безусловно, в обе стороны: узкий режим —
      // такое же прочитанное состояние, а лишняя просьба на неизменившемся
      // окне ничего не стоит. Страница при этом почти всегда просит по
      // скрытому окну — загрузка идёт до первого показа, — и Rust такую
      // просьбу откладывает до показа сам (`SizeRequest` в main.rs): на
      // скрытом окне центровка не работает.
      invoke('set_picker_size', { fullscreen })
        .catch((err) => { error = String(err); });
      // Набор вынесенных в статуслайн галок мог прийти из файла другим, чем
      // при первой отрисовке разметки (до загрузки uiToggles ещё нет) —
      // разметку чекбоксов надо пересобрать под то, что реально загружено.
      renderChecks();
    } catch (e) {
      error = String(e);
    }

    // Запасная дорога: обычно нажатие проектного хоткея вообще сюда не
    // доходит, а уходит из Rust просьбой менеджеру поднять окно (`press` в
    // `project_hotkeys.rs`). Это событие ловит только ненастроенный брокер —
    // и тогда открывает новую сессию, а не продолжает старую: продолжать
    // нечего — сессии у него нет, есть только каталог.
    //
    // Через ту же newSession, в которую при том же ненастроенном брокере
    // откатываются и Enter (openProjectRow), и ^N (newSessionHere) — не
    // «как всегда», а именно в этом случае: при настроенном брокере оба идут
    // через менеджера, а сюда событие вообще не долетает. Раньше здесь
    // поднимался голый `claude`, без имени: сессия проектного хоткея
    // оставалась безымянной, и оконный трекер не мог найти её по заголовку
    // окна.
    await listen('project-hotkey', (event) => {
      newSession(event.payload);
    });

    // С каким режимом открыться. Rust показывает окно и называет режим:
    // показать он может и сам, а вот префикс в строке поиска — дело страницы,
    // режим живёт в тексте, а не флагом.
    //
    // Входов сюда два и подписка одна: второй глобальный хоткей (проекты) и
    // четыре пункта-режима в меню трея. Имя режима приезжает телом события и
    // ищется в `PREFIXES` — незнакомое `withPrefix` оставит строку как есть,
    // то есть окно просто откроется обычным списком.
    await listen('picker-mode', (event) => {
      showMode(event.payload);
    });

    // Какие клавиши не встали. Приезжает от Rust на каждое применение списка:
    // судить об этом со страницы нельзя — регистрирует не она.
    await listen('project-hotkeys', (event) => {
      applyHotkeysTaken(event.payload?.taken);
    });

    // Подписка ловит только то, что случится после неё; хоткеи вешаются в
    // Rust ещё в setup(), раньше, чем догрузилась эта страница. Тем же
    // приёмом, что и poll_now ниже, — разовый опрос забирает то, что Rust
    // успел решить до подписки.
    try {
      applyHotkeysTaken(await invoke('project_hotkeys_taken'));
    } catch (e) {
      error = String(e);
    }

    // Ответ агрегатора приезжает событием: опросом распоряжается Rust.
    await listen('state', (event) => applyState(event.payload));

    // Настройки правит другое окно, и своего ui.json пикер сам не перечитает.
    await listen('ui-changed', async () => {
      try {
        // Умолчания — из uiToggles, а не из плоской toggles: та же причина,
        // что и при первой загрузке — иначе ось statusline у нетронутых
        // человеком ключей молча обнулилась бы при следующем saveUi().
        const ui = window.UiState.normalizeUiState(await invoke('load_ui'), {
          sort: sortMode, toggles: toggleDefaults(),
        });
        sortMode = ui.sort;
        uiToggles = ui.toggles;
        toggles = window.UiState.listColumns(uiToggles);
        fullscreen = ui.fullscreen;
        collapsed = ui.collapsed;
        order = ui.order;
        hidden = ui.hidden;
        // Тот же размер, что и при первой загрузке, и так же безусловно:
        // дорога сюда гоночная (настройки перечитывают ui.json между ^F и
        // записью saveUi), и `if (fullscreen)` приводил бы ровно в то
        // состояние, ради ухода от которого чинили settings.html, — узкая
        // раскладка в широкой раме.
        invoke('set_picker_size', { fullscreen })
          .catch((err) => { error = String(err); });
      } catch (e) {
        error = String(e);
      }
      // Набор вынесенных в статуслайн галок мог измениться — разметку чекбоксов
      // надо собрать заново, а не просто проставить отметки.
      renderChecks();
      regroup();
    });

    // Хоткеи и хост опроса Rust уже переставил сам; здесь остаётся то, что
    // читает страница, — терминал, пути, действия, caps.
    await listen('config-changed', async () => {
      try {
        CONFIG = window.ConfigShape.normalizeConfig(await invoke('load_config'));
      } catch (e) {
        error = String(e);
      }
      applyStaleOpacity();
      // regroup() иконок не читает — их читает только renderMenu; список не
      // обязан ждать похода за иконками, чтобы перерисоваться.
      regroup();
      // Настроенные действия могли смениться вместе с конфигом: иконки от
      // прежних приложений остались бы висеть у новых пунктов.
      await loadActionIcons();
    });

    // Fired by Rust every time the window is shown.
    await listen('picker-shown', beginShow);

    await listen('picker-hidden', () => {
      closeMenu();
      closeInfo();
    });

    // Подписка готова — забрать то, что поток успел узнать до неё, и
    // подтолкнуть свежий опрос.
    applyState(await invoke('poll_now'));

    paintSort();
    paintToggles();
    search.focus();

    // The hotkey is live from Rust's setup(), before this webview has
    // necessarily finished loading — a press in that window shows the
    // picker without a 'picker-shown' event ever reaching a listener that
    // didn't exist yet. Cover that first-show race by checking whether the
    // window is already visible right now; if so, this is that race and the
    // palette needs to be reset here instead of waiting for an event that
    // already fired.
    const alreadyVisible = await getCurrentWindow().isVisible().catch(() => false);
    if (alreadyVisible) {
      beginShow();
    }

    // Не раньше poll_now: список важнее — иначе окно ждало бы поход за
    // иконками, а их читает только renderMenu, никак не render(). Не раньше
    // и ветки alreadyVisible — тот случай ровно про человека, который уже
    // смотрит на открытый пикер: пока идёт холодная инициализация COM и до
    // пяти вызовов SHGetFileInfoW, поле поиска остаётся расфокусированным,
    // висит прежний запрос, а галки статуслайна не перерисованы. Спека при
    // этом не нарушается — «меню открывается уже с картинками» про момент
    // первого ^K, а до него заведомо больше времени, чем занимает поход за
    // парой иконок.
    await loadActionIcons();
  }

  window.addEventListener('DOMContentLoaded', () => { start(); });
</script>
</body>
</html>
