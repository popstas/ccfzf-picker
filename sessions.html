<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>claude sessions</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; overflow: hidden; position: relative;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1e1f22; color: #e6e6e6;
            border: 1px solid #3a3d42; border-radius: 10px;
            display: flex; flex-direction: column;
        }
        #search {
            width: 100%; padding: 16px 18px; font-size: 18px;
            background: transparent; color: inherit;
            border: none; border-bottom: 1px solid #3a3d42; outline: none;
            flex: 0 0 auto;
        }
        #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 0; }
        /* Широкий режим: блоки колонками, у каждого свой скролл. Свой
           overflow у самого списка гасится — иначе скроллов два вложенных, и
           колесо работает по тому, над которым курсор, то есть непредсказуемо.

           Раскладка колонок задана человеком и держится на смысле строк:
           слева свои живые сессии, посередине чужие и под ними проекты,
           справа история и под ней снимки. Номер колонки блоку ставит
           picker-sections.js — по тому же признаку, по которому блок собран.

           Верхний уровень — flex-строка из flex-колонок, а не сетка. Сеткой
           это не делается: главному списку отдана вся высота, а это значит
           охватить все ряды, и `grid-row: 1 / -1` считает `-1` по **явной**
           сетке, которой здесь нет вовсе — ряды неявные, размеченные по
           содержимому, и охватывать нечего. Во flex-колонке полная высота
           достаётся сама собой, растяжением. */
        #list.blocks { display: flex; gap: 8px; overflow: hidden; }
        #list.blocks .block-col {
            flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden;
            display: flex; flex-direction: column; gap: 8px;
        }
        /* Первая колонка правил себе больше не просит. `flex: 1 1 auto` тут
           стоял с тех пор, когда блок в ней всегда был один: колонку задавал
           смысл секции, и своих живых сессий бывает ровно одна группа. С
           перетаскиванием в неё можно положить вторую — и `auto` (то есть
           доля по содержимому) начинал делить высоту пропорционально размеру.
           Измерено: свёрнутая история под шестьюдесятью строками живых
           получала 5 пикселей из 417 при содержимом в 25, то есть исчезала с
           экрана совсем. Одинокий блок растягивается на всю высоту и при
           `flex: 1 1 0` — растёт он от нулевой доли, а не от содержимого, —
           так что общее правило ниже покрывает и этот случай. */
        /* В колонках с двумя блоками высота делится, и делится не по
           содержимому. `flex: 0 1 auto` (то есть просто «по содержимому»)
           здесь неверен: ужимает flex пропорционально размеру, и длинный сосед
           съедает короткого — измерено, снимкам под шестьюдесятью строками
           истории оставалось десять пикселей, то есть ничего.

           Отсюда `flex: 1 1 0` — доля поровну, — а нижнему блоку колонки
           вдобавок разрешено быть по содержимому, но не выше половины:
           короткий показан целиком и без пустоты, а всё, чего он не взял,
           достаётся верхнему. Верхний в обеих колонках и есть длинный (чужие
           сессии, история), так что делить нижнему нечего.

           `max-content` тут был и оказался ловушкой: в Chromium он считается
           верно, а в WebKit — а это WKWebView, на котором пикер живёт на маке —
           блок с ним схлопывается в один заголовок, и колонка выглядит пустой.
           Ровно это человек и увидел на макбуке. Процент от высоты колонки
           считают одинаково оба движка — измерено в обоих. */
        #list.blocks .block { flex: 1 1 0; }
        /* `:not(:only-child)` — не придирка: одинокий блок в колонке упёрся бы
           в тот же потолок и занял бы половину колонки впустую. Измерено, так
           и было. */
        #list.blocks .block:last-child:not(:only-child) {
            flex: 0 1 auto; max-height: 50%;
        }
        /* Свёрнутый блок — высотой в свой заголовок, в любой колонке и на
           любом месте. Доля колонки ему не положена: показывает он одну
           строку, а занимал бы столько же, сколько развёрнутый сосед —
           измерено, 260 пикселей из 417 при содержимом в 25, и в WebKit
           347 из 504.

           Правило идёт последним и перекрывает все три выше — и долю
           (`flex: 1 1 0`), и потолок в половину колонки, и растяжение первой
           колонки. Само по себе оно опускание не делает: в низ своей колонки
           свёрнутую секцию отправляет `buildSections`, потому что по тому же
           списку считается порядок блоков, по которому ходят `←/→`. */
        #list.blocks .block.collapsed { flex: 0 0 auto; max-height: none; }
        /* Подзаголовок машины внутри блока чужих сессий: та же подпись, что и
           заголовок группы в узком списке, но мельче — заголовок блока над ней
           уже сказал, что это чужие. */
        #list.blocks .block-subhead {
            padding-top: 6px; font-size: 11px; opacity: 0.75;
        }
        /* Высоту блоку задаёт его ряд, и задаёт растяжением, а не процентом —
           процента здесь нет намеренно.

           `max-height: 100%` разрешалась бы относительно grid area, а у ряда,
           размеченного по содержимому, высота области сама от содержимого и
           зависит. Движку, который такую область считает неопределённой,
           процент положено читать как `none`: блок вырос бы под все свои
           строки, `.block-rows` стало бы нечему переполняться, `overflow-y:
           auto` полосы бы не дал, а переросший ряд молча срезался бы
           `overflow: hidden` выше. На экране это длинный блок без единой
           полосы прокрутки — ровно та раскладка, ради ухода от которой блоки и
           заведены: в одном контейнере скролл один. Chromium (а это WebView2,
           на котором пикер и живёт под Windows) процент здесь разрешает и
           рисует верно — проверено измерением, — но полагаться на это незачем,
           когда то же самое достижимо без процента вовсе.

           Отсюда устройство: высоту блоку даёт его колонка, `min-height: 0`
           разрешает ему быть короче содержимого, а строки внутри
           (`flex: 0 1 auto`) занимают высоту по содержимому и ужимаются, когда
           места меньше, — вот и своя полоса. Пустотой это не оборачивается:
           `.block` ничего не рисует, а раскладка строк совпадает с прежней до
           пикселя (сверено измерением координат каждой строки на трёх ширинах
           окна). Поэтому же снят `align-items: start`: он запрещал ровно то
           растяжение, которым теперь и держится высота. */
        #list.blocks .block {
            display: flex; flex-direction: column;
            overflow: hidden;
            /* Не ниже своего заголовка. `min-height: 0` тут стоял затем, чтобы
               блок можно было ужать ниже содержимого, — и ужимался он до
               нуля: длинный сосед по колонке съедал короткого целиком, а
               `overflow: hidden` у колонки дорисовывал исчезновение. Строка
               заголовка — это тот минимум, при котором секцию видно и по ней
               можно щёлкнуть, чтобы развернуть. */
            min-height: 2em;
        }
        #list.blocks .block-rows { overflow-y: auto; min-height: 0; flex: 0 1 auto; }
        /* Карточка — только у строки сессии (`.row.session`), не у голого
           `.row`: тот же `.text`/`.meta`/`.name`/`.dot` носят и строка
           проекта, и снимок (заголовок и его сессия), и свёрнутый блок, и
           зелийная псевдосессия (`.row.zellij`) — карточку получать им не
           положено, спека держит их строками: запроса с ответом, которые
           карточка и разворачивает, нет ни у одной из них (у зелия в
           частности — своих `agentPrompt`/`agentDescription` она не носит).
           Метаданные уходят под текст, а не вправо — в колонке 420px правая
           группа отобрала бы у имени почти всю ширину. */
        #list.blocks .row.session {
            align-items: flex-start; flex-wrap: wrap; gap: 8px;
            padding: 8px 12px; border-radius: 6px;
        }
        /* basis: 0%, а не 100% — со 100% .text просился бы на всю ширину
           строки один, не помещался бы рядом с кружком (гипотетический размер
           для переноса строки считается по basis, ещё до роста) и уезжал на
           отдельную flex-линию, а кружок с ним — оставался бы над именем, а
           не рядом с его первой строкой. При basis: 0% элемент всегда
           помещается на линию кружка, а всю оставшуюся ширину забирает уже
           ростом (flex-grow: 1). min-width: 0 — иначе длинный путь или id без
           пробелов распирал бы карточку вместо переноса. */
        #list.blocks .row.session .text { flex: 1 1 0%; min-width: 0; }
        /* Метаданные уходят на свою строку и начинаются под текстом, а не под
           кружком: без отступа значок окна висел левее имени и пути над ним, и
           глаз читал это как съехавшую строку.

           Считается отступ по видимому знаку, а не по коробке, и слагаемых три:
           кружок (9px) плюс зазор карточки (8px) — на столько отодвинут `.text`
           от левого края, — минус `padding-left: 10px` первой колонки `.meta`.
           Padding обязателен в расчёте: он есть у всех колонок (`.win`,
           `.winhost`, `.usage`, …), то есть первой колонка встаёт любая, а знак
           в ней всё равно начинается на 10px правее коробки. Выровняв коробку в
           30px, мы увели знак в 40px — ровно настолько же вправо, насколько он
           до того был смещён влево.

           Все три слагаемых берутся из соседних правил этого же файла; меняя
           любое, менять и здесь. */
        #list.blocks .row.session .meta {
            flex: 1 1 100%; margin-left: 7px; flex-wrap: wrap; gap: 10px;
        }
        /* Запрос и ответ — до трёх строк каждый, с обрезкой по последней.
           Ради этого режим и заведён: в строке от них видно первые слова, а
           узнают сессию как раз по тому, чем она занята. */
        #list.blocks .row.session .prompt,
        #list.blocks .row.session .summary {
            white-space: normal; display: -webkit-box;
            -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        /* Имя переносится: обрезка многоточием оставляла бы от длинного имени
           сессии первые пару слов, а в карточке место под него есть. */
        #list.blocks .row.session .name { white-space: normal; }
        /* Кружок стоит у первой строки имени, а не по центру карточки. */
        #list.blocks .row.session .dot { margin-top: 5px; }
        #statusline {
            height: 28px; padding: 0 18px; display: flex; align-items: center; gap: 14px;
            font-size: 11px; color: #7d838c; border-top: 1px solid #3a3d42;
            user-select: none; flex: 0 0 28px;
        }
        #sort-control {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer;
        }
        #sort-control:hover { color: #a8adb5; }
        #statusline .icon { font-size: 12px; line-height: 1; }
        /* Подсказка про Ctrl+K, между переключателем сортировки и чекбоксами.
           min-width: 0 + ellipsis — тем же приёмом, что .text у строки списка:
           при узком окне подсказка обрезается первой, а не толкает
           status-checks (у него margin-left: auto) или не ломает раскладку. */
        #menu-hint {
            flex: 1 1 auto; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .status-checks {
            display: flex; align-items: center; gap: 12px; margin-left: auto;
        }
        /* Кнопки статуслайна — общим классом, а не поимённо.
           Здесь стояла цепочка из двух правил: `margin-left: auto` у `?` и
           `#keys-button + #settings-button { margin-left: 0 }`, гасивший такой
           же отступ у шестерёнки. Селектор соседний, и третья кнопка, вставшая
           между ними, перестала бы ему соответствовать — шестерёнка снова
           отжалась бы вправо, и между ней и новой кнопкой встала бы дыра во всю
           ширину. Теперь отступ есть только у первой кнопки ряда, и вставленной
           между ними не нужно ничего: гасить второй отступ больше не приходится.
           (`:first-of-type` тут не годится — он считает по типу элемента, а не
           по классу, и первым span'ом в статуслайне идёт переключатель
           сортировки.) */
        .icon-button { cursor: pointer; padding: 0 2px; }
        /* Ряд кнопок прижимает вправо первая из них. Появится кнопка левее `?` —
           отступ переезжает на неё. */
        #keys-button { margin-left: auto; }
        /* Подсветка при наведении — у всех трёх. Раньше её не было у
           шестерёнки: ряд из одной кнопки не выглядел рядом, а в ряду из трёх
           неподсвеченная читалась бы как нерабочая. */
        .icon-button:hover { color: #a8adb5; }
        /* Включённый широкий режим: кнопка светлее ряда. Состояние показано
           цветом, а не вторым глифом, — чем меньше разных знаков, тем меньше
           шансов на квадратик-заглушку в чужом системном шрифте. */
        #wide-button.on { color: #d4d8de; }
        .status-check {
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; color: #7d838c;
        }
        .status-check:hover { color: #a8adb5; }
        /* Левая половина чекбоксов (то, что рисуется под именем сессии) отбита
           от правой (колонки справа) — к обычным 12px ещё столько же. */
        .status-check.gap { margin-left: 12px; }
        .status-check input {
            margin: 0; accent-color: #7d838c; cursor: pointer;
        }
        .group-label {
            padding: 8px 18px 4px; font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; color: #7d838c;
        }
        .row {
            display: flex; align-items: center; gap: 12px;
            padding: 7px 18px; cursor: pointer;
        }
        /* Строка под курсором мыши. Тусклее выбранной намеренно: выбор один и
           решает, что откроет Enter, а подсветка под мышью обещает только то,
           что сделает клик. Одинаковый фон у обеих превратил бы список в
           картинку с двумя одинаково выбранными строками.

           Стоит перед `.row.active`: специфичность у правил равная (два
           селектора класса против класса с псевдоклассом), и спор решает
           порядок — иначе наведение на выбранную строку гасило бы выбор. */
        .row:hover { background: #26282d; }
        .row.active { background: #31343a; }
        .row.stale { opacity: var(--stale-opacity, 0.5); }
        /* Снимает затемнение только наведение. Выбор его снимал тоже — и делал самой
           яркой строкой списка первую попавшуюся: `active` ставится на неё при каждом
           показе окна и при каждой правке запроса, то есть без участия человека.
           Наведение — наоборот, прямой жест и по одной строке. */
        .row.stale:hover { opacity: 1; }
        /* Гашение по наведённому проекту. Стоит после `.row.stale` намеренно: обе
           правки меняют opacity, и на строке с обоими классами они не складываются, а
           перекрывают друг друга по порядку в файле. Главнее здесь наведение — оно
           временное и отвечает на прямой жест человека. */
        .row.dim-other { opacity: 0.3; }
        .row.active .cwd { color: #9aa0a8; }
        /* Заголовок секции — строка списка, но читается заголовком: те же
           мелкие прописные, что и у подписи группы, которой он пришёл на
           смену. Строкой он стал затем, чтобы секцию было чем свернуть, и
           подсветку выбора с наведением поэтому сохраняет: по ней и жмут. */
        .row.section { padding: 9px 18px 5px; }
        .row.section .name {
            font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; color: #7d838c;
        }
        .dot {
            flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
            background: #6e7681;
        }
        /* Агент работает. */
        .dot.active { background: #3fb950; }
        /* Агент спрашивает — ждёт ответа человека. */
        .dot.question { background: #d29922; }
        /* Агент закончил, результат ещё не смотрели. */
        .dot.review { background: #db6d28; }
        /* Простаивает: закончил и постоял, считается проверенным. Серый здесь
           остаётся: он отличает живую сессию от закрытой, у которой кружка нет
           вовсе, — а это и есть главный вопрос к строке. Гасили и вернули. */
        .dot.idle { background: #6e7681; }
        /* Закрытая сессия — кружка нет, но место под него остаётся,
           иначе текст закрытых строк съезжает относительно живых. */
        .dot.closed { background: transparent; }
        /* Пока держат Shift, строка под курсором показывает, что с ней сделает
           клик: кружок становится пустой оранжевой рамкой — тем же оранжевым,
           каким горит непросмотренная сессия. Только у строк, которые есть чем
           пометить: обещать пометку там, где Shift+клик ничего не делает,
           хуже, чем не обещать ничего. */
        body.shift .row.markable:hover .dot {
            background: transparent;
            box-shadow: inset 0 0 0 2px #db6d28;
        }
        /* Тусклое имя — там, где строка есть, а дела до неё сейчас нет:
           закрытая сессия и сессия снимка, чьё окно уже на экране (её
           восстановление пропустит). Случая два, цвет один — правило одно. */
        .row.closed .name,
        .row.snapshot-session.on-screen .name { color: #a8adb5; }
        /* Заголовок дня. Читается заголовком, как и заголовок секции: те же
           мелкие прописные. Кружка у него нет вовсе — и места под кружок тоже:
           день стоит выше снимков, а не в одной с ними колонке. */
        .row.snapshot-day { padding: 9px 18px 5px; }
        .row.snapshot-day .name {
            font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; color: #7d838c;
        }
        .row.snapshot-day .count { color: #6f757e; }
        /* Заголовок раскладки. Не group-label: у него есть своё действие —
           Enter поднимает снимок целиком, — поэтому это строка, а не подпись.
           Отличается от строки сессии разрядкой и цветом подписи, как группа. */
        /* Снимки читаются группами, и держится это на отступах, а не на
           разделителях: сверху у заголовка снимка вдвое больше базовых 7px,
           внутри снимка у строк сессий — вдвое меньше. Так расстояние между
           снимками заметно больше, чем между сессиями одного снимка, и группу
           видно прежде, чем прочитано хоть одно имя. Базовый `.row` при этом
           не трогается: те же 7px носят все остальные строки списка. */
        .row.snapshot { padding-top: 14px; }
        .row.snapshot-session { padding-top: 3px; padding-bottom: 3px; }
        .row.snapshot .name {
            font-size: 11px; letter-spacing: .06em; color: #9aa0a8;
        }
        /* У заголовка снимка кружка нет: состояния у раскладки не бывает, и
           серая точка там ничего не значила — в отличие от строк сессий под
           ним, где серый значит «не открыта». Место остаётся: колонка общая со
           строками сессий, и выброшенный элемент сдвинул бы их текст. */
        .row.snapshot .dot { background: transparent; }
        .text { min-width: 0; }
        .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cwd { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Чем сессия закончила / что спросили. Тусклее пути: это подсказка, а
           не опознание — строку ищут глазами по названию и каталогу. */
        .summary { font-size: 11px; color: #6f757e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prompt { font-size: 11px; color: #868c95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Метка PR — той же тусклостью, что и колонка хоткея: опознают строку
           по имени и пути, это подсказка рядом. */
        .name .pr { margin-left: 6px; font-size: 11px; color: #7d838c; font-weight: normal; }
        /* Правые колонки одной группой: статус, id, контекст с деньгами,
           возраст. Прижимает их сюда именно она — раньше это делала `.state`
           своим margin-left: auto, и выключенный чекбокс события уносил
           остальные колонки к названию сессии. Теперь любая колонка может
           пропасть, а группа останется справа. */
        .meta {
            flex: 0 0 auto; margin-left: auto;
            display: flex; align-items: center; gap: 12px;
        }
        /* Текстовый статус агента. */
        .state {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Короткий id сессии — тем же, чем `claude --resume` и имя транскрипта.
           Моноширинные цифры, как у контекста и возраста: колонка из четырёх
           знаков не должна дышать от строки к строке. */
        .sid {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* Хоткей проекта (`^F12`). Раньше стоял подписью внутри имени сессии,
           теперь колонка — см. hotkeyHtml в session-glyph.js. */
        .hk {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Клавиша, которую забрал сосед по системе: видна, но погашена — по
           ней узнают, какая именно комбинация не сработала, а не только то,
           что что-то не сработало. */
        .hk.taken { opacity: .45; text-decoration: line-through; }
        /* Пометка «окно терминала уже открыто». Ширина задана жёстко: у сессий
           без окна элемент пустой, и без ширины колонка дышала бы от строки к
           строке. Цвет как у живого статуса — это признак того же рода: сессия,
           до которой можно дотянуться прямо сейчас. */
        .win {
            flex: 0 0 auto; width: 10px; padding-left: 10px;
            font-size: 11px; color: #3fb950; text-align: center;
        }
        /* Машина чужого окна. Ширины не задано намеренно, в отличие от `.win`:
           там элемент либо пуст, либо в один знак, а имена машин разной длины,
           и жёсткая ширина резала бы их. Пустой элемент при этом схлопывается
           и строк не сдвигает. */
        .winhost {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
        }
        /* Контекст и деньги, между статусом и возрастом. */
        .usage {
            flex: 0 0 auto; padding-left: 10px;
            font-size: 11px; color: #7d838c; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* Заполненность контекста. Жёлтый — тот же, что у спрашивающего агента:
           «обрати внимание». Красный — «скоро начнёт забывать начало». */
        .usage .ctx.warn { color: #d29922; }
        .usage .ctx.hot { color: #f85149; }
        .usage .cost { color: #6f757e; }
        /* Возраст последней активности, крайняя правая колонка. */
        .age {
            flex: 0 0 auto; padding-left: 10px; min-width: 34px; text-align: right;
            font-size: 11px; color: #7d838c; font-variant-numeric: tabular-nums;
        }
        /* Сколько у проекта сессий и сколько из них живых. Рядом с возрастом,
           поэтому цифры моноширинные — колонки не должны разъезжаться. */
        .count {
            flex: 0 0 auto; padding-left: 10px; min-width: 48px; text-align: right;
            font-size: 11px; color: #7d838c; font-variant-numeric: tabular-nums;
            /* nowrap, как у соседних колонок: `123 · 45●` шире min-width, а `●`
               под tabular-nums не попадает — на WebView2 метрики этого знака
               наименее предсказуемы, и без запрета строка переносилась бы. */
            white-space: nowrap;
        }
        /* Отметка проекта в ccfzf (★ в его собственном списке). */
        .mark { color: #d29922; }
        #message { padding: 24px 18px; color: #868c95; font-size: 13px; flex: 0 0 auto; }
        /* Ctrl+K actions overlay — sits above the session list, same palette. */
        #actions-backdrop {
            display: none; position: absolute; inset: 0; z-index: 10;
            background: rgba(0, 0, 0, .45);
            align-items: center; justify-content: center; padding: 24px;
        }
        #actions-backdrop.open { display: flex; }
        #actions-menu {
            width: min(360px, 100%); background: #25262a;
            border: 1px solid #3a3d42; border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45); overflow: hidden;
        }
        #actions-title {
            padding: 12px 16px 8px; font-size: 11px; color: #7d838c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #3a3d42;
        }
        #actions-list { padding: 6px 0; }
        /* flex, а не блок: подпись клавиши прижимается вправо тем же приёмом,
           что и колонка статуса в строке списка (margin-left: auto), а не
           текстом внутри одной строки — иначе делить их пришлось бы вручную. */
        .action-row {
            display: flex; align-items: center;
            padding: 10px 16px; font-size: 13px; cursor: pointer;
        }
        /* Наведение и выбор — те же два фона и в том же порядке, что у строки
           списка (см. `.row:hover`): меню открывается поверх него, и второй
           набор цветов читался бы как другое окно. Порядок решает так же —
           специфичность у правил равная. */
        .action-row:hover { background: #26282d; }
        .action-row.active { background: #31343a; }
        /* Слот значка. Ширина фиксированная и одинаковая у всех строк, включая
           глифовые: без неё подпись на строке без иконки съезжает влево, и
           меню читается как два списка в одном окне.

           16 px при иконке 32×32 из WinAPI — ровно вдвое; на масштабе 150%,
           который стоит на машине, это 24 устройственных точки, то есть
           картинку ужимают, а не растягивают. */
        .action-icon {
            flex: 0 0 16px; width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 10px; font-size: 12px; color: #7d838c;
        }
        .action-icon img { width: 16px; height: 16px; }
        /* Тем же оранжевым горит непросмотренная сессия в списке. */
        .action-icon.unread { color: #db6d28; }
        .action-label {
            flex: 1 1 auto; min-width: 0; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        /* Прямая клавиша действия, тусклым — тем же цветом, что и колонка .hk. */
        .action-hotkey {
            flex: 0 0 auto; margin-left: auto; padding-left: 12px;
            font-size: 11px; color: #7d838c;
        }
        #actions-empty {
            display: none; padding: 16px; font-size: 13px; color: #868c95;
        }
        /* Session info — тот же модал, что и меню действий: разные только
           содержимое и ширина. Справочник клавиш берёт то же оформление, а не
           заводит своё: обе модалки — статичный список «слева ключ, справа
           значение», и вторая копия этих правил разъехалась бы с первой на
           первой же правке цвета. С `#actions-menu` роднить их незачем — та
           про действия над строкой, у неё выбор стрелками и запуск. */
        #info-backdrop, #keys-backdrop {
            display: none; position: absolute; inset: 0; z-index: 10;
            background: rgba(0, 0, 0, .45);
            align-items: center; justify-content: center; padding: 24px;
        }
        #info-backdrop.open, #keys-backdrop.open { display: flex; }
        #info-card, #keys-card {
            width: min(560px, 100%); max-height: 100%; overflow-y: auto;
            background: #25262a; border: 1px solid #3a3d42; border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
        }
        #info-title, #keys-title {
            padding: 12px 16px 8px; font-size: 11px; color: #7d838c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #3a3d42;
        }
        /* У справочника клавиш заголовок и подпись разнесены: строка выше —
           имя и версия приложения, эта — прежний текст «Keyboard shortcuts».
           Граница переезжает на подпись, #info-title её не теряет. */
        #keys-title { border-bottom: none; padding-bottom: 2px; }
        #keys-subtitle {
            padding: 0 16px 8px; font-size: 11px; color: #7d838c;
            border-bottom: 1px solid #3a3d42;
        }
        #info-rows, #keys-rows { padding: 8px 0; }
        /* Подвал: версия — не только в заголовке, лицензия и ссылка на
           репозиторий. Та же серая палитра карточки, граница сверху отделяет
           его от списка клавиш. */
        #keys-footer {
            padding: 8px 16px 12px; font-size: 11px; color: #7d838c;
            border-top: 1px solid #3a3d42;
        }
        #keys-footer a { color: #6aa9ff; }
        .info-row { display: flex; gap: 12px; padding: 3px 16px; font-size: 12px; }
        .info-row .k { flex: 0 0 96px; color: #7d838c; }
        .info-row .v { min-width: 0; word-break: break-word; }
        /* Заголовок секции справочника. Не `.info-row`: у него нет пары
           «ключ — значение», это подпись над группой строк. */
        .keys-section {
            padding: 10px 16px 4px; font-size: 11px; color: #7d838c;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .keys-section:first-child { padding-top: 4px; }
        /* Клавиша слева — моноширинным: комбинации читаются столбиком, и
           пропорциональный шрифт ставил бы `^K` и `⌘⇧C` разной ширины. */
        #keys-rows .info-row .k {
            flex: 0 0 132px; color: #c8ccd2;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        /* Не вставшая клавиша: показана, но зачёркнута. Убрать её нельзя —
           тогда «не настроено» и «отобрал сосед по системе» выглядят
           одинаково, а это расследование однажды заняло полдня. */
        #keys-rows .info-row.taken .k { text-decoration: line-through; color: #7d838c; }
        #keys-rows .info-row.taken .v { color: #868c95; }
        /* Перетаскивание заголовка секции.
           `touch-action: none` обязателен: без него движение пальцем или по
           тачпаду уходит в прокрутку списка, и pointermove до нас не
           доезжает вовсе. */
        .row.section { touch-action: none; }
        .row.section.dragging { opacity: .45; }
        /* Куда встанет секция. Рисуется поверх списка отдельным узлом, а не
           перестановкой строк: перестановка на каждое движение мыши — это
           пересборка каркаса блоков, то самое, что обязано случиться после
           отпускания, а не во время. */
        #drop-line {
            position: absolute; z-index: 20; height: 2px;
            background: #6aa9ff; border-radius: 2px;
            pointer-events: none; display: none;
        }
        #drop-line.on { display: block; }
        /* Пустая колонка на время перетаскивания. Обычно она не рисуется
           вовсе — забрала бы у соседей долю ширины ради пустоты, — но тогда
           секцию, ушедшую из колонки последней, вернуть было бы некуда:
           колонки нет в DOM, и указателю не во что попасть. Появляется она
           только под перетаскиванием и узкой, чтобы раскладка не прыгала. */
        /* Селектор с `#list`, а не голый `.block-col.drop-zone`: базовое
           правило колонки прижато идентификатором (`#list.blocks .block-col`)
           и по весу выигрывает у двух классов. Без этого пустая колонка
           забирала бы свою треть ширины, ради ухода от чего она и временная. */
        #list.blocks .block-col.drop-zone {
            flex: 0 0 96px; border: 1px dashed #3a3d42; border-radius: 8px;
        }
    </style>
</head>
<body>
<input id="search" type="text" placeholder="Search claude sessions…" autocomplete="off" spellcheck="false">
<div id="list"></div>
<div id="message">Loading…</div>
<div id="statusline">
  <span id="sort-control" title="Click to change sort"><span class="icon">⇅</span><span id="sort-label">cost</span></span>
  <!-- Пусто: текст ставит paintToggles. Полный список клавиш живёт в модалке
       по `?`/F1 — здесь остаётся только вход в меню строки. -->
  <span id="menu-hint"></span>
  <!-- Наполняется из TOGGLE_CHECKS: разметка и обработчики не должны
       расходиться в именах ключей. -->
  <span class="status-checks" id="status-checks"></span>
  <!-- Три кнопки одним рядом, прижатым вправо. Прижимает первая из них
       (`.icon-button:first-of-type`), а не названная поимённо: правило,
       написанное на конкретный id, пришлось бы переписывать при каждой новой
       кнопке — и один раз это уже чуть не стоило дыры во всю ширину. -->
  <span id="keys-button" class="icon-button" title="Keyboard shortcuts (F1 or Ctrl+?)"><span class="icon">?</span></span>
  <!-- Подпись и подсветку ставит paintToggles: режим переключается ещё и из
       окна настроек (событие `ui-changed`), и покрась мы кнопку по клику, она
       врала бы после чужой правки. -->
  <span id="wide-button" class="icon-button"><span class="icon">⛶</span></span>
  <!-- Справа и последним: это не часть ряда галок, а выход в другое окно. -->
  <span id="settings-button" class="icon-button" title="Settings (Ctrl+,)"><span class="icon">⚙</span></span>
</div>
<div id="actions-backdrop" aria-hidden="true">
  <div id="actions-menu" role="menu">
    <div id="actions-title"></div>
    <div id="actions-list"></div>
    <div id="actions-empty">No open actions for this session.</div>
  </div>
</div>
<div id="info-backdrop" aria-hidden="true">
  <div id="info-card" role="dialog">
    <div id="info-title"></div>
    <div id="info-rows"></div>
  </div>
</div>
<div id="drop-line"></div>
<div id="keys-backdrop" aria-hidden="true">
  <div id="keys-card" role="dialog">
    <!-- Версию дописывает страница после загрузки (invoke('app_version')):
         зашитая сюда строка разошлась бы с Cargo.toml на первом же релизе, и
         разошедшееся никто бы не заметил. -->
    <div id="keys-title">ccfzf-picker</div>
    <div id="keys-subtitle">Keyboard shortcuts</div>
    <div id="keys-rows"></div>
    <!-- Вне #keys-rows: openKeys() переписывает keysRows.innerHTML целиком
         при каждом открытии, и подвал внутри него пришлось бы дорисовывать
         заново на каждый F1. -->
    <div id="keys-footer">MIT License &middot; <a href="https://github.com/popstas/ccfzf-picker" target="_blank" rel="noopener">github.com/popstas/ccfzf-picker</a></div>
  </div>
</div>
<script src="state-shape.js"></script>
<script src="session-agent.js"></script>
<!-- session-windows до session-list: тот берёт оттуда windowOf в момент
     загрузки, чтобы приписать строке машину её окна. -->
<script src="session-windows.js"></script>
<script src="session-list.js"></script>
<script src="zellij-list.js"></script>
<script src="open-transport.js"></script>
<script src="session-groups.js"></script>
<!-- ui-state после session-groups: он берёт оттуда normalizeSort в момент
     загрузки, и в обратном порядке ему достался бы undefined. -->
<script src="ui-state.js"></script>
<script src="session-glyph.js"></script>
<script src="session-info.js"></script>
<!-- session-name до open-strategy: тот берёт из него uniqueSessionName в
     момент загрузки, и в обратном порядке ему достался бы undefined. -->
<script src="session-name.js"></script>
<!-- open-strategy до session-actions: тот берёт из него buildAttachCommand в
     момент загрузки, и в обратном порядке ему достался бы undefined. Тесты
     этого не поймают — там require, а он от порядка тегов не зависит. -->
<script src="open-strategy.js"></script>
<!-- path-map до session-actions, action-hotkey до config-shape: оба берут
     соседа из globalThis в момент загрузки, и в обратном порядке им достался бы
     undefined. Тесты этого не поймают — там require, а он от порядка тегов не
     зависит; ловит порядок test/frontend-load.test.js. -->
<script src="path-map.js"></script>
<script src="action-hotkey.js"></script>
<!-- key-reference после action-hotkey: он берёт оттуда таблицу клавиш в
     момент загрузки, и в обратном порядке ему достался бы undefined. -->
<script src="key-reference.js"></script>
<script src="session-actions.js"></script>
<script src="config-shape.js"></script>
<script src="stale-items.js"></script>

<script src="picker-snapshots.js"></script>
<script src="picker-mode.js"></script>
<script src="project-list.js"></script>
<script src="picker-list-sync.js"></script>
<script src="picker-sections.js"></script>
<script src="action-icons.js"></script>
<script>
  let groups = [];
  let rows = [];
  let active = 0;
  // Сброс выбора просит render() поставить его на первую строку, которая не
  // заголовок секции. Заголовок — обычная строка списка, и первой строкой он
  // бывает всегда: Enter сразу после открытия окна свернул бы верхнюю секцию
  // вместо того, чтобы открыть верхнюю сессию. Снимает выбор с заголовка
  // только сброс — наведённый стрелками или кликом остаётся где стоит, иначе
  // свернуть первую секцию с клавиатуры было бы нечем.
  let selectionReset = true;
  // Панель, в которой стояла выбранная строка. Помнится ключом секции и
  // переживает пересборку списка: по нему сброс выбора возвращается туда,
  // где человек стоял, а не в первую колонку.
  let activePanel = '';
  // Каталог проекта, на который наведена мышь. Пусто — не гасим ничего.
  let hoverProjectCwd = '';
  // Строки-переключатели: Enter на них ничего не открывает, а сворачивает. Их
  // сброс выбора и пропускает. Список, а не одна проверка на `section`:

  let CONFIG = window.ConfigShape.normalizeConfig(null);

  let helperCache = null;

  //

  // поэтому: перепутать «спрятать колонку» с «спрятать сессии» стоит дороже

  const TOGGLE_CHECKS = [

    { key: 'showPaths', label: 'project', side: 'left' },
    { key: 'showHotkey', label: 'hotkeys', side: 'right' },
    { key: 'showEvent', label: 'events', side: 'right' },
    { key: 'showId', label: 'id', side: 'right' },
    { key: 'showCost', label: 'cost', side: 'right' },
    { key: 'showContext', label: 'context', side: 'right' },
    { key: 'showWindow', label: 'window', side: 'right' },
    { key: 'showWindowHost', label: 'window host', side: 'right' },
    { key: 'onlyWindow', label: 'only windowed', side: 'filter' },
    { key: 'showAll', label: 'show all', side: 'filter' },
    // Четвёртая группа, `dim`, — и не колонка, и не фильтр. Состав списка
    // затемнение не меняет (класс вешает отрисовщик строки), поэтому
    // обработчику хватает render(); попади ключ в FILTER_KEYS, каждое
    // нажатие пересобирало бы группы впустую.
    { key: 'dimStale', label: 'dim stale', side: 'dim' },
    // `glyph` — не колонка со своим текстом и не фильтр: включённая ось list
    // подменяет глиф окна иконкой терминала (Task 11), а статуслайну эта
    // галка не сдаётся вовсе — подмена живёт только в колонке окна, второй
    // строки внизу списка ей не положено.
    { key: 'showTerminalIcon', label: 'terminal icon', side: 'glyph' },
  ];

  // фильтр молча стал бы колонкой, то есть галкой, которая не отбирает строки.
  const FILTER_KEYS = new Set(TOGGLE_CHECKS.filter(c => c.side === 'filter').map(c => c.key));
  // Умолчания. Ось `list` — как было: выключены те колонки, что отвечают на
  // вопрос «как эта сессия дошла до жизни такой», а не «стоит ли в неё
  // заходить». Ось `statusline` решает, попадёт ли галка в строку внизу; там
  // место кончилось, и по умолчанию вынесены только пять самых частых.
  // Остальные правятся в окне настроек.
  //
  // Это достоверное состояние — то, что уходит в `save_ui` и приходит из
  // `load_ui`.
  let uiToggles = {
    showPrompt: { list: true, statusline: true },
    showAnswer: { list: true, statusline: true },
    showPaths: { list: true, statusline: true },
    showHotkey: { list: true, statusline: false },
    showEvent: { list: false, statusline: false },
    showId: { list: false, statusline: true },
    showCost: { list: false, statusline: false },
    showContext: { list: true, statusline: true },
    showWindow: { list: true, statusline: false },
    // Включена, хотя у одного трекера пустует всегда: имя машины появляется
    // ровно тогда, когда оно нужно, — у окна, стоящего не здесь. Выключенной
    // её бы никто и не нашёл, а лишней ширины она не занимает.
    showWindowHost: { list: true, statusline: false },
    // Выключен: список без трекера и так весь без окон, и включённый фильтр
    // показал бы пустоту вместо сессий — с виду неотличимо от сломанного ssh.
    onlyWindow: { list: false, statusline: false },
    // Выключен, но вынесен в статуслайн. Ось `list` у фильтра значит
    // «включён», и выключенный showAll оставляет решение за `onlyLive` из
    // config.yaml: галка — это отступление от настройки, а не вторая
    // настройка. Отступление запоминается в ui.json, как и все остальные.
    showAll: { list: false, statusline: true },
    // Умолчание подставляется при загрузке ui.json (toggleDefaults): здесь
    // CONFIG ещё пустой — load_config идёт позже, — и значение застыло бы на
    // встроенном. `true` тут только затем, чтобы ключ существовал.
    dimStale: { list: true, statusline: true },
    // Выключена по обеим осям: без неё в колонке окна остаётся нынешний
    // глиф, а не пресет пикера — у соседних строк терминалы разные, общий
    // пресет врал бы. Ось statusline тут не читается вовсе (см. renderChecks).

  };

  // литералами рядом — эти две записи могли разъехаться, и меню обещало бы

  const search = document.getElementById('search');

  const sortLabel = document.getElementById('sort-label');
  const statusChecks = document.getElementById('status-checks');
  const settingsButton = document.getElementById('settings-button');

  const {
    statusDotHtml, ageHtml, stateHtml, sessionIdHtml, sessionName, hotkeyHtml, usageHtml,

  // Чекбоксы статуслайна и их обработчики — из одной таблицы. Клик по самому

  //
  // Строится функцией, а не один раз при загрузке: набор вынесенных галок
  // меняется из окна настроек, и разметка обязана перестраиваться на месте —
  // иначе новая галка появлялась бы только после перезапуска.
  const toggleInputs = new Map();

  function renderChecks() {
    toggleInputs.clear();
    // `glyph` — не пропускается сюда даже с включённой осью statusline: этой
    // строке не положена своя галка внизу списка (см. комментарий у
    // showTerminalIcon в TOGGLE_CHECKS), а не полагаться на то, что ось
    // всегда false, надёжнее — окно настроек её всё равно предлагает.
    const shown = TOGGLE_CHECKS.filter(({ key, side }) => side !== 'glyph' && (uiToggles[key] || {}).statusline);
    // Отбивка между группами — на первом чекбоксе каждой следующей: отдельный
    // пустой элемент-разделитель пришлось бы ещё и прятать, когда группа пуста.
    statusChecks.innerHTML = shown.map(({ key, label, side }, i) => {
      const gap = i > 0 && shown[i - 1].side !== side ? ' gap' : '';
      return `<label class="status-check${gap}"><input type="checkbox" data-toggle="${key}"> ${escapeHtml(label)}</label>`;
    }).join('');
    for (const input of statusChecks.querySelectorAll('input[data-toggle]')) {
      const key = input.dataset.toggle;
      toggleInputs.set(key, input);
      input.addEventListener('click', (e) => {
        e.stopPropagation();
      });
      const isFilter = FILTER_KEYS.has(key);
      input.addEventListener('change', () => {
        // Галка в статуслайне правит ось list: она и значит «показывать
        // колонку». Второй осью распоряжается только окно настроек.
        uiToggles[key] = { ...uiToggles[key], list: input.checked };
        toggles = window.UiState.listColumns(uiToggles);
        // Фильтр решает состав списка, а состав считает regroup — render
        // рисует уже отобранное. С одним только render галка сработала бы
        // лишь к следующему ответу агрегатора, а тот может не прийти вовсе:
        // на скрытом окне такт уходит в минуты, а неизменившееся состояние
        // отсекается по отпечатку. Выглядело бы это мёртвым чекбоксом.
        if (isFilter) regroup();
        else render();
        saveUi();
      });
    }
  }

  renderChecks();

  // сортировки, и открытие настроек заодно крутило бы её.
  settingsButton.addEventListener('click', (e) => {
    e.stopPropagation();
    invoke('open_settings').catch((err) => { error = String(err); render(); });
  });

  // Та же остановка всплытия и по той же причине, что у шестерёнки: клик по
  // статуслайну крутит сортировку, и переключение раскладки заодно меняло бы
  // её. Работу делает общая с `^F` toggleFullscreen.
  wideButton.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFullscreen();
  });

  function paintToggles() {
    for (const [key, input] of toggleInputs) input.checked = !!toggles[key];
    // Подпись называет то, что кнопка сделает, а не то, что показано сейчас:
    // так читается всякая кнопка, а состояние видно подсветкой рядом.
    wideButton.title = fullscreen ? 'Narrow view (Ctrl+F)' : 'Wide view (Ctrl+F)';
    wideButton.classList.toggle('on', fullscreen);
    // Одна строка на всё окно места не имеет: клавиш стало столько, что
    // подсказка занимала весь статуслайн и всё равно недоговаривала —
    // встроенных действий, настроенных человеком и глобальных в ней не было
    // вовсе. Полный список уехал в модалку по `?`/F1, где условность каждой
    // клавиши доживает до строки; здесь остаётся вход в меню строки.
    menuHint.textContent = '^K / right click - Session menu';
  }

  /**
   * Запомнить вид списка.
   *
   * Молча и без ожидания: сортировку крутят подряд по нескольку раз, и ни
   * задержка на запись, ни подпись об удаче тут не нужны. Отказ уходит в ту же
   * строку ошибки, что и остальное, — не показать её было бы хуже: человек
   * решил бы, что вид запомнен, и удивился бы после перезапуска.
   */
  function saveUi() {
    // uiToggles, не toggles: тот плоский и не помнит ось statusline — запись
    // плоской картой обнулила бы её при первом же save_ui, включая тот, что
    // зовётся сменой сортировки (ниже, не только из чекбокса).
    invoke('save_ui', { ui: window.UiState.uiStateToSave(sortMode, uiToggles, fullscreen, collapsed, order, hidden) })
      .catch((e) => { error = String(e); render(); });
  }

  // Что сейчас нарисовано: ключи в порядке DOM и разметка каждого элемента.
  // Решение, что из этого менять, считает planListSync (picker-list-sync.js);
  // здесь остаётся только запись в DOM.
  let rendered = { keys: [], html: [] };

  /**
   * Записать в DOM решение planListSync.
   *
   * Одна на обе раскладки: узкий список пишет в `#list`, широкий — в
   * `.block-rows` каждого блока, а сама запись у них слово в слово одна и та
   * же. Вторая её копия разошлась бы с первой молча — правку заметили бы
   * только в той раскладке, где её сделали.
   */
  function applyPlan(container, plan) {
    if (plan.mode === 'rebuild') {
      container.innerHTML = plan.html.join('');
      return;
    }
    // Снимок детей до правок: outerHTML заменяет элемент, а живая коллекция
    // container.children отдала бы уже новый узел на следующей итерации.
    const nodes = Array.from(container.children);
    for (const update of plan.updates) nodes[update.index].outerHTML = update.html;
  }

  function syncList(items) {
    const plan = window.PickerListSync.planListSync(rendered, items, list.children.length);
    applyPlan(list, plan);
    rendered = { keys: plan.keys, html: plan.html };
  }

  // Строка списка — одна функция на вид строки. Обход у узкого и широкого
  // режимов разный, а разметка одна: вторая копия разошлась бы с первой на
  // первой же правке колонок.
  //
  // У проектов ни групп, ни сортировки: порядок задаёт агрегатор (свежие
  // сверху), а переключатель sort — про сессии. Правые колонки (usage, window,
  // id) пусты не по недосмотру: у каталога нет ни записи агента, ни окна.
  function projectItem(project, nowSec) {
    const stale = window.StaleItems.staleClass(project, nowSec, staleSettings(), 'project');
    const index = rows.length;
    rows.push(project);
    // Зелёная точка у проекта, где кто-то работает прямо сейчас: тот же
    // словарь цветов, что и у сессии, и та же ширина левой колонки.
    //
    // Состояний три, и третье — не придирка. Серый кружок значит «сессии
    // были, сейчас никто не работает»; у закладки, в которой не работали
    // **никогда**, он обещал историю, которой нет. Такой строке достаётся
    // `closed` — прозрачная точка, оставляющая место пустым. Прежний
    // комментарий здесь возражал против `closed` у проекта, и возражение было
    // верно для своего случая: оно про «сейчас никого», а не про «не было
    // никого».
    const dotClass = project.liveCount
      ? 'dot active'
      : (project.sessionCount ? 'dot' : 'dot closed');
    // Подсказка — через тот же titleAttr, что у сессий, и по-прежнему
    // полный путь: она про то, чего в теле строки не видно. Тело же теперь
    // показывает не путь, а basename — и не показывает вовсе, когда его уже
    // сказало имя проекта (projectLine, Task 11).
    const cwdLine = toggles.showPaths ? projectLine(project.label, project.cwd) : '';
    const html = `<div class="row project${stale}" data-index="${index}"${titleAttr(project)}>` +
      `<div class="${dotClass}"></div>` +
      `<div class="text"><div class="name">` +
      (project.mark ? '<span class="mark">★</span> ' : '') +
      `${escapeHtml(project.label)}</div>` +
      (cwdLine ? `<div class="cwd">${escapeHtml(cwdLine)}</div>` : '') +
      `</div>` +
      `<div class="meta">` +
      `<div class="count">${project.sessionCount}` +
      (project.liveCount ? ` · ${project.liveCount}●` : '') +
      `</div>` +
      // Колонка `hk` у проекта — та же самая колонка, что и у сессии, и
      // рисует её та же hotkeyHtml: второй способ рисовать то же самое
      // разошёлся бы с первым на первой же правке (ровно то, что уже
      // произошло — задачи 4 и 7 доводили hotkey/hotkeyTaken до строки
      // проекта, а на экран это не попадало, потому что здесь функция не
      // звалась вовсе). Порядок — как у строки сессии: hotkeyHtml перед
      // ageHtml.
      hotkeyHtml(project, toggles.showHotkey) +
      ageHtml(project, nowSec) +
      `</div></div>`;
    return { key: `p:${project.id}`, html };
  }

  // `nowSec` в сигнатуре — ради единообразия с соседями: строки снимков
  // возраста не показывают, и считать его здесь не из чего.
  function snapshotItem(row, nowSec) {
    // Заголовок дня — до всего остального: строкой он бывает не всегда.
    //
    // Под запросом свёрнутость назначена сверху (все дни развёрнуты), и Enter
    // на переключателе молчал бы: записанное тут же затиралось бы обратно.
    // Молчащий переключатель хуже отсутствующего, поэтому там заголовок — не
    // строка, а подпись: ни `data-index`, ни класса `row`, и в `rows` он не
    // попадает вовсе. Тот же приём и та же причина, что у заголовка секции.
    if (row.kind === 'snapshot-day') {
      if (!row.foldable) {
        return {
          key: row.key,
          html: `<div class="group-label">${escapeHtml(`${row.label} - ${row.meta}`)}</div>`,
        };
      }
      const at = rows.length;
      rows.push(row);
      const mark = row.collapsed ? '▸' : '▾';
      return {
        key: row.key,
        html: `<div class="row snapshot-day" data-index="${at}">` +
          `<div class="text"><div class="name">${escapeHtml(`${mark} ${row.label}`)}</div></div>` +
          `<div class="meta"><div class="count">${escapeHtml(row.meta)}</div>` +
          `</div></div>`,
      };
    }
    const index = rows.length;
    rows.push(row);
    if (row.kind === 'snapshot') {
      const missing = row.missing
        ? `${row.missing} not open`
        : 'all on screen';
      return {
        key: row.key,
        html: `<div class="row snapshot" data-index="${index}">` +
          `<div class="dot"></div>` +
          `<div class="text"><div class="name">${escapeHtml(row.label)}</div></div>` +
          `<div class="meta"><div class="count">${row.total} · ${escapeHtml(missing)}</div>` +
          `</div></div>`,
      };
    }
    // Открытая сессия — тусклая: восстановление её всё равно пропустит, а
    // Enter на ней поднимет уже существующее окно. Класс `on-screen`, а не
    // `closed`: в этом файле `closed` значит «сессии больше нет», а здесь
    // всё наоборот — окно есть, и именно поэтому строка тусклая.
    const snapCwdLine = toggles.showPaths ? projectLine(row.label, row.cwd) : '';
    return {
      key: row.key,
      html: `<div class="row snapshot-session${row.open ? ' on-screen' : ''}" data-index="${index}"` +
        ` title="${escapeHtml(row.cwd)}">` +
        `<div class="dot${row.open ? ' active' : ''}"></div>` +
        `<div class="text"><div class="name">${escapeHtml(row.label)}</div>` +
        (snapCwdLine ? `<div class="cwd">${escapeHtml(snapCwdLine)}</div>` : '') +
        `</div>` +
        `<div class="meta"><div class="count">${row.open ? '▣ open' : ''}</div>` +
        `</div></div>`,
    };
  }

  // Строки снимков считаются здесь, а не в рисовальщике: их спрашивает сборка
  // секций, и второй расчёт разошёлся бы с первым на первой же правке отбора.
  // Заголовок раскладки едет в них вместе с её сессиями и в `rows` попадает
  // наравне со строками: у него есть своё действие — Enter поднимает раскладку
  // целиком, — поэтому у него класс `row`, а не `group-label`.
  function snapshotItemsFor(query) {
    const open = window.PickerSnapshots.openIdsFromState(lastState);
    return window.PickerSnapshots.buildSnapshotRows(snapshotRows, open, query, collapsedDays);
  }

  function sessionItem(session, nowSec) {
    const index = rows.length;
    rows.push(session);
    // Подсказка про Shift+клик — ровно у тех строк, которые Shift+клик и
    // пометит: спрашиваем ту же markToggleId, что и сам клик. Раньше здесь
    // стоял agentState, и обещание расходилось с делом на сессиях, которых
    // человек ещё не открывал.
    const markable = markToggleId(session) !== null;
    // Маркер вида строки — как `project`/`snapshot`/`snapshot-session`/
    // `block-toggle` у соседей: карточка в широком режиме бьёт только по
    // `.session`, иначе те же голые `.text`/`.meta`/`.name`/`.dot` внутри
    // `#list.blocks` ловили бы и строку проекта, и снимок, и свёрнутый блок.
    // Зелийная псевдосессия (session-groups.js кладёт её в тот же массив,
    // что и настоящие сессии, и рисует тем же sessionItem) карточкой тоже не
    // должна становиться: запроса с ответом у неё нет (agentPrompt и
    // agentDescription она не носит), карточка вышла бы пустой и всё равно
    // выросла бы на строку — поэтому её вид назван своим классом `zellij`, а
    // не `session`.
    const rowKind = session.kind === 'zellij' ? 'zellij' : 'session';
    const stale = window.StaleItems.staleClass(session, nowSec, staleSettings(), rowKind);
    // Basename каталога, а не сокращённый путь — и вовсе без строки, когда
    // имя сессии уже назвало тот же проект (projectLine, Task 11). Полный
    // путь остаётся в titleAttr ниже, через shortPath — подсказка не меняется.
    const sessionCwdLine = toggles.showPaths ? projectLine(session.label, session.cwd) : '';
    const html = `<div class="row ${rowKind}${session.live ? '' : ' closed'}${markable ? ' markable' : ''}${stale}" data-index="${index}"${titleAttr(session)}>` +
      statusDotHtml(session) +
      `<div class="text"><div class="name">${escapeHtml(session.label)}` +
      `${prBadgeHtml(session)}` +
      `</div>` +
      (sessionCwdLine ? `<div class="cwd">${escapeHtml(sessionCwdLine)}</div>` : '') +
      // Две строки под карточкой: что спросили и чем ответили. Пустой div
      // всё равно занял бы высоту, поэтому рисуем только то, что есть.
      // Склейку «сводка, а у работающей — предыдущая» считает
      // sessionDescription (session-agent.js) на сборке строки.
      (toggles.showPrompt && session.agentPrompt
        ? `<div class="prompt">${escapeHtml(session.agentPrompt)}</div>` : '') +
      (toggles.showAnswer && session.agentDescription
        ? `<div class="summary">${escapeHtml(session.agentDescription)}</div>` : '') +
      `</div>` +
      // Правые колонки — одной группой: она и прижимает их вправо. Порознь
      // это делала `.state` своим margin-left: auto, и стоило снять с неё
      // чекбокс, как всё съезжало к названию сессии.
      `<div class="meta">` +
      windowHtml(session, toggles.showWindow, toggles.showTerminalIcon) +
      windowHostHtml(session, toggles.showWindowHost) +
      stateHtml(session, toggles.showEvent) +
      sessionIdHtml(session, toggles.showId) +
      hotkeyHtml(session, toggles.showHotkey) +
      usageHtml(session, toggles) +
      ageHtml(session, nowSec) +
      `</div></div>`;
    return { key: `s:${session.id}`, html };
  }

  /**
   * Заголовок секции — обычная строка списка.
   *
   * Строкой, а не подписью: свернуть секцию иначе нечем. Раньше здесь была
   * отдельная строка-переключатель, показывавшаяся только у уже свёрнутой
   * секции, — развернуть можно было, свернуть обратно нет. Теперь свёрнутая и
   * развёрнутая формы — одна и та же строка, и вид строки `block-toggle`
   * исчез вместе с этой развилкой.
   *
   * Значок `▾`/`▸` — часть подписи, а не отдельная колонка: у заголовка нет ни
   * точки состояния, ни правых колонок, и ставить ради него сетку не за чем.
   */
  function sectionItem(section) {
    const text = window.PickerSections.sectionHeaderText(section);
    // Под запросом и под префиксом сворачивать нечего: секция там развёрнута
    // назначением сверху, и переключатель молчал бы. Заголовок в этом случае —
    // подпись, а не строка: ни `data-index`, ни класса `row`, и в `rows` он не
    // попадает — стрелки под запросом ходят прямо по найденному.
    if (!section.foldable) {
      return {
        key: `sec:${section.key}`,
        html: `<div class="group-label">${escapeHtml(text)}</div>`,
      };
    }
    const index = rows.length;
    rows.push({ kind: 'section', sectionKey: section.key, collapsed: section.collapsed });
    const mark = section.collapsed ? '▸' : '▾';
    return {
      key: `sec:${section.key}`,
      html: `<div class="row section" data-index="${index}">` +
        `<div class="text"><div class="name">${escapeHtml(`${mark} ${text}`)}</div></div>` +
        `</div>`,
    };
  }

  // Что нарисовано в каждом блоке. Своё состояние на блок, а не одно на весь
  // список: planListSync сравнивает содержимое одного контейнера, и общая
  // память заставляла бы его пересобирать все блоки на каждое изменение
  // любого. Ключ — тот же key блока.
  let renderedBlocks = new Map();
  // Каркас, который сейчас в DOM: ключи секций и их колонки. Сменился —
  // контейнеры пересобираются целиком; строки внутри правит planListSync, как
  // и раньше. Подписи в отпечатке нет намеренно: счёт в заголовке меняется
  // каждые несколько секунд, и входи он сюда, каркас пересобирался бы в такт
  // опросу.
  //
  // `null`, а не `''`, и это не придирка: пустая строка — законный каркас,
  // ровно тот, что получается из пустого набора блоков. Отмечай она заодно и
  // «в списке сейчас не блоки», первая же отрисовка пустого набора сравнила бы
  // `'' !== ''`, сочла каркас несменившимся и оставила бы на экране строки
  // узкого списка при пустом `rows`. `null` каркасом не бывает никогда,
  // поэтому переход из узкого режима всегда пересобирает контейнеры.
  let blocksShape = null;
  // Тело блока по его ключу. Искать по номеру узла больше нельзя: блоки лежат
  // не одним потоком, а внутри колонок, и порядок узлов в `#list` не совпадает
  // с порядком блоков.
  let blockBodies = new Map();

  // Подписи в каркасе нет: заголовок стал строкой и живёт внутри `.block-rows`
  // вместе с остальными. Снаружи он не был бы строкой, а его счёт менялся бы
  // каждые несколько секунд и пересобирал бы каркас в такт опросу.
  function blockCellHtml(section) {
    // Класс `collapsed` — признак для раскладки, а не украшение: свёрнутый
    // блок обязан быть высотой в свой заголовок, где бы он ни стоял. Долю
    // колонки ему давать нельзя — она вся ушла бы в пустоту.
    const collapsedClass = section.collapsed ? ' collapsed' : '';
    return `<div class="block${collapsedClass}" data-block="${escapeHtml(section.key)}">` +
      `<div class="block-rows"></div></div>`;
  }

  /**
   * Подзаголовок машины внутри блока чужих сессий.
   *
   * В `rows` не кладётся намеренно: это подпись, а не строка списка. Выбирать
   * её нечем — ни `data-index`, ни класса `row` у неё нет, — поэтому стрелки и
   * клик её не видят, а Enter на ней невозможен. Ровно так же ведёт себя
   * заголовок группы в узком списке.
   */
  function subheadItem(row) {
    return {
      key: `sh:${row.key}`,
      html: `<div class="group-label block-subhead">${escapeHtml(row.label)}</div>`,
    };
  }

  /**
   * Элементы одной секции: её заголовок и, если она развёрнута, её строки.
   *
   * Свёрнутая секция отдаёт один заголовок — строки при этом остаются в
   * `section.rows` нетронутыми, потому что по ним считается счёт в подписи.
   */
  function itemsOfSection(section, nowSec) {
    const from = rows.length;
    const items = [sectionItem(section)];
    if (section.collapsed) return items;
    if (section.kind === 'projects') {
      for (const row of section.rows) items.push(projectItem(row, nowSec));
    } else if (section.kind === 'snapshots') {
      for (const row of section.rows) items.push(snapshotItem(row, nowSec));
    } else {
      for (const row of section.rows) {
        items.push(row.kind === 'block-subhead' ? subheadItem(row) : sessionItem(row, nowSec));
      }
    }
    // Панель — на каждой строке, которую добавила эта секция, и в обеих
    // раскладках. Поле рядом с `block`, который проставляет renderWide, и не
    // вместо него: `block` — номер для стрелок, съезжающий вместе с
    // соседями, `panel` — постоянный ключ, по которому память переживает
    // смену списка. Свёрнутая секция сюда не доходит — у неё строк нет.
    for (let i = from; i < rows.length; i++) rows[i].panel = section.key;
    return items;
  }

  /** Секции текущего режима и раскладки. Один вызов на обе ветки render(). */
  function sectionsFor(mode, query) {
    return window.PickerSections.buildSections({
      groups, projects: projectRows, snapshots: snapshotItemsFor(query),
      mode, query, trackerHere: trackerIsHere(),
      layout: layoutName(), collapsed: collapsed[layoutName()],
      // Половинка своей раскладки, как и у collapsed: формы у них разные, и
      // выбирать нужную обязан тот, кто знает раскладку.
      order: order[layoutName()],
      hidden: hidden[layoutName()],
    });
  }

  /** Узкий список: секции одним потоком, сверху вниз. */
  function renderNarrow(sections, nowSec, items) {
    for (const section of sections) {
      for (const item of itemsOfSection(section, nowSec)) items.push(item);
    }
  }

  function renderWide(sections, nowSec) {
    // Свёрнутость входит в отпечаток каркаса: от неё зависит класс блока.
    // Без неё секция, свёрнутая на своём же месте (то есть не сменившая
    // порядок), осталась бы с прежним классом — и заняла бы долю колонки,
    // хотя показывает один заголовок. Счёта в отпечатке по-прежнему нет: он
    // меняется каждые несколько секунд и пересобирал бы каркас в такт опросу,
    // а свёрнутость меняется только рукой человека.
    const shape = sections.map(s => `${s.key}|${s.column}|${s.collapsed ? 1 : 0}`).join('\n');
    if (shape !== blocksShape) {
      // Колонки — flex-строка из flex-колонок, а не сетка. Сеткой это не
      // делается: колонка во всю высоту требует охватить все ряды, а
      // `grid-row: 1 / -1` считает `-1` по **явной** сетке, которой здесь нет —
      // ряды неявные, размеченные по содержимому, и охватывать нечего. Во
      // flex-колонке полная высота достаётся сама собой, растяжением.
      //
      // Пустая колонка не рисуется вовсе: она забрала бы у соседей свою долю
      // ширины ради пустоты. Поэтому же ширину колонки задаёт `flex`, а не
      // доля от их числа, — на `/p` и `/s` колонка остаётся одна и занимает
      // экран.
      const byColumn = Array.from({ length: WIDE_COLUMNS }, (_, i) => i + 1)
        .map(column => sections.filter(s => s.column === column))
        .filter(column => column.length);
      list.innerHTML = byColumn.map(column =>
        `<div class="block-col col-${column[0].column}">` +
        column.map(blockCellHtml).join('') + '</div>').join('');
      blocksShape = shape;
      renderedBlocks = new Map();
      blockBodies = new Map(Array.from(list.querySelectorAll('.block'),
        el => [el.getAttribute('data-block'), el.querySelector('.block-rows')]));
    }
    sections.forEach((section, i) => {
      // Сколько строк было до секции — считается ДО сборки её элементов, а не
      // вычитанием их числа: подзаголовок машины — элемент без строки, и
      // арифметика «строк ровно столько же, сколько элементов» на нём врёт.
      const before = rows.length;
      const items = itemsOfSection(section, nowSec);
      // Номер секции — на строке: по нему ходят стрелки (picker-sections.js).
      for (let n = before; n < rows.length; n++) rows[n].block = i;
      const body = blockBodies.get(section.key);
      const plan = window.PickerListSync.planListSync(
        renderedBlocks.get(section.key), items, body.children.length);
      applyPlan(body, plan);
      renderedBlocks.set(section.key, { keys: plan.keys, html: plan.html });
    });
  }

  /**
   * Режим и строка отбора, которые показаны на самом деле.
   *
   * Режим живёт в строке поиска, а не отдельным флагом: см. picker-mode.js. Но
   * режим снимков предлагается только там, где восстановление выполнимо, — те
   * же условия, что у ветки focus. Не выполнены — `/s` остаётся обычным
   * поиском по сессиям, и Enter делает привычное, а не молчит; отбор при этом
   * идёт по всей строке, вместе с префиксом: `/s` в таком поиске — то, что
   * человек ищет, а не команда.
   *
   * Считается один раз на обе раскладки, узкую и широкую, и потому вынесено
   * из render(): широкая ветка не может взять `mode` как есть — buildBlocks на
   * `snapshots` без трекера не отдаёт ни одного блока, и вместо поиска по
   * сессиям человек получил бы пустой экран без единого слова о том, почему.
   * Две копии этого отката разошлись бы на первой же правке — они уже
   * разъезжались ровно здесь.
   */
  function shownModeAndQuery() {
    const { mode, query } = window.PickerMode.parseQuery(search.value);
    if (mode !== 'snapshots' || trackerIsHere()) return { mode, query };
    return { mode: 'sessions', query: search.value.trim() };
  }

  function render() {
    const nowSec = Math.floor(Date.now() / 1000);
    rows = [];
    const items = [];
    // Признак ставится здесь, а не в buildProjectList: тот про ответ
    // агрегатора, а «встала ли клавиша» знает только эта машина, и меняется
    // отдельным событием — не в такт опросу, который перестраивает projectRows.
    window.ProjectList.markHotkeysTaken(projectRows, hotkeysTaken);
    const { mode, query } = shownModeAndQuery();
    list.classList.toggle('blocks', fullscreen);
    const sections = sectionsFor(mode, query);
    if (fullscreen) {
      // Узкое состояние отрисовки сбрасывается: вернувшись, planListSync
      // сравнил бы новые строки со старым снимком чужой раскладки и правил бы
      // не те элементы. Тот же сброс в обратную сторону — ниже.
      rendered = { keys: [], html: [] };
      renderWide(sections, nowSec);
    } else {
      blocksShape = null;
      renderedBlocks = new Map();
      renderNarrow(sections, nowSec, items);
      syncList(items);
    }
    // Отказ показывается и поверх непустого списка: строки в нём с прошлого
    // удачного опроса, и молчать о том, что свежих больше не приходит, нельзя.
    if (notice) {
      // Ответ на только что нажатую клавишу важнее отказа опроса: отказ никуда
      // не денется и вернётся, когда таймер погасит подпись.
      message.style.display = 'block';
      message.textContent = notice;
    } else if (error) {
      message.style.display = 'block';
      message.textContent = error;
    } else if (hotkeysTaken.length) {
      message.style.display = 'block';
      // Единственное место, где человек узнаёт про не вставшую клавишу.
      // Формулировку складывает тот же помощник, что помечает строки: две
      // копии разошлись бы на первой же правке.
      message.textContent = window.ProjectList.hotkeysTakenMessage(hotkeysTaken);
    } else {
      message.style.display = rows.length ? 'none' : 'block';
      if (!rows.length) {
        // Отката в поиск по сессиям у этих трёх режимов нет намеренно: пустая
        // история — факт, а не непонятая команда, и подмена списка молча врала
        // бы про причину. Способность гейтит только снимки, и их откат живёт в
        // shownModeAndQuery.
        message.textContent = mode === 'local' ? 'No sessions on this machine.'
          : mode === 'remote' ? 'No sessions on other machines.'
          : mode === 'history' ? 'Nothing in history.'
          : mode === 'projects'
          // Пустой список проектов почти всегда значит «агрегатор на той
          // стороне ещё не отдаёт projects», и молчать об этом нельзя: на вид
          // это не отличить от «ничего не нашлось». Но на холодном окне и
          // после неудачного опроса projectRows пуст просто потому, что ответа
          // ещё не было, — винить хост, который не успел ответить, нечестно.
          // Признак ответа тот же, что и у окон: непустой lastState.
          ? (projectRows.length ? 'Nothing matches.'
            : lastState.sessions ? 'No projects — is ccfzf on the host up to date?'
              : 'Loading…')
          // Тот же `mode`, что и у обеих раскладок выше: подсказка про
          // недостающие снимки обязана быть одна на узкий список и на блоки, а
          // откат `/s` в поиск по сессиям — не показывать её вовсе.
          : mode === 'snapshots'
            ? (snapshotRows.length ? 'Nothing matches.'
              // Пустой список снимков почти всегда значит «трекер на той
              // стороне ещё не научился их публиковать» — на вид это не
              // отличить от «раскладок ещё не запоминали».
              : lastState.sessions ? 'No snapshots — is the window tracker up to date?'
                : 'Loading…')
            : (groups.length ? 'Nothing matches.' : 'No claude sessions yet.');
      }
    }
    if (selectionReset) {
      selectionReset = false;
      active = window.PickerSections.firstRowInPanel(rows, activePanel, HEADER_KINDS);
    }
    if (active >= rows.length) active = Math.max(0, rows.length - 1);
    paint();
  }

  /**
   * Разложить последний ответ агрегатора по группам и перерисовать.
   *
   * Через buildSessionsPayload, а не groupSessions напрямую: имя строки
   * приписывает labelSessions внутри него, и мимо него строка приезжает в
   * разметку без label — имя рисуется как undefined, а поиск перестаёт
   * находить что-либо.
   */
  function regroup() {
    // Режим и запрос берутся у той же shownModeAndQuery, по которой живёт
    // отрисовка: второй разбор строки поиска разошёлся бы с первым, и отсевы
    // отступали бы не там, где человек видит режим.
    const shown = shownModeAndQuery();
    // Спрошенное перебивает отобранное: непустой запрос и любой префикс
    // отменяют оба отсева. Правило живёт рядом с самими отсевами, в
    // session-groups.js, — здесь только подача.
    const filters = window.SessionGroups.activeFilters({
      mode: shown.mode,
      query: shown.query,
      // showAll перекрывает onlyLive, а не заменяет его: конфиг задаёт, с чем
      // пикер открывается, галка — разовое «покажи и мёртвые тоже». Обратной
      // галки нет намеренно: включённый onlyLive и есть умолчание, а вторая
      // галка «только живые» поверх настройки читалась бы как второй фильтр.
      onlyLive: CONFIG.onlyLive && !toggles.showAll,
      onlyWindow: toggles.onlyWindow,
    });
    const payload = window.SessionGroups.buildSessionsPayload(
      // Верхние поля ответа переезжают сюда поимённо: на старом агрегаторе
      // только они и называют машину окна, а пересобранный ответ их терял.
      {
        ok: true, sessions: lastSessions, seen,
        windowHost: lastState.windowHost, windowPid: lastState.windowPid,
      },
      sortMode,
      { ...filters, configHost: CONFIG.windowHost },
    );
    groups = payload.groups;
    sortMode = payload.sort;
    paintSort();
    // Галки красятся не на каждый опрос: без этого вызова состояние чекбоксов
    // догоняло бы список только после клика по одному из них. Условность
    // подсказок сюда больше не относится — она уехала в справочник клавиш,
    // который собирается заново на каждое открытие.
    paintToggles();
    render();
  }

  /**
   * Принять свежий список занятых комбинаций — общий код для события
   * project-hotkeys и разового опроса project_hotkeys_taken на старте.
   *
   * Один помощник, а не две копии `hotkeysTaken = [...]; regroup();`:
   * подписка ловит только то, что случится после неё, а клавиши вешаются в
   * Rust ещё в setup(), раньше, чем догрузилась эта страница, — без разового
   * опроса тем же кодом первый отказ, случившийся до подписки, не показался
   * бы никогда.
   */
  function applyHotkeysTaken(taken) {
    hotkeysTaken = Array.isArray(taken) ? taken : [];
    regroup();
  }

  // Хвост последнего ответа агрегатора, кроме самих сессий: на какой машине
  // открыты окна и какому процессу они принадлежат. Пустой объект — рабочее
  // состояние, а не поломка: оконного трекера может не быть вовсе.
  let lastState = {};

  /**
   * Жив ли трекер на этой машине и умеет ли он поднимать окна.
   *
   * Вопрос про машину целиком, а не про строку: доступен ли режим снимков и
   * показывать ли подсказку о нём. Настроенный брокер — не второе решение, а
   * условие выполнимости: просьба уходит только публикацией, и без брокера её
   * некуда отправить. Предложить режим, у которого нет транспорта, значит
   * подарить человеку молчащий Enter.
   */
  function trackerIsHere() {
    return CONFIG.mqtt.configured
      && !!window.SessionWindows.trackerHere(lastState, CONFIG.windowHost);
  }

  /**
   * Поднимать ли окно этой строки.
   *
   * Раньше на этот вопрос отвечала машина целиком, и другого ответа быть не
   * могло: трекер был один. Теперь окно строки может стоять на соседней
   * машине, и подъём его отсюда ничего не дал бы человеку перед экраном.
   */
  function rowCanFocus(row) {
    return CONFIG.mqtt.configured
      && window.SessionWindows.canFocusRow(row, lastState, CONFIG.windowHost);
  }

  /**
   * Трекер, чей менеджер откроет сессию. Ответ на вопрос про машину, а не про
   * строку: у строки проекта окна нет вовсе.
   */
  function openManagerHere() {
    return window.SessionWindows.openManager(lastState, CONFIG.windowHost);
  }

  /** Запись снимка по его id — из отобранных, то есть только своей машины. */
  function snapshotById(id) {
    return snapshotRows.find(s => s && s.id === id) || null;
  }

  /**
   * Машина, которой уходит просьба о восстановлении, — или `null`, если такой
   * машины нет.
   *
   * Вопрос здесь не «чей это снимок»: снимки в списке и так только свои,
   * `snapshotsHere` отобрала их по машине. Вопрос — «берётся ли менеджер этой
   * машины за раскладку», и отвечает на него `openManager`: он же отбирает
   * трекеры по полю `openSession`. Второй разбор того же списка разошёлся бы с
   * ним на первой же правке.
   *
   * Мак снимки делает, а менеджера у него нет: трекер там объявляет
   * `openSession: false`, `openManager` его отбрасывает и отвечает либо чужой
   * машиной, либо `null` — в обоих случаях `chooseOpenTransport` даёт `local`,
   * и восстановление уходит в местную ветку. Возьми мы `host` прямо у снимка,
   * на маке вышло бы `manager`, и просьба уехала бы в топик, который никто не
   * слушает: молча, потому что у публикации нет ответа.
   *
   * Адрес при этом берётся у снимка, а не у менеджера: у каждой машины свой
   * префикс топиков, и просьба обязана уйти той, что снимок сняла. Пустая
   * строка значит «спроси свой конфиг» — так её читает `resolve_base` в
   * `src-tauri/src/mqtt.rs`.
   */
  function snapshotOwner(id) {
    const snap = snapshotById(id);
    if (!snap) return null;
    const manager = window.SessionWindows.openManager(lastState, CONFIG.windowHost);
    if (!manager) return null;
    return { host: manager.host, mqttBase: window.PickerSnapshots.snapshotBase(snap) };
  }

  /** Куда просить о подъёме окна этой строки. Пусто — спросим свой конфиг. */
  function focusBase(row) {
    return window.SessionWindows.mqttBaseFor(row, lastState);
  }

  /** Куда просить об открытии сессии. Пусто — спросим свой конфиг. */
  function managerBase() {
    return (openManagerHere() || {}).mqttBase || '';
  }

  /**
   * Ответ агрегатора приехал.
   *
   * Опрос идёт в Rust: у скрытого окна webview тормозит таймеры, а WebView2 у
   * свёрнутого умеет усыплять страницу целиком — фон на setInterval замолчал
   * бы молча. Здесь остаётся только разбор ответа, тот же, что был.
   */
  function applyState(payload) {
    // Пока человек тащит заголовок, список не перерисовывается. Подача тикает
    // раз в секунду, planListSync правит изменившиеся элементы — и
    // перетаскиваемый узел подменился бы под указателем прямо в движении; в
    // широкой раскладке вдобавок пересобрался бы каркас блоков целиком.
    // Придержанный ответ применяется сразу после отпускания (endDrag).
    if (drag) { heldState = payload; return; }
    const state = payload && payload.state;
    if (!state) {
      // Отказ без единого удачного ответа — показывать нечего, кроме отказа.
      if (payload && payload.error) error = String(payload.error);
      render();
      return;
    }
    const problems = window.StateShape.validateState(state);
    if (problems.length) {
      error = problems[0];
      render();
      return;
    }
    // Претензии к записям projects опрос не отбрасывают: агрегатор обновляется
    // сам по себе, и переименованное там поле проекта заморозило бы список
    // сессий, к проектам отношения не имеющий. Кривые записи выбросит
    // buildProjectList, а человек узнаёт о потере из той же строки отказа, что
    // и обо всём остальном, — она показывается и поверх непустого списка.
    //
    // Претензии к записям снимков — по той же причине и в ту же строку. Первая
    // непустая строка отказа побеждает: показывается всё равно одна.
    //
    // Отказ ssh стоит первым: он про то, что список устарел целиком, а
    // остальные — про отдельные записи в нём.
    error = (payload && payload.error ? String(payload.error) : '')
      || window.StateShape.projectProblems(state)[0]
      || window.StateShape.snapshotProblems(state)[0] || '';
    lastSessions = state.sessions;
    // Поля может не быть — старый агрегатор на той стороне. Тогда режим /a
    // покажет пустой список, и это честный ответ, а не поломка.
    projectRows = window.ProjectList.buildProjectList(state);
