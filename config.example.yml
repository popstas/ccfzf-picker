# Скопируйте в ~/.config/ccfzf-picker/config.yaml
# (на Windows — %USERPROFILE%\.config\ccfzf-picker\config.yaml).
# Файла нет — пикер работает на умолчаниях, кроме sshHost: без него список брать
# неоткуда.

# Хост, на котором живут сессии и агрегатор ccfzf. Умолчания нет.
# Любая форма, понятная ssh: имя из ~/.ssh/config, user@host, host.domain.
sshHost: example-host

# Глобальный хоткей показа пикера. SUPER — это Cmd на маке и Win на Windows,
# одна запись даёт обе комбинации. Занятую системой комбинацию зарегистрировать
# не выйдет: приложение напишет об этом в stderr и продолжит работать — окно
# поднимается из трея.
hotkey: Cmd+Shift+C

# Второй глобальный хоткей: открывает пикер сразу в режиме проектов — то же,
# что `^A` внутри окна. Умолчание тут своё на каждой системе, одной записью они
# не сходятся: Win+Shift+F10 на Windows, Option+Cmd+Shift+C на маке. Поэтому
# пустое значение (и отсутствие ключа) значит «взять встроенное», а не
# «выключить». Отказ регистрации виден подписью пункта в трее.
projectsHotkey: ''

# Чем открывать сессию. file — путь к бинарю терминала, args — его аргументы
# до `ssh`. На Windows это обычно wt.exe с пустым args.
terminal:
  file: /opt/homebrew/bin/kitty
  args:
    - --single-instance

# Возможности той стороны. Оба false, потому что умолчания отвечают на вопрос
# «что делать, когда про удалённый хост ничего не известно»: reptyr там может
# быть не установлен, а перехват — это чужой процесс под сигналом.
caps:
  reptyr: false
  takeover: false

# Показывать только работающие сессии. false покажет и все прежние — их могут
# быть сотни.
onlyLive: true

# Гасить окно, когда фокус ушёл мимо него.
hideOnBlur: true

# Размер окна пикера — долями экрана, по стороне на каждую раскладку: `narrow`
# — обычный список, `wide` — широкий режим, тот самый, что включает `^F`.
#
# Ноль (и отсутствие ключа) значит «взять встроенный размер»: 900×640 в узкой
# раскладке и 1400×900 в широкой, причём широкий ещё и зажимается по экрану,
# чтобы под окном осталось видно, что было. Названная доля не зажимается: её
# просили, её и получают.
#
# Проценты, а не пиксели: вопрос обычно не «сколько точек», а «сколько сессий
# влезет», и число, верное на одном экране, на втором значит другое. На большом
# мониторе высота узкого списка под 80% вмещает заметно больше сессий, чем
# встроенные 640.
#
# Правило значения: `0` — встроенный размер (Default); `1..=100` — доля экрана
# в процентах; `101` и больше — пиксели (та же ширина/высота, но абсолютным
# числом, а не долей). Зазор между долями и пикселями, `(100..101)`,
# отрицательное, нецелое (кроме дробной доли или дробных пикселей, которые
# сами по себе годятся) и не-число читаются как мусор и откатываются на
# встроенный размер — со строкой в stderr. Окно настроек предлагает выбор из
# готовых долей и отдельное поле пикселей (вкладка Window popup), но вписанное
# сюда руками оно покажет как есть.
pickerSize:
  narrow:
    width: 0
    height: 0
  wide:
    width: 0
    height: 0

# Затемнять ли рабочий стол позади пикера, по флагу на каждую раскладку —
# узкую и широкую. Оба false по умолчанию. Ставит подложку нативное окно
# процесса пикера (`src-tauri/src/scrim.rs`), не второй webview: на Windows —
# layered popup на весь экран того же монитора, что и пикер, на macOS —
# `NSWindow` с чёрной полупрозрачной заливкой уровнем ниже окна пикера.
# Opacity фиксирован (~0.45), крутилки на него нет. На Linux ключи хранятся и
# игнорируются — подложки там не бывает.
scrim:
  narrow: false
  wide: false

# Опрашивать агрегатор и при закрытом окне: раз в минуту, а при тишине реже —
# 2, 4, 8 минут, — и снова раз в минуту, как только что-то изменилось.
#
# Нужно это не только ради тёплого списка к следующему открытию. `ccfzf --state`
# переписывает свой дамп, а с того дампа живут экспорт в Home Assistant и
# панель openHASP: закрытый пикер, который перестал спрашивать, останавливает и
# панель. Там, где панели нет, это лишний ssh раз в минуту — выключайте.
backgroundRefresh: true

# Имя машины, на которой работает этот пикер.
#
# Про открытые окна терминалов рассказывает сам агрегатор — он читает файл,
# который кладёт рядом оконный трекер, и сообщает заодно, на какой машине те
# окна. Пометка об окне видна всегда; это поле решает единственный вопрос —
# поднимать ли окно по Enter.
#
# Совпало с именем из ответа — окна на этом экране, и Enter поднимает окно
# вместо второго процесса на том же транскрипте. Не совпало или поле не задано —
# Enter открывает терминал, как раньше: поднимать окно на чужом экране незачем.
# windowHost: your-windows-box

# Брокер MQTT — через него уходят все просьбы к оконному трекеру: подъём окна
# публикуется в `<base>/windows/claude-focus`, возврат сессии в непрочитанное —
# в `<base>/windows/claude-session-unread`, открытие сессии терминалом на
# машине трекера (Enter с windowHost и открытие «Open on <host>» с чужой
# машины) — в `<base>/windows/claude-session-open`; публикует его команда
# `open_session_mqtt` этого приложения. Все топики уже слушает демон на
# Windows-машине.
#
# Без брокера ни одна из этих просьб не предлагается вовсе: другого
# транспорта у них нет. HTTP-сервер, задуманный здесь раньше, не может
# работать в принципе — webview Tauri режет такой запрос как cross-origin
# ещё до отправки. «Mark unread» без брокера остаётся местным — а значит, у
# сессии с открытым окном ничего не меняет: отметку трекера местная не
# перебивает. Совпал windowHost, но брокера нет — Enter, как и раньше без
# этого поля, открывает терминал локально: маппинг проекта на профиль
# Windows Terminal (claudeWt.projects) в этом случае просто недостижим.
# mqtt:
#   host: broker.example.com
#   port: 1883
#   user: ''
#   password: ''
#   base: home/room/pc

# Одно дерево каталогов, видное с двух сторон: слева путь на удалённом хосте,
# справа — как та же папка примонтирована на этой машине (сетевой диск, sshfs,
# общая папка виртуалки). Умолчания нет: примонтировано у всех по-своему.
#
# Не задано или задана только половина пары — действий открытия папки не будет
# вовсе. Сессия, чей каталог лежит вне `remote`, их тоже не получит: пункт,
# открывающий несуществующую папку, хуже отсутствующего.
#
# На Windows справа обычно стоит буква примонтированного диска с двоеточием и
# обратным слэшем, на маке — каталог в /Volumes.
# pathMap:
#   remote: /home/user
#   local: /Volumes/remote-home

# Чем открывать папку сессии. Пикер не знает ни одного приложения по имени: он
# подставляет путь в argv и запускает его сам, без шелла — кавычить и
# экранировать ничего не нужно, каждый элемент списка уходит отдельным
# аргументом.
#
# Работает только вместе с pathMap: без перевода пути подставлять нечего.
#
# id       — короткое имя, любое; по нему действие отличается от соседей.
# label    — подпись в меню Ctrl+K. Не задана — берётся id.
# hotkey   — комбинация в окне пикера, например Ctrl+Shift+E. Занятую самим
#            окном (Ctrl или Cmd с D, F, G, H, I, K, L, N, P, R, S, U) взять не
#            выйдет: действие останется в меню, но без клавиши. Список этот
#            растёт — сверяйтесь со справочником клавиш по F1, там показано
#            занятое на самом деле. Ctrl и Cmd здесь разные.
# argv     — команда. Плейсхолдеры:
#              {localPath}      путь на этой машине
#              {localPathSlash} он же прямыми слэшами — нужен для `cmd /c
#                               start`, который обратные слэши съедает и папку
#                               не открывает
#              {remotePath}     исходный путь на удалённом хосте
# icon     — необязательный: откуда взять иконку пункта меню. Пусто —
#            берётся argv[0]. Нужен там, где argv[0] не приложение: проводник
#            открывается через `cmd /c start`, и без ключа пункт показал бы иконку
#            командной строки. Переменные окружения раскрываются.
#
# Примеры под разные системы — возьмите те, что подходят вашей:
# actions:
#   # Windows: проводник и Cursor.
#   - id: explorer
#     label: Open in Explorer
#     hotkey: Ctrl+Shift+E
#     argv: ['cmd', '/c', 'start', '', '{localPathSlash}']
#     icon: '%SystemRoot%\explorer.exe'
#   - id: cursor
#     label: Open in Cursor
#     # Ctrl+O is the picker's own sort switch, so this action gets no global
#     # hotkey. In the Ctrl+K menu it answers to a bare `o`.
#     menuKey: o
#     argv: ['cursor', '{localPath}']
#   # macOS: Finder и VS Code.
#   - id: finder
#     label: Open in Finder
#     hotkey: Cmd+Shift+E
#     argv: ['open', '{localPath}']
#   - id: vscode
#     label: Open in VS Code
#     hotkey: Cmd+Shift+V
#     argv: ['code', '{localPath}']

# Project hotkeys live in windows11-manager (claudeWt.projects) and reach the
# picker through `ccfzf --state`. There is no key for them here on purpose: two
# lists kept in sync by hand is exactly what this replaced.
