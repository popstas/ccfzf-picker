# Скопируйте в ~/.config/ccfzf-picker/config.yaml
# (на Windows — %USERPROFILE%\.config\ccfzf-picker\config.yaml).
# Файла нет — пикер работает на умолчаниях, кроме sshHost: без него список брать
# неоткуда.

# Хост, на котором живут сессии и агрегатор ccfzf. Умолчания нет.
# Любая форма, понятная ssh: имя из ~/.ssh/config, user@host, host.domain.
sshHost: example-host

# Глобальный хоткей показа пикера. SUPER — это Cmd на маке и Win на Windows,
# одна запись даёт обе комбинации. Занятую системой комбинацию зарегистрировать
# не выйдет: приложение напишет об этом в stderr и продолжит работать — окно
# поднимается из трея.
hotkey: Cmd+Shift+C

# Чем открывать сессию. file — путь к бинарю терминала, args — его аргументы
# до `ssh`. На Windows это обычно wt.exe с пустым args.
terminal:
  file: /opt/homebrew/bin/kitty
  args:
    - --single-instance

# Возможности той стороны. Оба false, потому что умолчания отвечают на вопрос
# «что делать, когда про удалённый хост ничего не известно»: reptyr там может
# быть не установлен, а перехват — это чужой процесс под сигналом.
caps:
  reptyr: false
  takeover: false

# Показывать только работающие сессии. false покажет и все прежние — их могут
# быть сотни.
onlyLive: true

# Гасить окно, когда фокус ушёл мимо него.
hideOnBlur: true

# Оконный трекер: откуда пикер узнаёт, у какой сессии уже открыт терминал.
# Без этого поля пикер работает как раньше — просто без пометок об окнах, и ни
# одного запроса не делает.
#
# Петлевой адрес значит «окна на этой же машине»: тогда Enter на сессии с
# открытым окном поднимает его, а не заводит второй процесс на том же
# транскрипте. Адрес по имени другой машины даёт только пометку и фильтр —
# поднимать окно на чужом экране незачем.
# windowTracker:
#   url: http://localhost:9722

# Брокер MQTT — второй способ попросить о подъёме окна. Публикация уходит в
# `<base>/windows/claude-focus`, тот самый топик, который уже слушает демон на
# Windows-машине. Нужен там, где http до трекера не дотягивается.
#
# Когда задан, подъём окна идёт через него, а не через windowTracker.url. Само
# решение «поднимать окно или открывать терминал» брокер не меняет: его
# по-прежнему принимает windowTracker.url — петлевой значит «окна на этой же
# машине».
# mqtt:
#   host: broker.example.com
#   port: 1883
#   user: ''
#   password: ''
#   base: home/room/pc

# Проектные хоткеи: комбинация открывает новую сессию в каталоге.
# Каталог — на удалённом хосте, не на локальной машине.
projects:
  - path: /home/user/projects/demo
    hotkey: Cmd+Shift+1
